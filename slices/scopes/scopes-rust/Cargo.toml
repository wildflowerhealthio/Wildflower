[package]
name = "scopes-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# OAuth 2.0 / SMART on FHIR scope primitives. Deliberately dependency-free —
# the grammar needs only `std::collections::HashSet` and the constants are
# `&str`, so every slice that reasons about scopes can depend on this leaf
# crate without pulling in a transitive graph.

# Opt into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true
