[package]
name = "databases-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The host-side data-management slice: a small RESTy surface over the host's
# SQLite databases (`health-data.sqlite`, `wildflower.sqlite`). It exports each
# database as a consistent snapshot (`GET /databases/{id}`) and deletes it on
# disk (`DELETE /databases/{id}`), plus a metadata listing (`GET /databases`)
# for the settings screen. Unlike the other `-rust` slices it owns no store and
# runs no migrations — it works at the file level on databases other slices own,
# so the host passes it only the data directory. Layered like `apps-rust` /
# `tunnel-rust`: pure `catalog`/`metadata`/`files` helpers behind the `http`
# surface; authN comes from the consumer (the gatekeeper bearer gate) and
# download/delete are scope-gated per database (`http::scoped`).
[dependencies]
axum.workspace = true
serde = { workspace = true }
serde_json.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
rusqlite.workspace = true
# The scope grammar (`Scope`, `Grant`) the per-database read/delete gate checks
# against — see `http::scoped`. Each database's governing scope is host policy
# carried on its `DatabaseDescriptor`.
scopes-rust = { path = "../../scopes/scopes-rust" }
# The shared opaque-500 `InternalError` template (see `http::errors`).
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = ["http-errors"] }
# The generic scope-gated capability extractors (`Scoped<F>`, `Capability`,
# `ScopeClaims`, `insufficient_scope`) the `/databases` surface gates on; the
# `openapi` feature lets the 403 wire body appear in the documented responses.
scope-capabilities-rust = { path = "../../scopes/scope-capabilities-rust", features = ["openapi"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
# The export streams a temp snapshot off the async runtime: `spawn_blocking` for
# the blocking VACUUM/IO (rt), `tokio::fs::File` (fs) wrapped by `ReaderStream`
# (tokio-util io) into an axum `Body::from_stream` (futures-core `Stream`).
tokio = { workspace = true, features = ["rt", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-core = "0.3"
# The `DatabaseFiles` port's `read_catalogue_metadata` is `async` behind an
# `Arc<dyn …>`, which native `async fn` can't do dyn-compatibly — so the port and
# its adapter use `#[async_trait]`, as `TunnelService` / `JtiCache` do elsewhere.
async-trait = "0.1"

[lints]
workspace = true

[dev-dependencies]
# The shared OpenAPI snapshot helper (assert/regenerate the committed spec); only
# the snapshot test uses it, so it's a dev-dependency with the opt-in feature.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = ["openapi-snapshot"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
