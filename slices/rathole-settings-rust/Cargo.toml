[package]
name = "rathole-settings-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The wire shape of the relay's `GET /rathole`: everything public a rathole
# client needs to dial the relay, the tunnel name a device adds to it, and the
# `TunnelHost` its signed `GET /me` returns, with the checks both ends apply to
# a dial address (`parse_public_addr`) and a relay domain (`RelayDomain`). Its
# own thin crate so both ends share one declaration without pulling each other
# in: `wildflower-relay` serves both, renders its rathole server TOML with the
# same transport and noise pattern, checks its tunnel names with `TunnelName`
# and its public control address with `parse_public_addr`; `tunnel-rust` (the
# device's rathole client) deserializes `GET /rathole`, and `servers-rust`
# stores it and reads `GET /me`.
[features]
# The PROXY protocol v2 header the relay writes ahead of each visitor's bytes
# (`proxy_header`). The relay enables it to write the header, and
# `wildflower-server-rust`'s tests to build the headers its tunnel listener
# reads.
proxy-header = ["dep:ppp"]

[dependencies]
ppp = { workspace = true, optional = true }
serde.workspace = true
# The `Display`/`Error` wiring of `InvalidTunnelName`, `InvalidRelayDomain` and
# `InvalidPublicAddr`.
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
