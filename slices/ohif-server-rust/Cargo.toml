[package]
name = "wildflowerhealthio-ohif-server"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The OHIF server slice: a scope-gated endpoint that serves DICOM file bytes
# decoded from FHIR DocumentReference attachments. HFS holds the clinical data;
# this crate wraps one read path for the OHIF viewer's HTTP fetch. Layered like
# `wildflowerhealthio-collector` / `wildflowerhealthio-tunnel`: pure `domain`, `hfs` adapter, and `http`.
[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes = "1"
serde.workspace = true
serde_json.workspace = true
# In-process re-drive of HFS's router via `oneshot`.
tower.workspace = true
wildflowerhealthio-scopes = { path = "../scopes/scopes-rust" }
wildflowerhealthio-scope-capabilities = { path = "../scopes/scope-capabilities-rust", features = ["openapi"] }
wildflowerhealthio-shared-structures = { path = "../shared-structures/shared-structures-rust", features = ["http-errors"] }
utoipa.workspace = true
utoipa-axum.workspace = true

[lints]
workspace = true

[dev-dependencies]
wildflowerhealthio-shared-structures = { path = "../shared-structures/shared-structures-rust", features = ["openapi-snapshot"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http-body-util.workspace = true
