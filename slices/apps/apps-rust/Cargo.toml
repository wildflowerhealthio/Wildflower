[package]
name = "apps-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The apps slice, host-side: SQLite-backed selection of bundled apps plus a
# CRUD surface for user-defined custom apps, the `/apps` HTTP routes the
# webview consumes (list + launch redirect), and the owner-gated admin routes
# the consumer wraps with the gatekeeper. Layered like `tunnel-rust` and
# `gatekeeper-rust`: pure `domain`, `db`, and `http`.
[dependencies]
anyhow.workspace = true
axum.workspace = true
serde = { workspace = true }
serde_json.workspace = true
rusqlite.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
persistence-rust = { path = "../../persistence/persistence-rust" }
# The tunnel service contract a `requires_tunnel` launch resolves through,
# plus the shared forwarding-header provenance helper (`request_provenance`,
# `served_origin_for`) the launch handler dispatches and renders against —
# same contract gatekeeper-rust uses to resolve token issuer URLs.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = [
  "tunnel-service",
  "served-origin",
  "subdomain-url",
] }
# The server-side infra `SelfHostedAppsService` drives: `StaticHostsService`
# binds each self-hosted app on its loopback port, `ProxyTable` registers it for
# the host's subdomain reverse proxy.
shared-structures-server-rust = { path = "../../shared-structures/shared-structures-server-rust" }
# Builds the static-file-serving router for each self-hosted app from its on-disk
# directory (same slice).
vendor-apps-rust = { path = "../vendor-apps-rust" }
# `CorsLayer::very_permissive` on each self-hosted app's router (its own origin
# is cross-origin to the main API the SPA fetches from).
tower-http.workspace = true
rand = "0.10"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
# The OpenAPI snapshot helper enables the extra `openapi-snapshot` feature;
# `async-trait` is only used by the `TunnelService` test stubs.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = ["openapi-snapshot"] }
async-trait = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
