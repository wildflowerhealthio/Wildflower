[package]
name = "vendor-apps-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# Host-side serving for static "installed apps". `setup_vendor_apps(root)` hands
# back an axum router that serves files from a host-provided directory at request
# time (rather than embedding them at build time), under
# `/installed-apps/{*path}`. Updating an app — or dropping a new one in — needs
# no recompile. The patient-browser SMART config is the one exception: it's
# embedded (committed) and served verbatim. No tauri/GTK dependency, so it builds
# in the main (non-Tauri) Rust CI; wildflower-tauri merges the router into its
# loopback API surface and points it at a directory under app-data. When the
# directory is absent/empty the routes 404 — the crate still compiles.
[dependencies]
axum.workspace = true
# `ServeDir` (with `mime_guess` content-type detection + traversal protection)
# does the static file serving; we layer the patient-browser HTML rebase and
# the committed-config override on top. The workspace pins tower-http for
# `cors`; this crate adds `fs` for `ServeDir`.
tower-http = { workspace = true, features = ["fs"] }
# `tracing::warn!` on the rare HTML-rebase buffering failure (logged 500
# instead of a panic). Local pin matches apps-rust.
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
