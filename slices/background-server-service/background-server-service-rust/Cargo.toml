[package]
name = "background-server-service-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The serde mirror of the background server service's bridge wire, pinned by
# golden tests to `bridge-wire-golden.json`. No `tauri` dependency.
[dependencies]
serde.workspace = true

# Opt this crate into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true

[dev-dependencies]
proptest = "1"
serde_json.workspace = true
