[package]
name = "background-server-service-android-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The JNI functions `tauri-plugin-background-service`'s Android `HeadlessBridge`
# calls in the host's library, and the flag the host sets once it runs the
# server. The host links it only on Android; it compiles and tests on any
# target. It goes away with #886.
[dependencies]
# The exports' JNI types. 0.21 is the version tao and wry link on Android.
jni = "0.21"
# Builds the JSON each export returns.
serde_json.workspace = true

# Not `workspace = true`: the workspace forbids `unsafe_code`, a `forbid` can't
# be allowed locally, and every JNI export needs `#[unsafe(no_mangle)]`. So this
# crate denies it and `jni_exports.rs` allows it on the exports alone. Every
# other workspace lint applies as is; a test compares this table with the
# workspace's.
[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
# Reads this manifest and the workspace's for the lint-table test.
toml = "0.9"
