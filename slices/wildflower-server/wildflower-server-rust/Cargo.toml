[package]
name = "wildflower-server-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The Wildflower server: `serve` composes every server slice (gatekeeper, emr,
# OHIF, collector, tunnel, request log, apps, databases) into the API and serves
# it on the loopback port and the tunnel listener until its shutdown token is
# cancelled, with its `/health` and the reachability monitor that reads it
# through the public origin. No `tauri` dependency —
# the Tauri host hands in its native adapters as trait objects — so it compiles
# and tests without GTK.
[features]
# Test support for this crate's own integration tests:
# `WildflowerServer::tunnel_stream_sender`, which hands the tunnel listener a
# visitor's connection the way the tunnel does. Only the dev-dependency on this
# crate below enables it.
test-support = []

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
tower-http.workspace = true
# `net` binds the loopback listener; `sync` carries the host's owner-token,
# pending-consent and server-health `watch` channels and the tunnel's visitor
# streams; `time` and `macros` pace and bound the reachability monitor's probes
# and the `/health` checks, and bound a tunnel connection's PROXY header, which
# `io-util` reads.
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros", "io-util"] }
# The PROXY protocol v2 header ahead of a tunnel connection (see
# `src/http/tunnel_listener/proxy_header.rs`).
ppp.workspace = true
# `CancellationToken`, the shutdown signal `serve` takes.
tokio-util = "0.7"
tracing = "0.1"
# Typed loopback base URL handed to the slices' configs and the 404 fallback.
url = "2"
# The reachability monitor's `/health` probe. `rustls-tls` (no openssl) matches
# the project's openssl avoidance; `json` decodes the health report. reqwest is already
# a transitive dependency (via helios), so this adds no new build cost.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
# The monitor's `HealthProbe` port and `HealthCheckService` are `#[async_trait]`s.
async-trait = "0.1"
# Each `/health` check's `time`.
chrono = { workspace = true, features = ["clock"] }
# The `server` `/health` check's `SELECT 1` on the shared diesel pool.
diesel.workspace = true
apps-rust = { path = "../../apps/apps-rust" }
collector-rust = { path = "../../collector/collector-rust" }
databases-rust = { path = "../../databases/databases-rust" }
emr-rust = { path = "../../emr/emr-rust" }
gatekeeper-rust = { path = "../../gatekeeper/gatekeeper-rust" }
ohif-server-rust = { path = "../../dicom/ohif-server-rust" }
persistence-rust = { path = "../../persistence/persistence-rust" }
request-log-rust = { path = "../../request-log/request-log-rust" }
# Names the per-database export/delete `Scope`s the databases catalogue declares.
scopes-rust = { path = "../../scopes/scopes-rust" }
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = [
  "health-check",
  # `served_base_url_for`: the unmatched-route 404 links back to the request's
  # served origin (see `src/http/not_found.rs`); `is_forwarded` for the loopback
  # owner trust; the forwarded-request report's client address and served host.
  "served-origin",
] }
# Built once on the shared db and threaded into both gatekeeper and the FHIR
# server so the auth gate and HFS read one revocation denylist/epoch store (#269).
token-revocation-rust = { path = "../../gatekeeper/token-revocation-rust" }
tunnel-rust = { path = "../../tunnel/tunnel-rust" }

[lints]
workspace = true

[dev-dependencies]
# This crate with its test support, for `tests/serve.rs`.
wildflower-server-rust = { path = ".", features = ["test-support"] }
# The PROXY headers the tunnel listener tests send, built as the relay
# builds them.
rathole-settings-rust = { path = "../../tunnel/rathole-settings-rust", features = [
  "proxy-header",
] }
serde_json.workspace = true
# A throwaway data root for the `serve` lifecycle test.
tempfile = "3"
# `test-util` drives the reachability monitor on virtual time.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time", "test-util"] }
# `ServiceExt::oneshot`, to drive the API CORS layer with a preflight in tests.
tower = { version = "0.5", features = ["util"] }
# The forwarded-request path reducer's and the PROXY header reader's property
# tests.
proptest = "1"
