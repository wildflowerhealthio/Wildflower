[package]
name = "shared-structures-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# Opt-in test-support: the OpenAPI snapshot assert/regenerate helper. Gated
# behind a feature so the production builds of crates that depend on
# shared-structures-rust (emr-rust, wildflower-tauri) don't pull utoipa /
# serde_json — only the `-rust` crates that own a documented surface enable it,
# as a dev-dependency.
openapi-snapshot = ["dep:utoipa", "dep:serde_json"]
# Opt-in: the unified `/docs` machinery — merge several slice `OpenApi` documents
# into one and serve it as an interactive Scalar reference. Gated so only the
# host binary (the one process that serves the merged docs) pulls `utoipa-scalar`
# and its axum wiring. `serde_json` rides along for the module's own tests.
openapi-docs = ["dep:utoipa", "dep:utoipa-scalar", "dep:axum", "dep:serde_json"]
# Opt-in: the `tunnel_service` contract (the tunnel slice implements it, the apps
# slice consumes it). Gated so the lean default build — and crates that don't
# touch the tunnel (emr, gatekeeper) — stay free of tokio/async-trait. Pulls
# `utoipa` so `TunnelStatus` derives `ToSchema` directly (it *is* the wire enum
# the tunnel slice's OpenAPI surface documents); the dep only lands in the app
# binary, which already carries utoipa, never in the lean default build.
tunnel-service = ["dep:tokio", "dep:async-trait", "dep:utoipa"]
# Opt-in: the `health_check` contract (`HealthCheckService`) + the reusable
# `/health` router. Gated so the lean default build — and crates that don't
# serve `/health` — stay free of axum/async-trait.
health-check = ["dep:axum", "dep:async-trait"]
# Opt-in: the shared opaque-500 `InternalError` template. Gated so crates that
# don't serve HTTP don't pull `axum` / `tracing`; the `-rust` slices that own a
# handler surface enable it.
http-errors = ["dep:axum", "dep:tracing"]
# Opt-in: forwarding-header provenance helpers (`request_provenance`,
# `served_base_url_for`) — the single source of truth for the `Forwarded` header
# (RFC 7239) the trusted front sets on relayed requests. Gated so non-HTTP
# crates don't pull `axum`; the slices that resolve a request's served origin
# (gatekeeper-rust, apps-rust) enable it.
served-origin = ["dep:axum"]
# Opt-in: the `<id>.<public_host>` subdomain shape (`subdomain_host`,
# `subdomain_url`, `try_split_subdomain`) shared by the apps slice's launch
# redirect (producer) and the host's forwarded-request reverse proxy (consumer).
# Pure string code, no extra deps — enabled by apps-rust and the
# shared-structures-server-rust crate so the producer/consumer can't drift.
subdomain-url = []

[dependencies]
# `serde` is non-optional: the always-on `bridge` module derives
# `Deserialize` on its envelope shape, so every downstream crate
# (`wildflower-tauri`, `browser-sniffer-tauri-rust`, …) needs the
# trait available unconditionally.
serde = { workspace = true }
# `url` is non-optional: the always-on `ServerRuntimeConfig::loopback_origin`
# returns a `Url` — the single typed source the host threads into every slice's
# config (apps / gatekeeper / emr / tunnel), so the loopback origin is parsed
# once here rather than rebuilt from a string downstream.
url = { version = "2" }
utoipa = { workspace = true, optional = true }
# Only for the `openapi-docs` feature: renders the merged spec as a Scalar page.
utoipa-scalar = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Only for the `tunnel-service` contract (watch channel + async trait method).
tokio = { workspace = true, optional = true, features = ["sync"] }
async-trait = { version = "0.1", optional = true }
# Only for the `health-check` `/health` router.
axum = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
# `bridge::tests` decodes a JSON wire payload to verify the envelope
# peek ignores extra fields. Kept off the runtime surface so production
# builds of downstream crates don't pull `serde_json`.
serde_json = { workspace = true }
# Exercise the `health-check` router (oneshot) under that feature.
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
