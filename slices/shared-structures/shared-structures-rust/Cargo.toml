[package]
name = "shared-structures-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# Opt-in test-support: the OpenAPI snapshot assert/regenerate helper. Gated
# behind a feature so the production builds of crates that depend on
# shared-structures-rust (fhir-r4-rust, host-app) don't pull utoipa /
# serde_json — only the `-rust` crates that own a documented surface enable it,
# as a dev-dependency.
openapi-snapshot = ["dep:utoipa", "dep:serde_json"]
# Opt-in: the `health_check` contract (`HealthCheckService`), the
# draft-inadarei-api-health-check-06 report types, and the reusable `/health`
# router. Gated so the lean default build — and crates that don't serve or read
# `/health` — stay free of axum/async-trait/serde_json/chrono.
health-check = ["dep:axum", "dep:async-trait", "dep:serde_json", "dep:chrono"]
# Opt-in: the shared opaque-500 `InternalError` template. Gated so crates that
# don't serve HTTP don't pull `axum` / `tracing`; the `-rust` slices that own a
# handler surface enable it.
http-errors = ["dep:axum", "dep:tracing"]
# Opt-in: forwarding-header provenance helpers (`request_provenance`,
# `served_base_url_for`) — the single source of truth for the `Forwarded` header
# (RFC 7239) the trusted front sets on relayed requests. Gated so non-HTTP
# crates don't pull `axum`; the slices that resolve a request's served origin
# (gatekeeper-rust, apps-rust) enable it.
served-origin = ["dep:axum"]
# Opt-in: the diesel `JsonText` SQLite mapping (a `serde_json::Value` field
# stored in a JSON TEXT column), shared by the diesel-backed slices. Gated so
# only the `-rust` slices that persist with diesel pull `diesel`/`serde_json`;
# the lean default build is unaffected.
diesel-json-text = ["dep:diesel", "dep:serde_json"]

[dependencies]
# `serde` is non-optional: the always-on `bridge` module derives
# `Deserialize` on its envelope shape, so every downstream crate
# (`host-app`, `browser-sniffer-tauri-rust`, …) needs the
# trait available unconditionally.
serde = { workspace = true }
# `url` is non-optional: the always-on `ServerRuntimeConfig::loopback_origin`
# returns a `Url` — the single typed source the host threads into every slice's
# config (apps / gatekeeper / emr), so the loopback origin is parsed
# once here rather than rebuilt from a string downstream.
url = { version = "2" }
utoipa = { workspace = true, optional = true }
# Only for the `diesel-json-text` feature: the shared `JsonText` column mapping.
diesel = { workspace = true, optional = true }
# The `diesel-json-text` mapping, and the `health-check` report body.
serde_json = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
# Only for the `health-check` `/health` router.
axum = { workspace = true, optional = true }
# Only for the `health-check` report: each check's `time`, as RFC 3339.
chrono = { workspace = true, optional = true, features = ["serde"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
# `bridge::tests` decodes a JSON wire payload to verify the envelope
# peek ignores extra fields. Kept off the runtime surface so production
# builds of downstream crates don't pull `serde_json`.
serde_json = { workspace = true }
# Exercise the `health-check` router (oneshot) under that feature.
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
