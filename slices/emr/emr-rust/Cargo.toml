[package]
name = "emr-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
# `$everything` re-drives HFS's own router in-process (a `read` + a compartment
# search) via `tower::ServiceExt::oneshot`, so scope enforcement stays in the
# path. Already in the tree transitively through axum; pinned here as a direct
# dep for the `util` feature (`oneshot`).
tower = { version = "0.5", features = ["util"] }
# The loopback origin flows in as a typed `Url` (from `ServerRuntimeConfig`); the
# discovery handler derives its bare origin string from it.
url = { version = "2" }
# `$everything` logs (and swallows) a related-resource search that fails so a
# partial-scope token still gets the resources it can read. Already in the tree
# via helios/tower; pinned here as a direct dep for the `warn!` macro.
tracing = "0.1"
# HFS (HeliosSoftware/hfs) crates, exact-pinned to one release. Move all four
# together — they depend on each other at `^` of the same version, and a
# Dependabot group can bump only some of them. emr-rust embeds:
#   helios-rest        — Axum router + handlers serving the FHIR REST surface
helios-rest = { version = "=0.2.3", default-features = false, features = ["R4", "sqlite"] }
#   helios-persistence — sqlite-backed storage backend
helios-persistence = { version = "=0.2.3", default-features = false, features = ["R4", "sqlite"] }
#   helios-auth        — JWT/JWKS bearer auth + SMART v2 scope policy
helios-auth = "=0.2.3"
#   helios-audit       — audit sink trait (we use the null sink today)
helios-audit = { version = "=0.2.3", default-features = false, features = ["R4"] }
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = ["served-origin"] }
# The shared token-revocation store. emr-rust owns the HFS-side enforcement
# point: a custom `helios_auth::JtiCache` that reads the per-jti denylist (helios
# hands it only `(jti, expires_at)`; the epoch half needs `sub`/`iat`, which the
# gatekeeper gate — running first — covers). Deliberately the thin store crate,
# not gatekeeper-rust, so the FHIR server doesn't depend on the OAuth server.
token-revocation-rust = { path = "../../gatekeeper/token-revocation-rust" }
# `helios_auth::JtiCache` is an `#[async_trait]`; implementing it needs the same
# attribute macro. Already resolved in the lockfile (via tunnel-rust), so this
# direct dep pins no new version.
async-trait = "0.1"
# The `JtiCache::check_and_store` signature is in `chrono::DateTime<Utc>`; already
# in the tree via helios, pinned here as a direct dep for the type reference.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
base64.workspace = true
http-body-util.workspace = true
ohif-server-rust = { path = "../../dicom/ohif-server-rust" }
# Lets the auth tests break a revocation store's schema to exercise the
# fail-closed branch. Already in the tree via token-revocation-rust.
persistence-rust = { path = "../../persistence/persistence-rust" }
scope-capabilities-rust = { path = "../../scopes/scope-capabilities-rust" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
