[package]
name = "har-recorder-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# `SaveError`'s `Display`/`source` wiring — the message the host forwards on
# `HarSaveFailed` is that `Display`.
thiserror = "2"

# Opt this crate into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true

[dev-dependencies]
proptest = "1"
# The atomic-rename and refuse-to-clobber behaviour only exists against a real
# filesystem, so the `save_har` tests drive one.
tempfile = "3"
