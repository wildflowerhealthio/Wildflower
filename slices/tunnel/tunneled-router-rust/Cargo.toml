[package]
name = "tunneled-router-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# A general forwarded-subdomain router for the tunnel slice. Register a set of
# `(id, router, port)` routes; the builder binds each on its own dedicated
# loopback listener AND dispatches inbound forwarded requests whose `Forwarded`
# host is `<id>.<public_host>` into the matching router. The `<id>.<public_host>`
# shape is the shared `shared-structures-rust::subdomain_host` definition, so a
# launch redirect (producer) and this dispatch (consumer) can't drift. Knows
# nothing about any specific app — the host hands it ready-built routers.
[dependencies]
axum.workspace = true
# `request_provenance` (served-origin) classifies inbound requests as
# loopback vs forwarded; `TunnelService` (tunnel-service) reads the live
# public-host setting at request time; `subdomain_host` (subdomain-url) is the
# shared `<id>.<public_host>` shape this crate matches against.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = [
  "tunnel-service",
  "served-origin",
  "subdomain-url",
] }
tokio = { workspace = true, features = ["net", "rt"] }
# `ServiceExt::oneshot` dispatches a request into a cloned per-route `Router`
# (the standard axum integration idiom).
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
# `TunnelService` test stubs implement an async-trait method; the dispatch
# tests stand up routers and drive them with `#[tokio::test]`.
async-trait = "0.1"
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
