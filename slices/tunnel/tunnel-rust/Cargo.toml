[package]
name = "tunnel-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The Tauri-side tunnel slice: SQLite-backed settings (via persistence-rust),
# the `/tunnel` HTTP surface the tunnel-react UI speaks, and an embedded
# `rathole` client (noise transport, no TLS/openssl) that dials the self-hosted
# wildflower-relay and forwards the loopback server through it. Layered like
# gatekeeper-rust: pure `domain`, `db`/`db_utils`, and `http`.
[dependencies]
anyhow.workspace = true
axum.workspace = true
serde = { workspace = true }
serde_json.workspace = true
rusqlite.workspace = true
persistence-rust = { path = "../../persistence/persistence-rust" }
rathole = { version = "0.5", default-features = false, features = [
  "client",
  "noise",
] }
parking_lot = "0.12"
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tempfile = "3"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
proptest = "1"
