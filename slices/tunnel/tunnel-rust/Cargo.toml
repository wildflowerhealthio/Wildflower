[package]
name = "tunnel-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The Tauri-side tunnel slice: SQLite-backed settings (via Diesel over the
# app-wide connection pool), the `/tunnel` HTTP surface the tunnel-react UI
# speaks, and an embedded `rathole` client (noise transport, no TLS/openssl)
# that dials the self-hosted wildflower-relay and forwards the loopback server
# through it. Layered like collector-rust: pure `domain`, `db`, and `http`.
#
# Persistence is Diesel over the app-wide r2d2 connection pool
# (`persistence_rust::DieselPool`), built by the host on the same shared database
# file its rusqlite `persistence-rust::Connection` serves the other slices from.
# This crate depends on `persistence-rust` ONLY for the pool type — it does not
# touch `rusqlite` directly. Cargo unifies diesel's `libsqlite3-sys` with
# rusqlite's already-bundled one, so both connections drive the same bundled
# SQLite build.
[dependencies]
anyhow.workspace = true
axum.workspace = true
serde = { workspace = true }
serde_json.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
diesel = { workspace = true }
diesel_migrations.workspace = true
# The loopback origin flows in as a typed `Url` (from `ServerRuntimeConfig`); the
# daemon takes its bare origin string at construction.
url = { version = "2" }
# The app-wide diesel connection pool (`DieselPool` / `open_pool`) shared across
# diesel-backed slices; this crate names the pool type but not rusqlite.
persistence-rust = { path = "../../persistence/persistence-rust" }
# The tunnel service contract this slice implements (TunnelService + state
# types), plus the shared opaque-500 `InternalError` the handlers 500 with.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = [
  "tunnel-service",
  "http-errors",
] }
rathole = { version = "0.5", default-features = false, features = [
  "client",
  "noise",
] }
async-trait = "0.1"
parking_lot = "0.12"
rand = "0.10"
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util = "0.7"
toml = "0.9"
tempfile = "3"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
# The shared OpenAPI snapshot helper (assert/regenerate the committed spec); only
# the snapshot test uses it, so it's a dev-dependency with the opt-in feature.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = ["openapi-snapshot"] }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "test-util",
] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
proptest = "1"
