[package]
name = "tunnel-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The Tauri-side tunnel slice: an embedded `rathole` client (noise transport, no
# TLS/openssl) that dials the wildflower-relay named in the server's record and
# forwards the server's local port through it, re-dialing with backoff. No HTTP
# surface; the tunnel keeps no rows.
[dependencies]
anyhow.workspace = true
serde = { workspace = true }
# `public_origin_url` hands the public origin out as a typed `Url`.
url = { version = "2" }
rathole = { version = "0.5", default-features = false, features = [
  "client",
  "noise",
] }
# The relay's `GET /rathole` settings, and the transport and noise pattern the
# rendered client config names.
rathole-settings-rust = { path = "../rathole-settings-rust" }
# `HealthStatus`: the tunnel's own health, which the server's `/health` reports.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = [
  "health-check",
] }
async-trait = "0.1"
rand = "0.10"
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util = "0.7"
toml = "0.9"
tempfile = "3"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "test-util",
] }
serde_json.workspace = true
parking_lot = "0.12"
