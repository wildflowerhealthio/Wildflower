[package]
name = "tunnel-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The Tauri-side tunnel slice: the read-only `/tunnel` HTTP surface the
# tunnel-react UI speaks, and an embedded `rathole` client (noise transport, no
# TLS/openssl) that dials the wildflower-relay named in the server's record and
# forwards the server's local port through it. Layered like gatekeeper-rust:
# pure `domain` and `http`. The tunnel keeps no rows.
[dependencies]
anyhow.workspace = true
axum.workspace = true
serde = { workspace = true }
utoipa.workspace = true
utoipa-axum.workspace = true
# `public_origin_url` hands the public origin out as a typed `Url`.
url = { version = "2" }
# The scope grammar (`Scope`, `Permission`, `WildflowerResource`) the `/tunnel`
# scope gate builds its required scope from — `wildflower/TunnelSettings.r`.
scopes-rust = { path = "../../scopes/scopes-rust" }
# The generic scope-gated capability machinery (`Scoped<F>`,
# `FixedScopeCapability`, `ScopeClaims`, `insufficient_scope` +
# `InsufficientScopeBody`) the `/tunnel` surface gates on; the `openapi` feature
# derives `ToSchema` on the 403 body so the handlers can declare it in utoipa.
scope-capabilities-rust = { path = "../../scopes/scope-capabilities-rust", features = [
  "openapi",
] }
rathole = { version = "0.5", default-features = false, features = [
  "client",
  "noise",
] }
# The relay's `GET /rathole` settings, and the transport and noise pattern the
# rendered client config names.
rathole-settings-rust = { path = "../rathole-settings-rust" }
async-trait = "0.1"
rand = "0.10"
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util = "0.7"
toml = "0.9"
tempfile = "3"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
# The shared OpenAPI snapshot helper (assert/regenerate the committed spec); only
# the snapshot test uses it, so it's a dev-dependency with the opt-in feature.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = ["openapi-snapshot"] }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "test-util",
] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
proptest = "1"
serde_json.workspace = true
parking_lot = "0.12"
