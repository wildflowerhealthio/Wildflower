[package]
name = "tunnel-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The Tauri-side tunnel slice: SQLite-backed settings (via persistence-rust),
# the `/tunnel` HTTP surface the tunnel-react UI speaks, and an embedded
# `rathole` client (noise transport, no TLS/openssl) that dials the self-hosted
# wildflower-relay and forwards the loopback server through it. Layered like
# gatekeeper-rust: pure `domain`, `db`, and `http`.
[dependencies]
anyhow.workspace = true
axum.workspace = true
serde = { workspace = true }
serde_json.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
rusqlite.workspace = true
# The loopback origin flows in as a typed `Url` (from `ServerRuntimeConfig`); the
# daemon takes its bare origin string at construction.
url = { version = "2" }
persistence-rust = { path = "../../persistence/persistence-rust" }
# The tunnel service contract this slice implements (TunnelService + state types).
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = [
  "tunnel-service",
] }
rathole = { version = "0.5", default-features = false, features = [
  "client",
  "noise",
] }
async-trait = "0.1"
parking_lot = "0.12"
rand = "0.10"
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util = "0.7"
toml = "0.9"
tempfile = "3"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
# The shared OpenAPI snapshot helper (assert/regenerate the committed spec); only
# the snapshot test uses it, so it's a dev-dependency with the opt-in feature.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = ["openapi-snapshot"] }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "test-util",
] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
proptest = "1"
