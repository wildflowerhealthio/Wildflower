[package]
name = "rathole-settings-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The wire shape of the relay's `GET /rathole`: everything public a rathole
# client needs to dial the relay, the tunnel name a device adds to it, and the
# `TunnelHost` its signed `GET /me` returns. Its own thin crate so both ends
# share one declaration without pulling each other in: `wildflower-relay`
# serves both, renders its rathole server TOML with the same transport and
# noise pattern and checks its tunnel names with `TunnelName`; `tunnel-rust`
# (the device's rathole client) deserializes `GET /rathole`, and
# `servers-rust` stores it and reads `GET /me`.
[dependencies]
serde.workspace = true
# `InvalidTunnelName`'s `Display`/`Error` wiring.
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
