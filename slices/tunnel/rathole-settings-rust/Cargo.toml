[package]
name = "rathole-settings-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The wire shape of the relay's `GET /rathole`: everything public a rathole
# client needs to dial the relay. Its own thin crate so both ends share one
# declaration without pulling each other in: `wildflower-relay` serves it and
# renders its rathole server TOML with the same transport and noise pattern,
# and `tunnel-rust` (the device's rathole client) deserializes it.
[dependencies]
serde.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
