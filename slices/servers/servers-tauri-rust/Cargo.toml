[package]
name = "servers-tauri-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# Tauri host glue for the servers slice: the base's commands over
# `servers-rust`, which holds every decision and its tests.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# The registry, enrolment and the relay client adapter the commands drive.
servers-rust = { path = "../servers-rust" }
# `TunnelName`, which the commands parse the entered tunnel name into.
rathole-settings-rust = { path = "../../tunnel/rathole-settings-rust" }
# The relay base URL enrolment builds a relay client for.
url = "2"
# The instant enrolment chooses a new server's run policy at.
chrono = { workspace = true, features = ["clock"] }

# Opt this crate into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }
