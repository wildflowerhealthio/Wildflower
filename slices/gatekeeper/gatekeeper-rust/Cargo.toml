[package]
name = "gatekeeper-rust"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
persistence-rust = { path = "../../persistence/persistence-rust" }
# The shared forwarding-header provenance helpers (`served_origin_for`,
# `request_provenance`) — gatekeeper-rust resolves token issuer URLs through
# them, and apps-rust dispatches launches off the same provenance, so the
# `Forwarded`-header (RFC 7239) contract lives in one place.
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = ["served-origin"] }
parking_lot = "0.12"
# jsonwebtoken 10 split the crypto backend out of the default features: `default`
# only enables PEM parsing, so a signer backend must be selected explicitly.
# `rust_crypto` is the pure-Rust RustCrypto backend (rsa/sha2/ed25519/p256) — it
# matches the crate's existing RustCrypto deps and needs no C toolchain (unlike
# the `aws_lc_rs` alternative), keeping CI free of cmake/aws-lc build steps.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.11"
argon2 = "0.5"
subtle = "2"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
percent-encoding = "2"
serde_urlencoded = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
thiserror = "2"
tokio = { workspace = true, features = ["sync"] }

# Opt this crate into the workspace lints (notably `unsafe_code = "forbid"`),
# so a future `unsafe` block in the crypto/OAuth code is a compile error.
[lints]
workspace = true

[dev-dependencies]
persistence-rust = { path = "../../persistence/persistence-rust" }
# The shared OpenAPI snapshot helper (assert/regenerate the committed spec). Only
# the snapshot test uses it, so it's an extra dev-only feature on the existing
# `[dependencies]` entry above (cargo unifies the feature set across both
# tables, so the dev opt-in adds `openapi-snapshot` to the served-origin runtime
# build).
shared-structures-rust = { path = "../../shared-structures/shared-structures-rust", features = ["openapi-snapshot"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
proptest = "1"
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
