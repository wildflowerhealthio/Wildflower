packages:
  - apps/*
  - global/*
  - global/effect-messaging/*
  - slices/**
  - '!slices/apps/self-hosted-apps/**'
  # `slices/**` otherwise reaches into nested `node_modules`. Most package-local
  # `node_modules` hold only symlinks back to workspace packages, but a dep whose
  # version conflicts with a hoisted transitive copy (ajv 8 under `web-trace-core`
  # against ajv 6 at the root) installs for real — and `vp run -r` then tries to
  # run that third-party package's own `build` script as if it were ours.
  - '!**/node_modules/**'

catalog:
  '@effect/ai': 0.37.0
  '@effect/cli': 0.77.0
  '@effect/cluster': 0.60.2
  '@effect/experimental': 0.61.1
  '@effect/language-service': ^0.87.2
  '@effect/opentelemetry': 0.64.0
  '@effect/platform': 0.97.1
  '@effect/platform-browser': 0.77.1
  '@effect/platform-bun': 0.91.2
  '@effect/platform-node': 0.108.1
  '@effect/printer': 0.51.0
  '@effect/printer-ansi': 0.51.0
  '@effect/rpc': 0.76.2
  '@effect/sql': 0.52.1
  '@effect/typeclass': 0.41.0
  '@effect/workflow': 0.19.1
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2
  '@fontsource-variable/atkinson-hyperlegible-mono': ^5.3.0
  '@fontsource-variable/atkinson-hyperlegible-next': ^5.3.0
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/exporter-trace-otlp-http': ^0.221.0
  '@opentelemetry/resources': 2.10.0
  '@opentelemetry/sdk-trace-base': ^2.10.0
  '@opentelemetry/sdk-trace-node': ^2.10.0
  '@opentelemetry/sdk-trace-web': ^2.10.0
  '@opentelemetry/semantic-conventions': ^1.43.0
  # Keep the `@sentry/*` packages aligned on a single version so only one
  # copy of `@sentry/core` is installed. Divergent majors install two
  # side-by-side, and the mismatched `Client` types break
  # `setupEventContextTrace` / `SentrySampler` consumers (telemetry-node/web).
  '@sentry/node': 10.72.0
  '@sentry/opentelemetry': 10.72.0
  '@sentry/react': 10.72.0
  # The Scalar API reference, vendored through npm (never the CDN script) so the
  # static server-docs console at /wildflower-server-docs ships self-contained.
  '@scalar/api-reference': ^1.67.0
  '@tanstack/react-query': ^5.102.8
  '@tanstack/react-router': ^1.170.31
  '@tanstack/router-plugin': ^1.168.34
  '@tanstack/virtual-file-routes': ^1.162.0
  '@tauri-apps/api': ^2
  '@tauri-apps/plugin-fs': ~2.5.1
  '@tauri-apps/plugin-log': ~2.9.0
  '@tauri-apps/plugin-opener': ^2
  '@testing-library/dom': ^10.4.0
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.5
  '@tsdown/css': ^0.22.14
  '@types/fhir': ^0.0.44
  # `har-schema` is the published HAR 1.2 JSON Schema and `ajv` compiles it —
  # together they are how `web-trace-core` holds its emitter to the real spec
  # instead of a hand-copied transcription. Both are catalogued and listed at the
  # root so ajv 8 wins the hoist: eslint drags in ajv 6, and whichever version
  # lands at the workspace root is the one a root-level `vp lint` resolves for
  # every package.
  ajv: ^8.20.0
  '@types/node': ^26
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  '@vitejs/plugin-react': ^6.1.1
  effect: 3.22.1
  esbuild: ^0.28.2
  expect-type: ^1.3.0
  fast-check: 3.23.2
  har-schema: ^2.0.0
  jose: ^6.2.9
  jsdom: ^30.0.1
  nanoid: ^6.0.1
  qrcode-generator: 2.0.4
  react: 19.2.8
  react-dom: 19.2.8
  tundra-css: ^0.14.0

  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.2
  vite-plus: ^0.3.0
  # vite-plus 0.2.x depends on real vitest (the @voidzero-dev/vite-plus-test
  # alias line ended at 0.1.24); pin to the version `vp --version` bundles.
  vitest: 4.1.11
  why-is-node-running: ^3.2.2
catalogMode: prefer

nodeLinker: hoisted
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
