  # copy of `@sentry/core` is installed. Divergent majors install two
  # side-by-side, and the mismatched `Client` types break
  # `setupEventContextTrace` / `SentrySampler` consumers (telemetry-node/web).
  '@sentry/node': 10.12.0
  '@sentry/opentelemetry': 10.12.0
