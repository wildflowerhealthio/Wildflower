packages:
  - apps/*
  # The watch apps' host-side tests and PebbleKit JS builds; see
  # apps/watch-lifts/watch-lifts-watchapp/test/vite.config.ts for why they aren't part of the watch
  # app packages themselves.
  - apps/fhir-sync-pebble/fhir-sync-pebble-watchapp/pkjs
  - apps/fhir-sync-pebble/fhir-sync-pebble-watchapp/test
  # FHIR Sync for Pebble: the watchapp and its settings page. The core both
  # build on is slices/fhir-sync-pebble-core.
  - apps/fhir-sync-pebble/*
  # The Health Viewer: the app and the core, sources and chart it is built
  # from.
  - apps/health-viewer/*
  # The host: the Tauri host app and the packages it is built from.
  - apps/host/*
  - apps/host/servers/*
  # The launcher: the web app that manages a Wildflower server, and the
  # packages it is built from, grouped by the slice they came from.
  - apps/launcher/*
  - apps/launcher/collector/*
  - apps/launcher/databases/*
  - apps/launcher/har-recorder/*
  - apps/launcher/request-log/*
  # Lifting: the app and the core and screens it is built from.
  - apps/lifting/*
  # Medications: the app and the calendar, interaction and sponsorship
  # features only it uses.
  - apps/medications/*
  # The relay's admin UI and the packages it is built from. Their sibling
  # apps/relay/relay-server is the Rust crate.
  - apps/relay/*
  # The Synthetic Data Loader: the app, and the story model and per-source
  # generators its snapshot is built from.
  - apps/synthetic-data/*
  - apps/watch-lifts/watch-lifts-watchapp/pkjs
  - apps/watch-lifts/watch-lifts-watchapp/test
  # WatchLifts: the watchapp, its settings page and the core both build on.
  - apps/watch-lifts/*
  # The site: the assembly that publishes wildflowerhealth.io, and the
  # marketing homepage at its root.
  - apps/wildflower-site/*
  - global/*
  - global/effect-messaging/*
  - global/pebble/*
  - slices/**
  # `slices/**` otherwise reaches into nested `node_modules`. Most package-local
  # `node_modules` hold only symlinks back to workspace packages, but a dep whose
  # version conflicts with a hoisted transitive copy (ajv 8 under `web-trace-core`
  # against ajv 6 at the root) installs for real — and `vp run -r` then tries to
  # run that third-party package's own `build` script as if it were ours.
  - '!**/node_modules/**'

catalog:
  '@effect/language-service': ^0.87.4
  '@effect/opentelemetry': 0.64.1
  '@effect/platform': 0.97.2
  '@cornerstonejs/core': 5.11.6
  '@cornerstonejs/dicom-image-loader': 5.11.6
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2
  '@fontsource-variable/atkinson-hyperlegible-mono': ^5.3.0
  '@fontsource-variable/atkinson-hyperlegible-next': ^5.3.0
  '@observablehq/plot': 0.6.17
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/exporter-trace-otlp-http': ^0.223.0
  '@opentelemetry/resources': 2.12.0
  '@opentelemetry/sdk-trace-base': ^2.12.0
  '@opentelemetry/sdk-trace-web': ^2.12.0
  '@opentelemetry/semantic-conventions': ^1.43.0
  # Keep the `@sentry/*` packages aligned on a single version so only one
  # copy of `@sentry/core` is installed. Divergent majors install two
  # side-by-side, and the mismatched `Client` types break
  # `setupEventContextTrace` / `SentrySampler` consumers (telemetry-web).
  '@sentry/opentelemetry': 10.74.0
  '@sentry/react': 10.74.0
  # The Scalar API reference, vendored through npm (never the CDN script) so the
  # static server-docs console at /server-docs ships self-contained.
  '@scalar/api-reference': ^1.73.0
  '@tanstack/react-query': ^5.104.1
  '@tanstack/react-router': ^1.170.41
  '@tanstack/router-plugin': ^1.168.42
  '@tanstack/virtual-file-routes': ^1.162.0
  '@tauri-apps/api': ^2
  '@tauri-apps/plugin-fs': ~2.5.2
  '@tauri-apps/plugin-log': ~2.10.0
  '@tauri-apps/plugin-opener': ^2
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@tsdown/css': ^0.23.0
  '@types/fhir': ^0.0.44
  # `har-schema` is the published HAR 1.2 JSON Schema and `ajv` compiles it —
  # together they are how `web-trace-core` holds its emitter to the real spec
  # instead of a hand-copied transcription. Both are catalogued and listed at the
  # root so ajv 8 wins the hoist: eslint drags in ajv 6, and whichever version
  # lands at the workspace root is the one a root-level `vp lint` resolves for
  # every package.
  # acorn parses a watchapp's PebbleKit JS bundle at ES5 to prove its language
  # level (global/pebble/pebble-pkjs).
  acorn: ^8.19.0
  ajv: ^8.20.0
  bumpp: ^12.3.0
  '@types/node': ^26
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': ^6.1.2
  effect: 3.22.2
  esbuild: ^0.28.2
  # Browser shim for Node's `events`, aliased in `apps/importer-web/vite.config.ts`.
  # @cornerstonejs/core reaches xmlbuilder2 (via vtk.js's XML mesh reader), which
  # subclasses EventEmitter at module scope; Vite's externalized stub makes that
  # throw. See the alias comment for the full chain.
  events: ^3.3.0
  expect-type: ^1.3.0
  dicom-parser: 1.8.21
  fast-check: 3.23.2
  har-schema: ^2.0.0
  # RFC 9421 HTTP message signatures for the relay admin UI's requests
  # (relay-core-js), and the structured-field codec it is built on, which
  # relay-core-js uses to serialize the signature input itself.
  http-message-signatures: ^1.0.6
  jose: ^6.1.3
  jsdom: ^30.1.2
  # `vp run lint:deps`: fails on an import its package's manifest doesn't
  # declare, which the package graph check (scripts/package-graph.ts) trusts.
  knip: ^6.41.0
  nanoid: ^6.0.2
  pdfjs-dist: 6.4.299
  qrcode-generator: 2.0.4
  react: 19.3.0
  react-dom: 19.3.0
  # Reads the Cargo manifests for the package graph check, so it needs no Rust
  # toolchain.
  smol-toml: ^1.9.1
  structured-headers: ^2.0.2
  tundra-css: ^0.14.0

  # Two TypeScripts; docs/TypeScript/Versions Reference.md lists
  # which tool uses which.
  # Bare `typescript` is held on 5.x for the tools that need its JS compiler
  # API, which the `typescript` 7 npm package (the Go port) doesn't ship:
  # typescript-eslint (peers on `<6.1.0`), @effect/language-service and editor
  # tsserver, and the ES5 lowering in global/pebble/pebble-pkjs (TypeScript 7
  # has no ES5 target). Dependabot ignores its majors (.github/dependabot.yml).
  typescript: 5.9.3
  # TypeScript 7, the native compiler, for everything that only runs the
  # binary: `.d.ts` emit (`tsgoDts` in vite.config.base.ts) and the apps'
  # `tsc` build step. pnpm links the higher version into node_modules/.bin/tsc
  # when two packages named `typescript` both ship it, so `tsc` is this copy.
  typescript-7: npm:typescript@7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  why-is-node-running: ^3.2.2
catalogMode: prefer

nodeLinker: hoisted
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
overrides:
  '@types/node': ^26
  react-dom: 19.3.0
  vite@*: 'catalog:'
