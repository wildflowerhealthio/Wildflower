  '@effect/cli': 0.75.2
  '@effect/cluster': 0.59.0
  '@effect/experimental': 0.60.0
  '@effect/language-service': ^0.86.4
  '@effect/opentelemetry': 0.63.0
  '@effect/platform': 0.96.2
  '@effect/platform-browser': 0.76.0
  '@effect/platform-bun': 0.90.0
  '@effect/platform-node': 0.107.0
  '@effect/printer': 0.49.0
  '@effect/printer-ansi': 0.49.0
  '@effect/rpc': 0.75.0
  '@effect/sql': 0.51.1
  '@effect/typeclass': 0.40.0
  '@effect/workflow': 0.18.2
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2
  '@fontsource-variable/atkinson-hyperlegible-mono': ^5.2.5
  '@fontsource-variable/atkinson-hyperlegible-next': ^5.2.6
  '@fontsource-variable/hanken-grotesk': ^5.2.8
  '@fontsource-variable/newsreader': ^5.2.10
  '@fontsource-variable/spline-sans-mono': ^5.2.8
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/exporter-trace-otlp-http': ^0.220.0
  '@opentelemetry/resources': 2.9.0
  '@opentelemetry/sdk-trace-base': ^2.9.0
  '@opentelemetry/sdk-trace-node': ^2.9.0
  '@opentelemetry/sdk-trace-web': ^2.9.0
  '@opentelemetry/semantic-conventions': ^1.42.0
  # Keep the `@sentry/*` packages aligned on a single version so only one
  # copy of `@sentry/core` is installed. Divergent majors install two
  # side-by-side, and the mismatched `Client` types break
  # `setupEventContextTrace` / `SentrySampler` consumers (telemetry-node/web).
  '@sentry/node': 10.63.0
  '@sentry/opentelemetry': 10.63.0
  '@sentry/react': 10.63.0
  '@tanstack/react-query': ^5.101.2
  '@tanstack/react-router': ^1.170.17
  '@tanstack/router-plugin': ^1.168.19
  '@tanstack/virtual-file-routes': ^1.162.0
  '@tauri-apps/api': ^2
  '@tauri-apps/plugin-fs': ~2.5.1
  '@tauri-apps/plugin-log': ~2.9.0
  '@tauri-apps/plugin-opener': ^2
  '@tsdown/css': ^0.22.3
  '@types/fhir': ^0.0.44
  '@types/node': ^26
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  '@typescript/native-preview': 7.0.0-dev.20260429.1
  '@vitejs/plugin-react': ^6.0.3
  effect: 3.21.4
  esbuild: ^0.28.1
  expect-type: ^1.3.0
  fast-check: 3.23.1
  jose: ^6.2.2
  jsdom: ^29.1.1
  nanoid: ^6.0.0
  qrcode-generator: 2.0.4
  react: 19.2.7
  react-dom: 19.2.7
  tundra-css: ^0.14.0

  typescript: 5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@^0.2.2
  vite-plus: ^0.2.2
  # vite-plus 0.2.x depends on real vitest (the @voidzero-dev/vite-plus-test
  # alias line ended at 0.1.24); pin to the version `vp --version` bundles.
  vitest: 4.1.10
  why-is-node-running: ^3.2.2
catalogMode: prefer

nodeLinker: hoisted
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
