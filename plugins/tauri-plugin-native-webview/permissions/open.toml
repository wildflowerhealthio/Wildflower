# Hand-authored permission (NOT autogenerated): a richly-described grant for the
# `open` command. The stock `allow-open` in `autogenerated/commands/open.toml`
# carries only boilerplate; `default.toml` grants this one instead so the ACL
# documents what the command actually does.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "open"
description = """
Allow presenting a native web view popup over an external `http(s)` URL: a
`WKWebView` (iOS), `android.webkit.WebView` (Android), or Tauri child webview
(desktop) wrapped in native chrome, with the caller's document-start script
injected on any origin and a `Channel<NativeWebviewEvent>` carrying message /
closed events back to the host. Non-`http(s)` schemes are rejected.
"""
commands.allow = ["open"]
