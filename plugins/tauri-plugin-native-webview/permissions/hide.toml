# Hand-authored permission (NOT autogenerated): a richly-described grant for the
# `hide` command. Granted by `default.toml` in place of the stock `allow-hide`.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "hide"
description = """
Allow hiding the native webview — removing it from view while keeping it alive
and running in the background. Emits the `hidden` channel event. Idempotent —
succeeds as a no-op when nothing is visible. Does NOT free resources; use
`dispose` for that.
"""
commands.allow = ["hide"]
