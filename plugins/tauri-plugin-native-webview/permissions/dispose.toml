# Hand-authored permission (NOT autogenerated): a richly-described grant for the
# `dispose` command. Granted by `default.toml` in place of the stock
# `allow-dispose`.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "dispose"
description = """
Allow disposing the native webview — tearing it down (visible or hidden) and
freeing its resources. Emits the `disposed` channel event. Idempotent —
succeeds as a no-op when nothing exists.
"""
commands.allow = ["dispose"]
