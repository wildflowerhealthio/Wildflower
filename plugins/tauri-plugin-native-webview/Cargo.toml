[package]
name = "tauri-plugin-native-webview"
version = "0.0.0"
description = "Present an external URL in a native, JS-injectable web view (iOS, Android, desktop)."
edition.workspace = true
publish.workspace = true
# Required for Tauri plugins that ship native (Swift/Kotlin) code: the value is a
# unique key Tauri's build tooling uses to associate the mobile sources with this
# crate. Must be unique across the dependency graph.
links = "tauri-plugin-native-webview"

[dependencies]
# - `unstable`: unlocks the multi-webview-per-window API (`Window::add_child`)
#   the desktop backend uses to lay a chrome bar above the content webview.
#   API may change between Tauri minor releases; revisit on each upgrade.
# - `webview-data-url`: lifts Tauri's default rejection of `data:` URLs in
#   `WebviewBuilder::new(label, WebviewUrl::External(url))`. The desktop
#   chrome webview's source is an inline `data:text/html;base64,…` document
#   (the bar's UI is too small to justify a bundled asset and `about:blank +
#   init_script` had document-state race issues). Without this flag the
#   chrome's `add_child` fails with `InvalidWebviewUrl` and the chrome bar
#   never appears — content shows on its own.
tauri = { version = "2", features = ["unstable", "webview-data-url"] }
serde = { workspace = true }
# Desktop backend decodes the chrome-action event payload (`{action:string}`)
# and assembles the chrome-state initial-push JSON. Tauri's event API takes
# a `Serialize` payload, so this is also pulled in by the `emit_to` path.
serde_json = { workspace = true }
# Desktop backend parses/navigates external URLs for the native webview, and
# also builds a `data:text/html;base64,…` URL for the chrome webview's source.
url = "2"
# Base64-encode the inline chrome HTML for a `data:text/html;base64,…` URL.
# A plain `data:text/html,…` URL would fail `Url::parse` on the HTML's
# special characters (spaces, quotes, `<`, `>`, `#`), and percent-encoding
# the whole document is ~6× the original size; base64 is ~1.35× and
# Url::parse handles it without escaping.
base64 = "0.23"

[build-dependencies]
# Generates the per-command permissions + ACL schema from `COMMANDS` and wires
# the `ios/` Swift package into the host app at `tauri ios` codegen time.
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
# Drift-guard tests round-trip the wire models through JSON.
serde_json = { workspace = true }

# Opt into the workspace lints (notably `unsafe_code = "forbid"`). The plugin's
# Rust side is pure glue — all native code lives in Swift — so this holds.
[lints]
workspace = true
