[package]
name = "tauri-unit-runner"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# The Tauri bindings of `unit-runner`: its background session as the
# background-service plugin's one service, and whether the app is open from its
# window events, as two plugins. See `docs/Design Explanation.md`.
[dependencies]
anyhow.workspace = true
# `BackgroundService` is an `#[async_trait]`.
async-trait = "0.1"
# Tauri apps collect `log` records (`tauri-plugin-log`).
log = "0.4"
# Decoding the background-service plugin's event payloads.
serde_json.workspace = true
tauri = { version = "2", features = [] }
# Pinned exactly, like the app's own dependency: the background session is
# this plugin's one `BackgroundService`, started and stopped through
# `ServiceManagerHandle`. The `desktop-service` feature (an OS daemon) stays
# off.
tauri-plugin-background-service = "=1.0.1"
# Reading and asking for the notification permission before the first start.
tauri-plugin-notification = "2"
# `sync` pairs each background session's end with the plugin's reason for it;
# `time` bounds the wait for that reason.
tokio = { workspace = true, features = ["sync", "time"] }
# `UnitRunner` itself: units, policies, statuses and the reconcile, free of
# Tauri.
unit-runner = { path = "../unit-runner" }

# Opt this crate into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true
