# cargo-deny configuration — the supply-chain policy enforced by the rust-lint
# workflow. Targets the cargo-deny 2.x schema bundled by
# EmbarkStudios/cargo-deny-action@v2.
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Checked against the RustSec advisory DB. Vulnerable and unmaintained crates
# fail the check by default. To grant a reviewed, temporary exception, add the
# advisory id (e.g. "RUSTSEC-2024-0001") to `ignore` with a comment explaining
# why. Yanked crates are treated as errors so the lockfile stays installable.
yanked = "deny"
ignore = [
  # rsa 0.9.x — "Marvin Attack": the crate's RSA private-key operation is not
  # constant-time, leaking key bits through timing observable to an attacker who
  # can submit ciphertexts and measure decryption timing over the network. There
  # is no patched release ("No safe upgrade is available"). Pulled in by
  # `authorization-server-rust`, which uses `rsa` to *generate* RSA keys and DER-encode the
  # components (`to_pkcs1_der`), and — through `jsonwebtoken`'s `rust_crypto`
  # backend — to sign and verify RS256 JWTs. Signing applies our own private key
  # to our own claims (never attacker-controlled); verification is a public-key
  # operation. The vulnerable variable-time *private-key* path is never invoked on
  # attacker-supplied ciphertext, so the timing side-channel is not reachable
  # here. Reviewed, low-risk, temporary until `rsa` ships a constant-time release.
  "RUSTSEC-2023-0071",
  # quick-xml < 0.41 — two parser denial-of-service issues (quadratic
  # duplicate-attribute scan; unbounded `NsReader` namespace allocation). Both
  # are fixed in 0.41.0, which we already build via `plist` <- `tauri`; the
  # flagged copies are the semver-incompatible older majors pinned by
  # `object_store` (0.37) and `octofhir-ucum` (0.38, a build-dependency), so we
  # cannot pull them forward until those upstreams bump. Neither parses
  # attacker-supplied XML: the build-dep reads vendored UCUM data, and
  # `object_store`'s is S3 API responses over a cloud backend the EMR store
  # does not use. Reviewed, low-risk, temporary — cargo-deny reports
  # `advisory-not-detected` once these stop matching, which is the cue to drop.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # crypto-bigint < 0.7.6 — several operations meant to be constant-time could
  # branch on secret values (subtraction, division, Montgomery multiplication),
  # a timing side channel. The fix is only in 0.7.6+, but 0.5.5 is pinned by
  # `elliptic-curve` 0.13, which `p256`/`p384` 0.13 pull in for
  # `jsonwebtoken` (`rust_crypto` backend, still on 0.13 in 11.1) and the
  # `helios-rest`/`helios-ui` pins. Our JWT code signs and verifies only RS256,
  # so the elliptic-curve path is never exercised with our keys. Reviewed,
  # temporary — drop once helios and jsonwebtoken move to `p256`/`p384` 0.14.
  "RUSTSEC-2026-0387",
  # zstd < 0.14.3 — a reused compression context can leak data from an
  # abandoned stream into the next one (0391); `Seekable::decompress` and
  # legacy-frame streaming decompression can expose uninitialised memory (0398,
  # 0403). The flagged 0.13 copy is pinned by `parquet` 54, which the
  # `helios-sof` pin pulls in. helios-sof only writes Parquet (SQL-on-FHIR
  # exports, `zstd` one of the compression choices) and never reads it, so the
  # decompression paths are unreachable; 0391 needs an encoder dropped mid-stream
  # after an error and then reused. Reviewed, temporary — drop once helios moves
  # to a `parquet` on zstd 0.14.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0403",
]
# Only fail on "unmaintained" advisories for crates we depend on directly; deep
# transitive ones (e.g. the gtk3/atk chain pulled in by Tauri, or unic-* and
# proc-macro-error) are outside our control and would otherwise block every PR.
# Actual vulnerabilities are still denied everywhere in the tree.
unmaintained = "workspace"

[licenses]
# Our own workspace crates are `publish = false` and carry no license field;
# skip them so they aren't reported as "unlicensed".
private = { ignore = true }
# Allowlist of SPDX licenses permitted anywhere in the dependency tree. When a
# new dependency trips this, confirm the license is acceptable and add it here,
# or scope a one-off allowance to a single crate via `exceptions`.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
  # bzip2's own permissive BSD-style license, carried by the Rust port of
  # libbzip2. It arrives through `zip` 9's bzip2 feature, which helios enables.
  { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]

[bans]
# Multiple versions of one crate are common in large trees and only bloat the
# build, so warn rather than fail. Wildcard version requirements are allowed
# because intra-workspace crates are referenced by path, not version.
multiple-versions = "warn"
wildcards = "allow"
# `rathole` (the embedded tunnel client/relay) and the `helios-*` FHIR crates
# each drag in large, independent dependency trees that never interoperate at
# runtime. The duplicate crate versions they pull (e.g. their own reqwest /
# getrandom / rand lineages) can't be unified across those semver-incompatible
# trees, and there's no value in trying. Skip each subtree for the
# multiple-versions check rather than chasing un-unifiable duplicates. New
# duplicates outside these subtrees still surface as warnings.
skip-tree = [
  { crate = "rathole" },
  { crate = "helios-fhir" },
  { crate = "helios-fhirpath" },
  { crate = "helios-persistence" },
  { crate = "helios-rest" },
]

[sources]
# Dependencies may only come from the public crates.io registry. Anything from
# an unknown git remote or alternative registry is blocked so unreviewed code
# can't slip in through a dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Our fork of `tauri-plugin-background-service`, which the workspace's
# `[patch.crates-io]` points at until upstream releases its fixes.
allow-git = [
  "https://github.com/wildflowerhealthio/rathole",
  "https://github.com/wildflowerhealthio/tauri-background-service",
]
