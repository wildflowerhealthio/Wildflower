name: OpenSSF Scorecard

# Scores the repository's supply-chain practices (branch protection, pinned
# dependencies, token permissions, signed releases, and so on) with OpenSSF
# Scorecard. Findings land in the Security tab as code-scanning alerts, and the
# published results back the README badge and the public score at
# https://scorecard.dev/viewer/?uri=github.com/wildflowerhealthio/Wildflower.
#
# Publishing requires the workflow to stay minimal: no top-level `env` or
# `defaults`, no workflow-level write permissions, and only Scorecard's
# allowlisted actions in the job.
on:
  # Branch-Protection is only scored on the default branch's push or schedule
  # runs.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published results with an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
