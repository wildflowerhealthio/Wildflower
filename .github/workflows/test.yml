name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build internal projects
        run: vp run pack

      - name: Run tests in Vitest packages
        run: vp test

      - name: Run tests in React Native + Jest packages
        run: vp run jest
