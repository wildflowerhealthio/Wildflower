name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    # Skip on draft PRs; `pull_request` is null on push events so the
    # comparison is true and the job still runs on main.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need history + origin/main for `test:changed` to compute the merge-base.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build internal projects
        run: vp run pack

      - name: Run tests (full strength on main)
        if: github.event_name == 'push'
        run: vp run test:all

      - name: Run tests (reduced for unchanged on PR)
        if: github.event_name == 'pull_request'
        run: vp run test:changed
