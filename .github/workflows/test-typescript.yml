name: TypeScript Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed-file list from the GitHub API.
  pull-requests: read

# Cancel superseded PR runs to save the actions budget; pushes to main always
# run to completion.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether this change touches TS/JS. A Rust-only PR skips the heavy
  # `vp-test` job below; every push to main runs it regardless.
  changes:
    name: TypeScript Test [Detect Changes]
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/path-filters.yml

  vp-test:
    name: TypeScript Test [Check]
    needs: changes
    # Skip on draft PRs; `pull_request` is null on push events so the draft
    # comparison is true and the job still runs on main.
    if: ${{ github.event.pull_request.draft != true && (github.event_name == 'push' || needs.changes.outputs.ts == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Need history + origin/main for `test:changed` to compute the merge-base.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      # vp's task cache (node_modules/.vite/task-cache) only stores terminal
      # output, not the dist/ files that `vp run pack` produces. Caching both
      # together keeps cache hits in sync with the dist/ outputs that Expo
      # Jest tests read (Jest doesn't honor the `source` export condition
      # that the root vite.config.ts sets for vitest). setup-vp already
      # caches the pnpm store, so this only covers build outputs. Shares
      # cache namespace `vp-pack-` with check.yml.
      - name: Cache vp pack outputs
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.vite/task-cache
            apps/*/dist
            domain/*/dist
            global/**/dist
            packages/*/dist
            slices/**/dist
            tools/*/dist
          key: vp-pack-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-pack-${{ runner.os }}-

      - name: Install dependencies
        run: vp install

      - name: Build internal projects
        run: vp run pack

      - name: Run tests (full strength on main)
        if: github.event_name == 'push'
        run: vp run test:all

      - name: Run tests (reduced for unchanged on PR)
        if: github.event_name == 'pull_request'
        run: vp run test:changed

  # Always-runs summary that keeps the existing "test" status name green/red.
  # Left without a `name:` so the required-check context stays "test" — make
  # THIS the required check, not vp-test, so a Rust-only PR (where vp-test is
  # skipped) is never blocked by a stuck pending check.
  test:
    needs: [changes, vp-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify vp test result
        run: |
          changes='${{ needs.changes.result }}'
          vp_test='${{ needs.vp-test.result }}'
          echo "changes=$changes vp-test=$vp_test"
          if [[ "$changes" != 'success' && "$changes" != 'skipped' ]]; then
            echo '::error::changes job did not succeed'; exit 1
          fi
          if [[ "$vp_test" == 'failure' || "$vp_test" == 'cancelled' ]]; then
            echo '::error::vp test failed'; exit 1
          fi
          echo 'test OK'
