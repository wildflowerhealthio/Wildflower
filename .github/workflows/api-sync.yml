name: API Sync

# Each slice that exposes an HTTP surface pins a cross-language wire contract via
# a committed OpenAPI snapshot (`slices/<slice>/<slice>-rust/openapi/*.openapi.json`):
#   - a Rust snapshot test proves that file matches what `utoipa` emits from the
#     live axum routes. That half runs in ci-rust.yml, whose full-workspace test
#     pass includes `openapi_spec_snapshot_is_up_to_date` and which triggers on
#     both the Rust sources and the committed snapshots.
#   - a TS drift test proves the slice's Effect `HttpApi` matches that same file.
#     That half is this workflow.
# The TS half lives here (not just in ci-typescript.yml) because that workflow's
# `test:changed` is gated to TS/JS paths, so a change to a committed snapshot
# alone would never run the drift check there. Running it here whenever either
# the TS definition or a snapshot changes closes that gap. It is project-agnostic:
# a new slice is picked up with no edit here — its TS test matches the
# `openapi-drift` filter.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Gated at the trigger to changes that touch the TS side of any slice's
    # contract or a committed snapshot, so an unrelated PR never starts this
    # workflow (no change-detection job needed). CI is a pre-merge gate only;
    # this workflow no longer runs on pushes to main.
    paths:
      # Any slice's Effect HttpApi definition + its TS drift test.
      - 'slices/**/http-api-definition/**'
      # The committed snapshots the drift test diffs against. A Rust route change
      # instead lands as *.rs and is gated by ci-rust.yml's Rust snapshot half.
      - 'slices/**/*-rust/openapi/*.openapi.json'
      # The shared wire-shape engine + the spec-drift test factory.
      - 'slices/shared-structures/shared-structures-core/src/openapi-drift/**'
      # This workflow itself.
      - '.github/workflows/api-sync.yml'

permissions:
  contents: read

# Cancel superseded PR runs to save the actions budget.
concurrency:
  group: api-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-drift:
    name: TS Drift
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.15.0
        with:
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Diff every Effect HttpApi against its committed OpenAPI spec
        # Matches every slice's `openapi-drift` test plus the shared engine's
        # unit tests; vitest resolves workspace deps via the `source` export
        # condition, so no `vp run pack` build step is needed.
        run: vp test openapi-drift
