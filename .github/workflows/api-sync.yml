name: API Sync

# The gatekeeper OAuth wire contract is a cross-language invariant pinned by the
# committed OpenAPI snapshot (`gatekeeper-rust/openapi/gatekeeper-oauth.openapi.json`):
#   - the Rust snapshot test proves that file matches what `utoipa` emits from
#     the live axum routes, and
#   - the TS drift test proves the Effect `GatekeeperApi` matches that same file.
# Those two halves otherwise live in the path-filtered `rust-test`/`test`
# workflows, so a one-sided change can satisfy its own language's gate while the
# other half is skipped — letting drift through. This workflow runs BOTH halves
# whenever either side (or the snapshot itself) changes, closing that gap.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed-file list from the GitHub API.
  pull-requests: read

# Cancel superseded PR runs to save the actions budget; pushes to main always
# run to completion.
concurrency:
  group: api-sync-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether this change touches either side of the contract. A PR that
  # touches neither skips both check jobs below; every push to main runs them.
  changes:
    name: API Sync [Detect Changes]
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        # Inlined (not in path-filters.yml) because this filter is specific to
        # this workflow, like lint-docs.yml's `markdown` filter.
        with:
          filters: |
            api:
              # Rust handlers + the committed OpenAPI snapshot the contract pins.
              - 'slices/gatekeeper/gatekeeper-rust/**'
              # The Effect HttpApi definition + the TS drift test that reads it.
              - 'slices/gatekeeper/gatekeeper-core/src/http-api-definition/**'
              # The shared wire-shape comparison engine both halves lean on.
              - 'slices/shared-structures/shared-structures-core/src/openapi-drift/**'
              # This workflow itself.
              - '.github/workflows/api-sync.yml'

  rust-snapshot:
    name: API Sync [Rust snapshot]
    needs: changes
    # Skip on draft PRs; `pull_request` is null on push events so the draft
    # comparison is true and the job still runs on main.
    if: ${{ github.event.pull_request.draft != true && (github.event_name == 'push' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust toolchain
        # Dedicated cache namespace: this job compiles only `-p gatekeeper-rust`,
        # not the whole workspace, so it must NOT join the
        # `rust-workspace-excl-tauri` key the rust-lint/rust-test jobs share
        # (that key assumes identical full-workspace inputs).
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: gatekeeper-openapi-snapshot
      - name: Verify the committed OpenAPI spec matches the utoipa routes
        # Regenerate after a wire-type change with:
        #   UPDATE_OPENAPI=1 cargo test -p gatekeeper-rust openapi_spec_snapshot_is_up_to_date
        run: cargo test -p gatekeeper-rust openapi_spec_snapshot_is_up_to_date

  ts-drift:
    name: API Sync [TS drift]
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (github.event_name == 'push' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Diff the Effect HttpApi against the committed OpenAPI spec
        # Matches both the gatekeeper drift test and the shared engine's unit
        # tests; vitest resolves workspace deps via the `source` export
        # condition, so no `vp run pack` build step is needed.
        run: vp test openapi-drift

  # Always-runs summary that keeps the "api-sync" status name green/red.
  # Intentionally left without a `name:` so the required-check context stays
  # "api-sync" — make THIS the required check, not the per-language jobs, so a PR
  # touching neither side (where both are skipped) is never blocked by a stuck
  # pending check.
  api-sync:
    needs: [changes, rust-snapshot, ts-drift]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify API sync results
        run: |
          changes='${{ needs.changes.result }}'
          rust='${{ needs.rust-snapshot.result }}'
          ts='${{ needs.ts-drift.result }}'
          echo "changes=$changes rust-snapshot=$rust ts-drift=$ts"
          if [[ "$changes" != 'success' && "$changes" != 'skipped' ]]; then
            echo '::error::changes job did not succeed'; exit 1
          fi
          if [[ "$rust" == 'failure' || "$rust" == 'cancelled' ]]; then
            echo '::error::Rust OpenAPI snapshot is out of date — regenerate with UPDATE_OPENAPI=1 cargo test -p gatekeeper-rust openapi_spec_snapshot_is_up_to_date'; exit 1
          fi
          if [[ "$ts" == 'failure' || "$ts" == 'cancelled' ]]; then
            echo '::error::Effect HttpApi drifted from the committed OpenAPI spec — fix oauth.ts / jwks.ts (or regenerate the snapshot if the server changed)'; exit 1
          fi
          echo 'api-sync OK'
