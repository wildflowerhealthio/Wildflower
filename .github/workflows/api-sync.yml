name: API Sync

# Each slice that exposes an HTTP surface pins a cross-language wire contract via
# a committed OpenAPI snapshot (`slices/<slice>/<slice>-rust/openapi/*.openapi.json`):
#   - a Rust snapshot test proves that file matches what `utoipa` emits from the
#     live axum routes, and
#   - a TS drift test proves the slice's Effect `HttpApi` matches that same file.
# Those two halves otherwise live in the path-filtered Rust/TypeScript workflows,
# so a one-sided change can satisfy its own language's gate while the other half
# is skipped — letting drift through. This workflow runs BOTH halves whenever
# either side (or a snapshot) changes, closing that gap. It is project-agnostic:
# a new slice is picked up with no edit here — its Rust snapshot test shares the
# name `openapi_spec_snapshot_is_up_to_date` (run across the workspace) and its
# TS test matches the `openapi-drift` filter.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Gated at the trigger to changes that touch either side of any slice's
    # contract, so an unrelated PR never starts this workflow (no
    # change-detection job needed). CI is a pre-merge gate only; this workflow no
    # longer runs on pushes to main. Broad on purpose: any slice's Rust crate,
    # any TS HttpApi definition, the shared engine, or a committed snapshot — so
    # a new consumer needs no edit here.
    paths:
      # Any slice's Rust crate (handlers) + its committed snapshot. Also covers
      # the shared Rust snapshot-test helper (`shared-structures-rust`).
      - 'slices/**/*-rust/**'
      # Any slice's Effect HttpApi definition + its TS drift test.
      - 'slices/**/http-api-definition/**'
      # The shared wire-shape engine + the spec-drift test factory.
      - 'slices/shared-structures/shared-structures-core/src/openapi-drift/**'
      # This workflow itself.
      - '.github/workflows/api-sync.yml'

permissions:
  contents: read

# Cancel superseded PR runs to save the actions budget.
concurrency:
  group: api-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-snapshot:
    name: Rust Snapshot
    # Skip on draft PRs.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust toolchain
        # Share the `rust-workspace-excl-tauri` cache with ci-rust.yml: this job
        # compiles the same workspace set (everything except the tauri crates),
        # so the same compiled deps warm both.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-workspace-excl-tauri
      - name: Verify every committed OpenAPI spec matches its utoipa routes
        # One shared test name across the workspace, so adding a slice's snapshot
        # test needs no edit here. Regenerate a stale snapshot with e.g.
        #   UPDATE_OPENAPI=1 cargo test -p <slice>-rust openapi_spec_snapshot_is_up_to_date
        # wildflower-tauri, browser-sniffer-tauri-rust,
        # shared-structures-tauri-rust, and tauri-plugin-native-webview are
        # excluded — all pull in `tauri = "2"` which needs GTK/webkit system
        # libs to build (see ci-rust-tauri.yml). None owns a documented
        # OpenAPI surface.
        run: cargo test --workspace --exclude wildflower-tauri --exclude browser-sniffer-tauri-rust --exclude shared-structures-tauri-rust --exclude tauri-plugin-native-webview --all-features openapi_spec_snapshot_is_up_to_date

  ts-drift:
    name: TS Drift
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Diff every Effect HttpApi against its committed OpenAPI spec
        # Matches every slice's `openapi-drift` test plus the shared engine's
        # unit tests; vitest resolves workspace deps via the `source` export
        # condition, so no `vp run pack` build step is needed.
        run: vp test openapi-drift
