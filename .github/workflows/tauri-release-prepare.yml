name: Tauri Release — Prepare

# Manually-dispatched. Enter a semver version (no leading `v`); the workflow
# cuts a `release/v<version>` branch off the dispatched ref, bumps
# `apps/wildflower-tauri/src-tauri/tauri.conf.json` and its `Cargo.toml`
# (plus `Cargo.lock`) and rewrites `apps/marketing-website/public/versions.json`,
# then opens a PR back to the dispatched branch. A human reviews and merges
# the PR the same way as any other change — no direct push to a protected
# branch. Tagging and the platform builds happen in Tauri Release — Publish,
# which fires once the PR is merged.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to release, no leading v (e.g. 1.2.3, 1.2.3-beta.1)'
        required: true
        type: string

# One prepare at a time. A second dispatch for the same version would race the
# branch-creation step; different versions can proceed on their own group.
concurrency:
  group: tauri-release-prepare-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  # `contents: write` to push the release branch; `pull-requests: write` to open
  # the release PR. No tag push here — that's the Publish workflow's job.
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Cut release branch + PR
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        id: vars
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$version' is not a valid semver (X.Y.Z or X.Y.Z-prerelease)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          # Keep the GITHUB_TOKEN attached so the branch push + `gh pr create`
          # below use it. Full history + tags are needed for the "Generate
          # changelog" step: it computes commits since the previous v* tag.
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Fail if tag already exists
        run: |
          set -euo pipefail
          tag='${{ steps.vars.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists on origin. Pick a new version."
            exit 1
          fi

      - name: Fail if release branch already exists
        # If a prior prepare run left the branch behind (merged or abandoned),
        # delete it or pick a new version — we don't want to force-push over
        # someone's in-flight review.
        run: |
          set -euo pipefail
          branch='${{ steps.vars.outputs.branch }}'
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "::error::Branch $branch already exists on origin. Delete it or pick a new version."
            exit 1
          fi

      - name: Bump tauri.conf.json version
        run: |
          set -euo pipefail
          version='${{ steps.vars.outputs.version }}'
          conf='apps/wildflower-tauri/src-tauri/tauri.conf.json'
          tmp="$(mktemp)"
          jq --arg v "$version" '.version = $v' "$conf" > "$tmp"
          mv "$tmp" "$conf"

      - name: Install cargo-edit (cargo set-version)
        uses: taiki-e/install-action@v2.87.6
        with:
          tool: cargo-edit

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Tiny job; no compiled artifacts to reuse. Own cache key so we
          # don't churn the build jobs' shared cache.
          cache-shared-key: tauri-release-prepare

      - name: Bump Cargo.toml + Cargo.lock version
        run: |
          set -euo pipefail
          version='${{ steps.vars.outputs.version }}'
          # `--package` scopes the bump to wildflower-tauri; Cargo.lock is
          # updated in place so the release-branch commit stays
          # lockfile-consistent.
          cargo set-version --package wildflower-tauri "$version"

      - name: Write marketing versions.json
        # Marketing site's `public/` is served at the site root, so this lands
        # at `/versions.json`. Direct-download URLs follow Tauri 2's default
        # bundle-naming (productName + version + target); they resolve as soon
        # as tauri-action attaches assets to the release the Publish workflow
        # creates. `releaseUrl` is the human-visible release page for that tag.
        run: |
          set -euo pipefail
          version='${{ steps.vars.outputs.version }}'
          tag='${{ steps.vars.outputs.tag }}'
          repo='${{ github.repository }}'
          download="https://github.com/$repo/releases/download/$tag"
          jq -n \
            --arg version "$version" \
            --arg tag "$tag" \
            --arg releaseUrl "https://github.com/$repo/releases/tag/$tag" \
            --arg macos "$download/Wildflower_${version}_universal.dmg" \
            --arg windows "$download/Wildflower_${version}_x64_en-US.msi" \
            --arg linux "$download/wildflower-tauri_${version}_amd64.AppImage" \
            '{
              version: $version,
              tag: $tag,
              releaseUrl: $releaseUrl,
              platforms: {
                "darwin-universal": { url: $macos },
                "windows-x86_64":   { url: $windows },
                "linux-x86_64":     { url: $linux }
              }
            }' > apps/marketing-website/public/versions.json

      - name: Generate changelog and prepend to CHANGELOG.md
        # Every commit since the previous `v*` tag (or the whole history on the
        # very first release) is listed as `- <subject> (<short sha>)` under a
        # `## v<version> — <YYYY-MM-DD>` heading, inserted right below the
        # `<!-- release-notes-start -->` marker in
        # `apps/wildflower-tauri/CHANGELOG.md`. Merge commits are excluded so
        # the list matches what a reviewer sees on the PR without duplicating
        # the "Merge pull request #N" noise. The section becomes the body of
        # the GitHub Release once the release PR merges — see
        # `tauri-release-publish.yml`.
        run: |
          set -euo pipefail
          version='${{ steps.vars.outputs.version }}'
          tag='${{ steps.vars.outputs.tag }}'
          changelog='apps/wildflower-tauri/CHANGELOG.md'
          date="$(date -u +%Y-%m-%d)"
          prev_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          notes="$(mktemp)"
          if [[ -n "$prev_tag" ]]; then
            git log "$prev_tag..HEAD" --no-merges --pretty=format:'- %s (%h)' > "$notes"
          else
            git log HEAD --no-merges --pretty=format:'- %s (%h)' > "$notes"
          fi
          # A file with `-c core.autocrlf` off ends without a trailing newline
          # after `--pretty=format`; a trailing newline keeps the markdown
          # block well-formed.
          [[ -s "$notes" ]] && printf '\n' >> "$notes" || echo '- _No commits since previous release._' > "$notes"
          section="$(mktemp)"
          {
            printf '\n## %s — %s\n\n' "$tag" "$date"
            cat "$notes"
          } > "$section"
          # Insert `$section` immediately after the `<!-- release-notes-start -->`
          # marker line so the newest release is always at the top.
          awk -v insert_file="$section" -v cl="$changelog" '
            {
              print
              if (!inserted && $0 == "<!-- release-notes-start -->") {
                while ((getline line < insert_file) > 0) print line
                close(insert_file)
                inserted = 1
              }
            }
            END {
              if (!inserted) {
                printf "::error::marker <!-- release-notes-start --> not found in %s\n", cl > "/dev/stderr"
                exit 1
              }
            }
          ' "$changelog" > "$changelog.new"
          mv "$changelog.new" "$changelog"
          # Save the raw commit list for the PR-body step below.
          cp "$notes" /tmp/release-commits.md

      - name: Create release branch, commit and push
        run: |
          set -euo pipefail
          tag='${{ steps.vars.outputs.tag }}'
          branch='${{ steps.vars.outputs.branch }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add \
            apps/wildflower-tauri/src-tauri/tauri.conf.json \
            apps/wildflower-tauri/src-tauri/Cargo.toml \
            Cargo.lock \
            apps/marketing-website/public/versions.json \
            apps/wildflower-tauri/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::error::No version-bump changes to commit. Was the workspace already at $tag?"
            exit 1
          fi
          git commit -m "chore(release): $tag"
          git push -u origin "$branch"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.vars.outputs.tag }}'
          branch='${{ steps.vars.outputs.branch }}'
          base='${{ github.ref_name }}'
          # Multi-part body: header, machine-generated commit list from the
          # "Generate changelog" step above, then footer explaining what merge
          # will trigger. Written to a file so `gh pr create` sees exact bytes.
          body="$(mktemp)"
          {
            printf 'Version bump for **%s**.\n\n' "$tag"
            printf 'Files updated:\n'
            printf -- '- `apps/wildflower-tauri/src-tauri/tauri.conf.json`\n'
            printf -- '- `apps/wildflower-tauri/src-tauri/Cargo.toml` (+ `Cargo.lock`)\n'
            printf -- '- `apps/marketing-website/public/versions.json`\n'
            printf -- '- `apps/wildflower-tauri/CHANGELOG.md` (prepended with the section below)\n\n'
            printf '## Changes since previous release\n\n'
            cat /tmp/release-commits.md
            printf '\n---\n\n'
            printf 'Merging this PR triggers **Tauri Release — Publish**, which tags '
            printf '`%s` on `%s` and fans out to the macOS / Windows / Linux build ' "$tag" "$base"
            printf 'runners. The GitHub Release is created as a draft prerelease — '
            printf 'publish it manually once the assets look right.\n'
          } > "$body"
          gh pr create \
            --base "$base" \
            --head "$branch" \
            --title "chore(release): $tag" \
            --body-file "$body"
