name: Tauri Release — Publish

# Fires when a `release/v<version>` PR opened by Tauri Release — Prepare is
# merged. Reads the version straight out of the merged
# `apps/wildflower-tauri/src-tauri/tauri.conf.json` (source of truth), pushes
# a `v<version>` tag on the merged commit, then fans out to macOS (universal),
# Windows and Linux runners. `tauri-apps/tauri-action` uploads platform bundles
# to a GitHub Release created as a draft prerelease — publish it manually once
# the assets look right. An iOS build runs in parallel, signing the IPA with
# an Apple Distribution certificate and uploading it to TestFlight via `altool`.
#
# Also exposes `workflow_dispatch` for two manual cases:
#   - Re-trigger a merge that never ran (e.g. a runner outage ate the original
#     run): dispatch from the merged branch, leave `tag` blank. The tag step is
#     idempotent: if the tag already exists on the target commit the workflow
#     proceeds to the build; if it exists on a different commit the workflow
#     fails so you can decide what to do.
#   - Rebuild an already-tagged release: set `tag` (e.g. `v0.2.0`). The build
#     checks out that tag as-is, never re-tags, and re-uploads the bundles to
#     the tag's existing draft release (tauri-action replaces same-named
#     assets). `platforms` narrows the fan-out so a single failed runner can
#     be rebuilt without repeating the ones that already succeeded. `ios`
#     rebuilds and re-uploads to TestFlight only.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to publish, no leading v. Must match tauri.conf.json on the dispatched ref; leave blank to read it from there. Ignored when `tag` is set.'
        required: false
        type: string
      tag:
        description: 'Rebuild an existing tag (e.g. v0.2.0): check it out as-is, skip tagging, re-upload its bundles. Leave blank to tag the dispatched ref.'
        required: false
        type: string
      platforms:
        description: 'Which platform builds to run.'
        required: false
        default: all
        type: choice
        options: [all, macos, windows, linux, ios]

# One publish at a time. Never cancel a build midway: partial artifacts on a
# draft release are worse than waiting for the previous run to finish.
concurrency:
  group: tauri-release-publish
  cancel-in-progress: false

permissions:
  # Needed to push the tag and let tauri-action create / upload assets to the
  # GitHub Release.
  contents: write

jobs:
  prepare:
    name: Tag merged release commit
    # Gate: on a PR event, only run for a merged release/v* PR. Manual
    # workflow_dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      sha: ${{ steps.vars.outputs.sha }}
      release_body: ${{ steps.notes.outputs.body }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve target ref
        id: target
        # PR event: tag the exact commit the merge produced on the base
        # branch (`merge_commit_sha` is set by GitHub for every merge method —
        # merge / squash / rebase — once `merged == true`). Checking out the
        # base branch by name would race any commit that lands there between
        # the PR merging and this workflow starting, and we'd tag the wrong
        # commit. workflow_dispatch with `tag`: build the existing tag itself,
        # after confirming it is on origin (a typo must fail here, not as an
        # opaque checkout error). workflow_dispatch without `tag`: tag
        # whatever ref the workflow was dispatched from.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rebuild_tag='${{ inputs.tag }}'
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            echo "ref=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$rebuild_tag" ]]; then
            if [[ ! "$rebuild_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag '$rebuild_tag' is not of the form vX.Y.Z or vX.Y.Z-prerelease."
              exit 1
            fi
            # No checkout yet at this point, so ask the API rather than git.
            if ! gh api "repos/${{ github.repository }}/git/ref/tags/$rebuild_tag" --silent; then
              echo "::error::Tag $rebuild_tag does not exist on origin. Leave 'tag' blank to cut a new one."
              exit 1
            fi
            echo "ref=refs/tags/$rebuild_tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          # Keep the GITHUB_TOKEN attached so the tag push below uses it.
          persist-credentials: true

      - name: Resolve version and tag
        id: vars
        # tauri.conf.json at the checked-out commit is the source of truth:
        # it is what the bundler stamps into the installers, so a version
        # that disagrees with it would attach wrongly-versioned assets to the
        # release. A rebuild `tag` or an explicit dispatch `version` is
        # therefore an assertion that must match it, never an override.
        run: |
          set -euo pipefail
          rebuild_tag='${{ inputs.tag }}'
          input='${{ inputs.version }}'
          conf_version="$(jq -r '.version' apps/wildflower-tauri/src-tauri/tauri.conf.json)"
          if [[ -n "$rebuild_tag" ]]; then
            version="${rebuild_tag#v}"
            source="tag $rebuild_tag"
          elif [[ -n "$input" ]]; then
            version="$input"
            source="dispatch input version=$input"
          else
            version="$conf_version"
            source="tauri.conf.json"
          fi
          if [[ "$version" != "$conf_version" ]]; then
            echo "::error::$source says $version but tauri.conf.json at $(git rev-parse --short HEAD) says $conf_version."
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Resolved version '$version' is not a valid semver."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Tag and push (idempotent)
        # Skipped outright on a tag rebuild: the checkout above is the tag, so
        # there is nothing to push, and never re-pointing an existing tag is
        # the whole point of that mode. Otherwise: if the tag already points
        # at this commit we treat it as a re-run and move on; if it points at
        # a different commit we bail out so a human can decide (delete the
        # tag, cut a new version, etc.).
        if: ${{ !inputs.tag }}
        run: |
          set -euo pipefail
          tag='${{ steps.vars.outputs.tag }}'
          sha='${{ steps.vars.outputs.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            # Peel the annotated tag to its target commit for the compare.
            peeled="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')"
            existing="${peeled:-$remote_sha}"
            if [[ "$existing" == "$sha" ]]; then
              echo "Tag $tag already points at $sha; continuing to build."
              exit 0
            fi
            echo "::error::Tag $tag already exists at $existing but this run targets $sha."
            exit 1
          fi
          git tag -a "$tag" -m "Wildflower $tag"
          git push origin "refs/tags/$tag"

      - name: Extract release notes from CHANGELOG.md
        # Everything from the first `## v…` heading up to (not including) the
        # next `## v…` heading — the section the Prepare workflow prepended
        # for this release. The heading itself is dropped so the release body
        # doesn't repeat the version name (`releaseName` already carries it).
        # If the changelog has no `## v…` sections yet (someone running Publish
        # standalone before ever running Prepare) fall back to a stub so
        # tauri-action still has something to post.
        id: notes
        run: |
          set -euo pipefail
          changelog='apps/wildflower-tauri/CHANGELOG.md'
          body="$(mktemp)"
          if [[ -f "$changelog" ]] && grep -q '^## v' "$changelog"; then
            awk '
              /^## v/ { if (++n == 2) exit; next }
              n == 1 { print }
            ' "$changelog" > "$body"
          fi
          # Trim leading blank lines so the release body starts with content;
          # GitHub tolerates trailing blanks, no need to strip them.
          sed -i '/./,$!d' "$body"
          if [[ ! -s "$body" ]]; then
            printf 'See the assets below to download and install this version.\n' > "$body"
          fi
          {
            echo 'body<<CHANGENOTES_EOF'
            cat "$body"
            echo 'CHANGENOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Select platform matrix
        id: matrix
        # The build fan-out lives here (not as a static `strategy.matrix`) so
        # the `platforms` dispatch input can narrow it: a rebuild of one
        # failed runner shouldn't redo the ~50 min builds that succeeded. PR
        # events and `all` keep every platform.
        #
        # `rustflags` feeds setup-rust-toolchain (default `-D warnings`).
        # Windows adds `advapi32.lib` to every link: `rathole`'s build script
        # (via libgit2-sys 0.14) needs it and doesn't link it itself — see
        # "Windows Tauri release links need advapi32.lib" in
        # docs/Agents/Learnings Inbox.md.
        run: |
          set -euo pipefail
          platforms='${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}'
          jq -c -n --arg platforms "$platforms" '
            {
              include: [
                { key: "macos",   name: "macOS (universal)", os: "macos-latest",
                  args: "--target universal-apple-darwin",
                  "rust-targets": "x86_64-apple-darwin,aarch64-apple-darwin",
                  rustflags: "-D warnings" },
                { key: "windows", name: "Windows", os: "windows-latest",
                  args: "", "rust-targets": "",
                  rustflags: "-D warnings -C link-arg=advapi32.lib" },
                { key: "linux",   name: "Linux", os: "ubuntu-22.04",
                  args: "", "rust-targets": "",
                  rustflags: "-D warnings" }
              ] | map(select($platforms == "all" or .key == $platforms))
            }' > /tmp/matrix.json
          if [[ "$platforms" != "ios" && "$(jq '.include | length' /tmp/matrix.json)" == 0 ]]; then
            echo "::error::platforms='$platforms' selected no build."
            exit 1
          fi
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms != 'ios'
    strategy:
      # One platform failing shouldn't kill the others' draft-release uploads.
      fail-fast: false
      # Built by the prepare job's "Select platform matrix" step.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the exact commit the prepare job tagged, not the branch
          # tip (which could have moved on between merge and build start).
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Verify Apple signing identity (macOS)
        if: matrix.key == 'macos'
        # Fails in seconds, not after the ~20 min compile, when the Apple
        # secrets can't sign. Same env set as tauri-action receives below.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/checks/apple-signing-preflight.sh

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        # Same list ci-rust.yml uses; required for the webkit2gtk crate to link.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Extra macOS targets for the universal binary; empty on other OSes.
          target: ${{ matrix.rust-targets }}
          rustflags: ${{ matrix.rustflags }}
          cache-shared-key: tauri-release-${{ matrix.os }}

      # Vite+ owns the toolchain (Node + package manager + `vp`), same as
      # every other workflow here — no separate setup-node / corepack / pnpm.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true

      - name: Install workspace dependencies
        # `vp install` runs the browser-sniffer-tauri `prepare` hook, which
        # regenerates the tauri-bootstrap JS bundle that
        # browser-sniffer-tauri-rust `include_str!`s at compile time.
        run: vp install

      - name: Build workspace (vp run pack)
        # `wildflower-tauri` bundles the workspace-built webviews:
        #   - `apps/wildflower-react/dist-single-web/index-single-web.html` is
        #     `include_str!`ed by `spa.rs` (produced by `build:single-web`).
        #   - `apps/wildflower-tauri/dist` is the Tauri `frontendDist`.
        # `vp run pack` builds every package in dependency order and is the
        # single command the project's own release checklist uses.
        run: vp run pack

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (skipped silently if the secret is unset).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarization + signing (macOS runner only; empty elsewhere
          # is harmless, tauri-action just skips notarization).
          # APPLE_SIGNING_IDENTITY must name a "Developer ID Application"
          # certificate contained in APPLE_CERTIFICATE; an "Apple Development"
          # cert (or a name that doesn't match the imported cert) fails the
          # bundle step with "failed to resolve signing identity". The
          # "Verify Apple signing identity" step above catches that before
          # the compile.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/wildflower-tauri
          # tauri-action detects the package manager from a lockfile inside
          # `projectPath`; there is none there (pnpm-lock.yaml is at the
          # workspace root), so it fell back to `npm run tauri`. Drive the
          # CLI through Vite+ instead — `vp run tauri` forwards the trailing
          # `build …` args to the `tauri` script, the same command a
          # contributor runs locally.
          tauriScript: vp run tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Wildflower ${{ needs.prepare.outputs.tag }}'
          releaseBody: ${{ needs.prepare.outputs.release_body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  build-ios:
    name: Build iOS + TestFlight
    needs: prepare
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Install Apple certificate and provisioning profile
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID="$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            "$(security cms -D -i "$PP_PATH")")"
          cp "$PP_PATH" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID.mobileprovision"

      - name: Set up App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-ios
          rustflags: '-D warnings'
          cache-shared-key: tauri-release-ios

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          cache: true

      - name: Install workspace dependencies
        run: vp install

      - name: Build workspace (vp run pack)
        run: vp run pack

      - name: Build iOS app
        working-directory: apps/wildflower-tauri
        run: vp run tauri -- ios build --export-method app-store-connect

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file apps/wildflower-tauri/src-tauri/gen/apple/build/arm64/Wildflower.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
