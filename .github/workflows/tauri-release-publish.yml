name: Tauri Release — Publish

# Fires when a `release/v<version>` PR opened by Tauri Release — Prepare is
# merged. Reads the version straight out of the merged
# `apps/wildflower-tauri/src-tauri/tauri.conf.json` (source of truth), pushes
# a `v<version>` tag on the merged commit, then fans out to macOS (universal),
# Windows and Linux runners. `tauri-apps/tauri-action` uploads platform bundles
# to a GitHub Release created as a draft prerelease — publish it manually once
# the assets look right.
#
# Also exposes `workflow_dispatch` as a manual re-run for the case where the
# PR merged but this workflow needed to be re-triggered (e.g. a runner outage
# ate the original run). The tag step is idempotent: if the tag already exists
# on the target commit the workflow proceeds to the build; if it exists on a
# different commit the workflow fails so you can decide what to do.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to publish, no leading v. Leave blank to read from tauri.conf.json on the dispatched ref.'
        required: false
        type: string

# One publish at a time. Never cancel a build midway: partial artifacts on a
# draft release are worse than waiting for the previous run to finish.
concurrency:
  group: tauri-release-publish
  cancel-in-progress: false

permissions:
  # Needed to push the tag and let tauri-action create / upload assets to the
  # GitHub Release.
  contents: write

jobs:
  prepare:
    name: Tag merged release commit
    # Gate: on a PR event, only run for a merged release/v* PR. Manual
    # workflow_dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      sha: ${{ steps.vars.outputs.sha }}
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Resolve target ref
        id: target
        # PR event: tag the exact commit the merge produced on the base
        # branch (`merge_commit_sha` is set by GitHub for every merge method —
        # merge / squash / rebase — once `merged == true`). Checking out the
        # base branch by name would race any commit that lands there between
        # the PR merging and this workflow starting, and we'd tag the wrong
        # commit. workflow_dispatch: tag whatever ref the workflow was
        # dispatched from.
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            echo "ref=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          # Keep the GITHUB_TOKEN attached so the tag push below uses it.
          persist-credentials: true

      - name: Resolve version and tag
        id: vars
        # Prefer an explicit workflow_dispatch input; fall back to the version
        # written into tauri.conf.json by the Prepare workflow.
        run: |
          set -euo pipefail
          input='${{ inputs.version }}'
          if [[ -n "$input" ]]; then
            version="$input"
          else
            version="$(jq -r '.version' apps/wildflower-tauri/src-tauri/tauri.conf.json)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Resolved version '$version' is not a valid semver."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Tag and push (idempotent)
        # If the tag already points at this commit we treat it as a re-run and
        # move on. If it points at a different commit we bail out so a human
        # can decide (delete the tag, cut a new version, etc.).
        run: |
          set -euo pipefail
          tag='${{ steps.vars.outputs.tag }}'
          sha='${{ steps.vars.outputs.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            # Peel the annotated tag to its target commit for the compare.
            peeled="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')"
            existing="${peeled:-$remote_sha}"
            if [[ "$existing" == "$sha" ]]; then
              echo "Tag $tag already points at $sha; continuing to build."
              exit 0
            fi
            echo "::error::Tag $tag already exists at $existing but this run targets $sha."
            exit 1
          fi
          git tag -a "$tag" -m "Wildflower $tag"
          git push origin "refs/tags/$tag"

      - name: Extract release notes from CHANGELOG.md
        # Everything from the first `## v…` heading up to (not including) the
        # next `## v…` heading — the section the Prepare workflow prepended
        # for this release. The heading itself is dropped so the release body
        # doesn't repeat the version name (`releaseName` already carries it).
        # If the changelog has no `## v…` sections yet (someone running Publish
        # standalone before ever running Prepare) fall back to a stub so
        # tauri-action still has something to post.
        id: notes
        run: |
          set -euo pipefail
          changelog='apps/wildflower-tauri/CHANGELOG.md'
          body="$(mktemp)"
          if [[ -f "$changelog" ]] && grep -q '^## v' "$changelog"; then
            awk '
              /^## v/ { if (++n == 2) exit; next }
              n == 1 { print }
            ' "$changelog" > "$body"
          fi
          # Trim leading blank lines so the release body starts with content;
          # GitHub tolerates trailing blanks, no need to strip them.
          sed -i '/./,$!d' "$body"
          if [[ ! -s "$body" ]]; then
            printf 'See the assets below to download and install this version.\n' > "$body"
          fi
          {
            echo 'body<<CHANGENOTES_EOF'
            cat "$body"
            echo 'CHANGENOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      # One platform failing shouldn't kill the others' draft-release uploads.
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'x86_64-apple-darwin,aarch64-apple-darwin'
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the exact commit the prepare job tagged, not the branch
          # tip (which could have moved on between merge and build start).
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        # Same list ci-rust.yml uses; required for the webkit2gtk crate to link.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Extra macOS targets for the universal binary; empty on other OSes.
          target: ${{ matrix.rust-targets }}
          cache-shared-key: tauri-release-${{ matrix.os }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install workspace dependencies
        # `pnpm install` runs the browser-sniffer-tauri `prepare` hook, which
        # regenerates the tauri-bootstrap JS bundle that
        # browser-sniffer-tauri-rust `include_str!`s at compile time.
        run: pnpm install --frozen-lockfile

      - name: Build workspace (vp run pack)
        # `wildflower-tauri` bundles the workspace-built webviews:
        #   - `apps/wildflower-react/dist-single-web/index-single-web.html` is
        #     `include_str!`ed by `spa.rs` (produced by `build:single-web`).
        #   - `apps/wildflower-tauri/dist` is the Tauri `frontendDist`.
        # `vp run pack` builds every package in dependency order and is the
        # single command the project's own release checklist uses.
        run: pnpm exec vp run pack

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (skipped silently if the secret is unset).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarization + signing (macOS runner only; empty elsewhere
          # is harmless, tauri-action just skips notarization).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/wildflower-tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Wildflower ${{ needs.prepare.outputs.tag }}'
          releaseBody: ${{ needs.prepare.outputs.release_body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
