name: Tauri Release — Publish

# Fires when a `release/v<version>` PR opened by Tauri Release — Prepare is
# merged. Reads the version straight out of the merged
# `apps/wildflower-tauri/src-tauri/tauri.conf.json` (source of truth), pushes
# a `v<version>` tag on the merged commit, then fans out to macOS (universal),
# Windows and Linux runners. `tauri-apps/tauri-action` uploads platform bundles
# to a GitHub Release created as a draft prerelease — publish it manually once
# the assets look right. Two TestFlight builds run in parallel with it, one
# iOS and one macOS, each signed with an Apple Distribution certificate and
# uploaded via `altool`. The macOS TestFlight build is a separate channel
# from the notarized Developer ID bundle above: it is sandboxed and signed
# with different certificates — see docs/Rust/Apple Release Signing
# Explanation.md.
#
# Also exposes `workflow_dispatch` for two manual cases:
#   - Re-trigger a merge that never ran (e.g. a runner outage ate the original
#     run): dispatch from the merged branch, leave `tag` blank. The tag step is
#     idempotent: if the tag already exists on the target commit the workflow
#     proceeds to the build; if it exists on a different commit the workflow
#     fails so you can decide what to do.
#   - Rebuild an already-tagged release: set `tag` (e.g. `v0.2.0`). The build
#     checks out that tag as-is, never re-tags, and re-uploads the bundles to
#     the tag's existing draft release (tauri-action replaces same-named
#     assets). `platforms` narrows the fan-out so only the runners you need
#     are rebuilt — pass a comma-separated list (e.g. `macos,ios`) to skip
#     the ones that already succeeded.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to publish, no leading v. Must match tauri.conf.json on the dispatched ref; leave blank to read it from there. Ignored when `tag` is set.'
        required: false
        type: string
      tag:
        description: 'Rebuild an existing tag (e.g. v0.2.0): check it out as-is, skip tagging, re-upload its bundles. Leave blank to tag the dispatched ref.'
        required: false
        type: string
      platforms:
        description: 'Comma-separated platform keys to build (macos, macos-testflight, windows, linux, ios), or "all". e.g. "macos,ios" to rebuild only those two.'
        required: false
        default: all
        type: string

# One publish at a time. Never cancel a build midway: partial artifacts on a
# draft release are worse than waiting for the previous run to finish.
concurrency:
  group: tauri-release-publish
  cancel-in-progress: false

permissions:
  # Needed to push the tag and let tauri-action create / upload assets to the
  # GitHub Release.
  contents: write

jobs:
  prepare:
    name: Tag merged release commit
    # Gate: on a PR event, only run for a merged release/v* PR. Manual
    # workflow_dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      sha: ${{ steps.vars.outputs.sha }}
      release_body: ${{ steps.notes.outputs.body }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve target ref
        id: target
        # PR event: tag the exact commit the merge produced on the base
        # branch (`merge_commit_sha` is set by GitHub for every merge method —
        # merge / squash / rebase — once `merged == true`). Checking out the
        # base branch by name would race any commit that lands there between
        # the PR merging and this workflow starting, and we'd tag the wrong
        # commit. workflow_dispatch with `tag`: build the existing tag itself,
        # after confirming it is on origin (a typo must fail here, not as an
        # opaque checkout error). workflow_dispatch without `tag`: tag
        # whatever ref the workflow was dispatched from.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rebuild_tag='${{ inputs.tag }}'
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            echo "ref=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$rebuild_tag" ]]; then
            if [[ ! "$rebuild_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag '$rebuild_tag' is not of the form vX.Y.Z or vX.Y.Z-prerelease."
              exit 1
            fi
            # No checkout yet at this point, so ask the API rather than git.
            if ! gh api "repos/${{ github.repository }}/git/ref/tags/$rebuild_tag" --silent; then
              echo "::error::Tag $rebuild_tag does not exist on origin. Leave 'tag' blank to cut a new one."
              exit 1
            fi
            echo "ref=refs/tags/$rebuild_tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.ref }}
          # Keep the GITHUB_TOKEN attached so the tag push below uses it.
          persist-credentials: true

      - name: Resolve version and tag
        id: vars
        # tauri.conf.json at the checked-out commit is the source of truth:
        # it is what the bundler stamps into the installers, so a version
        # that disagrees with it would attach wrongly-versioned assets to the
        # release. A rebuild `tag` or an explicit dispatch `version` is
        # therefore an assertion that must match it, never an override.
        run: |
          set -euo pipefail
          rebuild_tag='${{ inputs.tag }}'
          input='${{ inputs.version }}'
          conf_version="$(jq -r '.version' apps/wildflower-tauri/src-tauri/tauri.conf.json)"
          if [[ -n "$rebuild_tag" ]]; then
            version="${rebuild_tag#v}"
            source="tag $rebuild_tag"
          elif [[ -n "$input" ]]; then
            version="$input"
            source="dispatch input version=$input"
          else
            version="$conf_version"
            source="tauri.conf.json"
          fi
          if [[ "$version" != "$conf_version" ]]; then
            echo "::error::$source says $version but tauri.conf.json at $(git rev-parse --short HEAD) says $conf_version."
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Resolved version '$version' is not a valid semver."
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Tag and push (idempotent)
        # Skipped outright on a tag rebuild: the checkout above is the tag, so
        # there is nothing to push, and never re-pointing an existing tag is
        # the whole point of that mode. Otherwise: if the tag already points
        # at this commit we treat it as a re-run and move on; if it points at
        # a different commit we bail out so a human can decide (delete the
        # tag, cut a new version, etc.).
        if: ${{ !inputs.tag }}
        run: |
          set -euo pipefail
          tag='${{ steps.vars.outputs.tag }}'
          sha='${{ steps.vars.outputs.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            # Peel the annotated tag to its target commit for the compare.
            peeled="$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')"
            existing="${peeled:-$remote_sha}"
            if [[ "$existing" == "$sha" ]]; then
              echo "Tag $tag already points at $sha; continuing to build."
              exit 0
            fi
            echo "::error::Tag $tag already exists at $existing but this run targets $sha."
            exit 1
          fi
          git tag -a "$tag" -m "Wildflower $tag"
          git push origin "refs/tags/$tag"

      - name: Extract release notes from CHANGELOG.md
        # Everything from the first `## v…` heading up to (not including) the
        # next `## v…` heading — the section the Prepare workflow prepended
        # for this release. The heading itself is dropped so the release body
        # doesn't repeat the version name (`releaseName` already carries it).
        # If the changelog has no `## v…` sections yet (someone running Publish
        # standalone before ever running Prepare) fall back to a stub so
        # tauri-action still has something to post.
        id: notes
        run: |
          set -euo pipefail
          changelog='apps/wildflower-tauri/CHANGELOG.md'
          body="$(mktemp)"
          if [[ -f "$changelog" ]] && grep -q '^## v' "$changelog"; then
            awk '
              /^## v/ { if (++n == 2) exit; next }
              n == 1 { print }
            ' "$changelog" > "$body"
          fi
          # Trim leading blank lines so the release body starts with content;
          # GitHub tolerates trailing blanks, no need to strip them.
          sed -i '/./,$!d' "$body"
          if [[ ! -s "$body" ]]; then
            printf 'See the assets below to download and install this version.\n' > "$body"
          fi
          {
            echo 'body<<CHANGENOTES_EOF'
            cat "$body"
            echo 'CHANGENOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Select platform matrix
        id: matrix
        # The build fan-out lives here (not as a static `strategy.matrix`) so
        # the `platforms` dispatch input can narrow it: a rebuild of one
        # failed runner shouldn't redo the ~50 min builds that succeeded. PR
        # events and `all` keep every platform.
        #
        # `rustflags` feeds setup-rust-toolchain, whose own default is empty, so
        # each entry sets `-D warnings`. The value lands in `RUSTFLAGS`, which
        # forks the per-platform cache keys below.
        # Windows adds `advapi32.lib` to every link: `rathole`'s build script
        # (via libgit2-sys 0.14) needs it and doesn't link it itself — see
        # "Windows Tauri release links need advapi32.lib" in
        # docs/Agents/Learnings Inbox.md.
        run: |
          set -euo pipefail
          platforms='${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}'
          jq -c -n --arg platforms "$platforms" '
            ($platforms | split(",") | map(gsub("\\s+"; ""))) as $selected |
            {
              include: [
                { key: "macos",   name: "macOS (universal)", os: "macos-latest",
                  args: "--target universal-apple-darwin",
                  "rust-targets": "x86_64-apple-darwin,aarch64-apple-darwin",
                  rustflags: "-D warnings" },
                { key: "windows", name: "Windows", os: "windows-latest",
                  args: "", "rust-targets": "",
                  rustflags: "-D warnings -C link-arg=advapi32.lib" },
                { key: "linux",   name: "Linux", os: "ubuntu-22.04",
                  args: "", "rust-targets": "",
                  rustflags: "-D warnings" }
              ] | map(. as $entry | select(($selected | index("all")) or ($selected | index($entry.key))))
            }' > /tmp/matrix.json
          if [[ "$(jq '.include | length' /tmp/matrix.json)" == 0 ]] && \
             ! echo "$platforms" | tr ',' '\n' | grep -qxF ios; then
            echo "::error::platforms='$platforms' selected no build."
            exit 1
          fi
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: >-
      github.event_name != 'workflow_dispatch' ||
      fromJSON(needs.prepare.outputs.matrix).include[0] != null
    strategy:
      # One platform failing shouldn't kill the others' draft-release uploads.
      fail-fast: false
      # Built by the prepare job's "Select platform matrix" step.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the exact commit the prepare job tagged, not the branch
          # tip (which could have moved on between merge and build start).
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Verify Apple signing identity (macOS)
        if: matrix.key == 'macos'
        # Fails in seconds, not after the ~20 min compile, when the Apple
        # secrets can't sign. Same env set as tauri-action receives below.
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: ./scripts/checks/apple-signing-preflight.sh

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        # Same list ci-rust.yml uses; required for the webkit2gtk crate to link.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Extra macOS targets for the universal binary; empty on other OSes.
          target: ${{ matrix.rust-targets }}
          rustflags: ${{ matrix.rustflags }}
          # One key per platform: release profile, per-platform rustflags and
          # target triples, and an Ubuntu image CI does not share — see
          # docs/Rust/CI Build Cache Explanation.md.
          cache-shared-key: release-${{ matrix.key }}
          cache-on-failure: true

      # Vite+ owns the toolchain (Node + package manager + `vp`), same as
      # every other workflow here — no separate setup-node / corepack / pnpm.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          cache: true

      - name: Install workspace dependencies
        # `vp install` runs the browser-sniffer-tauri `prepare` hook, which
        # regenerates the tauri-bootstrap JS bundle that
        # browser-sniffer-tauri-rust `include_str!`s at compile time.
        run: vp install

      - name: Build workspace (vp run pack)
        # `wildflower-tauri` bundles the workspace-built webviews:
        #   - `apps/wildflower-react/dist-single-web/index-single-web.html` is
        #     `include_str!`ed by `spa.rs` (produced by `build:single-web`).
        #   - `apps/wildflower-tauri/dist` is the Tauri `frontendDist`.
        # `vp run pack` builds every package in dependency order and is the
        # single command the project's own release checklist uses.
        run: vp run pack

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (skipped silently if the secret is unset).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarization + signing (macOS runner only; empty elsewhere
          # is harmless, tauri-action just skips notarization).
          # APPLE_SIGNING_IDENTITY must name a "Developer ID Application"
          # certificate contained in APPLE_CERTIFICATE; an "Apple Development"
          # cert (or a name that doesn't match the imported cert) fails the
          # bundle step with "failed to resolve signing identity". The
          # "Verify Apple signing identity" step above catches that before
          # the compile.
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/wildflower-tauri
          # tauri-action detects the package manager from a lockfile inside
          # `projectPath`; there is none there (pnpm-lock.yaml is at the
          # workspace root), so it fell back to `npm run tauri`. Drive the
          # CLI through Vite+ instead — `vp run tauri` forwards the trailing
          # `build …` args to the `tauri` script, the same command a
          # contributor runs locally.
          tauriScript: vp run tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Wildflower ${{ needs.prepare.outputs.tag }}'
          releaseBody: ${{ needs.prepare.outputs.release_body }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  build-ios:
    name: Build iOS + TestFlight
    needs: prepare
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(inputs.platforms, 'all') ||
      contains(inputs.platforms, 'ios')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Verify Apple iOS signing inputs
        # Same env the build step receives, so it vets what the build will
        # use — and names the input at fault, which xcodebuild's own "No
        # Accounts" / "No profiles for ..." errors do not.
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ vars.IOS_PROVISIONING_PROFILE }}
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_IDENTIFIER: io.wildflowerhealth.hostapp
        run: ./scripts/checks/apple-ios-signing-preflight.sh

      - name: Set up App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Verify App Store Connect app record
        # Signing inputs being valid does not mean the upload has anywhere to
        # go: altool resolves the bundle id to an app record, and without one
        # it fails with "Cannot determine the Apple ID from Bundle ID" only
        # after the whole build. Runs after the key is written, which is what
        # it authenticates with.
        env:
          BUNDLE_IDENTIFIER: io.wildflowerhealth.hostapp
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./scripts/checks/apple-app-record-preflight.sh

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-ios
          rustflags: '-D warnings'
          # Own key despite sharing macos-latest with the desktop build: these
          # `aarch64-apple-ios` artifacts are disjoint from that job's, and the
          # two run concurrently, so one key would make them race to save
          # incomplete target dirs.
          cache-shared-key: release-ios
          cache-on-failure: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          cache: true

      - name: Install workspace dependencies
        run: vp install

      - name: Build workspace (vp run pack)
        run: vp run pack

      - name: Build iOS app
        working-directory: apps/wildflower-tauri
        # Tauri signs iOS only when it finds all three IOS_* variables, and
        # falls back to an account-based signing mode no runner can satisfy
        # when one is missing — see docs/Rust/Apple Release Signing
        # Explanation.md. IOS_MOBILE_PROVISION is Tauri's spelling; the
        # repository variable is IOS_PROVISIONING_PROFILE.
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ vars.IOS_PROVISIONING_PROFILE }}
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          # Used by the export step to talk to App Store Connect.
          APPLE_API_KEY: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ vars.APP_STORE_CONNECT_KEY_ID }}.p8
        run: vp run tauri ios build --export-method app-store-connect

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          # The IPA takes the target's PRODUCT_NAME, regenerated from
          # `productName` each build, so hardcoding a spelling turned a rename
          # into altool reporting a missing file rather than the cause.
          BUILD_DIR=src-tauri/gen/apple/build/arm64
          shopt -s nullglob
          ipas=("apps/wildflower-tauri/$BUILD_DIR"/*.ipa)
          if [[ ${#ipas[@]} -eq 0 ]]; then
            echo "::error::No .ipa in $BUILD_DIR. Contents:"
            ls -la "apps/wildflower-tauri/$BUILD_DIR" 2>&1 || echo "  (directory does not exist)"
            exit 1
          fi
          if [[ ${#ipas[@]} -gt 1 ]]; then
            echo "::error::Expected one .ipa in $BUILD_DIR, found ${#ipas[@]}: ${ipas[*]}"
            exit 1
          fi

          echo "Uploading ${ipas[0]}"
          xcrun altool --upload-app --type ios \
            --file "${ipas[0]}" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

  build-macos-testflight:
    name: Build macOS + TestFlight
    needs: prepare
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(inputs.platforms, 'all') ||
      contains(inputs.platforms, 'macos-testflight')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Verify Apple macOS App Store signing inputs
        # Same env the build steps receive. Distinct from the Developer ID
        # secrets the GitHub Release job uses: the App Store channel needs an
        # Apple Distribution certificate for the app and a Mac Installer
        # Distribution one for the pkg, neither interchangeable with it.
        env:
          MACOS_APPSTORE_CERTIFICATE: ${{ secrets.MACOS_APPSTORE_CERTIFICATE }}
          MACOS_APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPSTORE_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ vars.MACOS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_IDENTIFIER: io.wildflowerhealth.hostapp
        run: ./scripts/checks/apple-macos-appstore-preflight.sh

      - name: Set up App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Verify App Store Connect app record
        # Signing inputs being valid does not mean the upload has anywhere to
        # go: altool resolves the bundle id to an app record, and without one
        # it fails with "Cannot determine the Apple ID from Bundle ID" only
        # after the whole build. Runs after the key is written, which is what
        # it authenticates with.
        env:
          BUNDLE_IDENTIFIER: io.wildflowerhealth.hostapp
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./scripts/checks/apple-app-record-preflight.sh

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
          rustflags: '-D warnings'
          # Its own key: this build is sandboxed and signed differently from
          # the Developer ID one, and the two run concurrently on macos-latest,
          # so sharing a key would make them race to save incomplete targets.
          cache-shared-key: release-macos-appstore
          cache-on-failure: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          cache: true

      - name: Install workspace dependencies
        run: vp install

      - name: Build workspace (vp run pack)
        run: vp run pack

      - name: Install provisioning profile
        # tauri.appstore.conf.json copies this into the bundle as
        # Contents/embedded.provisionprofile. It is written rather than
        # committed, so it stays out of the repo and out of the Developer ID
        # build, which must not carry it.
        env:
          MACOS_PROVISIONING_PROFILE: ${{ vars.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          echo "$MACOS_PROVISIONING_PROFILE" | base64 --decode \
            > apps/wildflower-tauri/src-tauri/embedded.provisionprofile

      - name: Build sandboxed .app
        working-directory: apps/wildflower-tauri
        # `--bundles app` only: the App Store channel ships the .app inside a
        # pkg built below, never a dmg. The overlay config adds the sandbox
        # entitlements and the embedded profile without touching the default
        # config the Developer ID build uses.
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_APPSTORE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPSTORE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_APPSTORE_SIGNING_IDENTITY }}
        run: |
          vp run tauri build \
            --config src-tauri/tauri.appstore.conf.json \
            --bundles app \
            --target universal-apple-darwin

      - name: Package and upload to TestFlight
        env:
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ vars.MACOS_INSTALLER_SIGNING_IDENTITY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          # The .app is named after productName, which is regenerated from
          # tauri.conf.json each build, so find it rather than spelling it.
          BUILD_DIR=target/universal-apple-darwin/release/bundle/macos
          shopt -s nullglob
          apps=("$BUILD_DIR"/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one .app in $BUILD_DIR, found ${#apps[@]}. Contents:"
            ls -la "$BUILD_DIR" 2>&1 || echo "  (directory does not exist)"
            exit 1
          fi

          # productbuild needs the installer certificate in a keychain it can
          # see; the app-signing one Tauri imported cannot sign a pkg.
          KEYCHAIN="$RUNNER_TEMP/installer.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          echo "$MACOS_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" \
            -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')

          PKG="$RUNNER_TEMP/WildflowerHost.pkg"
          xcrun productbuild \
            --sign "$MACOS_INSTALLER_SIGNING_IDENTITY" \
            --component "${apps[0]}" /Applications \
            "$PKG"

          xcrun altool --upload-app --type macos \
            --file "$PKG" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/installer.keychain-db"
          if [[ -f "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN"
          fi
