name: Markdown Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Gated at the trigger to Markdown changes, so a PR with no *.md edits never
    # starts this workflow (no change-detection job needed). CI is a pre-merge
    # gate only; this workflow no longer runs on pushes to main.
    paths:
      - '**/*.md'
      - '.github/workflows/lint-markdown.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

# Cancel superseded PR runs to save the actions budget. (This was previously
# missing, so rapid pushes to a PR stacked uncancelled Markdown runs.)
concurrency:
  group: markdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Check
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          config: .markdownlint-cli2.mjs
