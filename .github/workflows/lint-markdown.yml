name: Markdown Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  check-markdown-changes:
    name: Detect Changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      has-markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            markdown:
              - '**/*.md'

  markdownlint:
    name: Check
    needs: check-markdown-changes
    if: needs.check-markdown-changes.outputs.has-markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          config: .markdownlint-cli2.mjs
