name: Markdown Lint

on:
  # Called by ci.yml, which runs this only on pull requests that touch
  # Markdown; the paths are its `changes` filter.
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  markdownlint:
    name: Check
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: .markdownlint-cli2.mjs
