name: Rust Lint

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed-file list from the GitHub API.
  pull-requests: read

# Cancel an in-flight run when a PR is pushed again, to save the actions
# budget. Pushes to main keep cancel-in-progress off so every main commit gets
# a complete run.
concurrency:
  group: rust-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which parts of the tree changed. Cheap (checkout + diff only); the
  # outputs gate the heavy jobs so an unrelated PR doesn't spend runners
  # compiling Rust.
  changes:
    name: Detect Changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      tauri: ${{ steps.filter.outputs.tauri }}
      tauri-bootstrap: ${{ steps.filter.outputs.tauri-bootstrap }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/path-filters.yml

  lint:
    name: Lib Check
    needs: changes
    # Full run on every push to main; on PRs only when Rust files changed.
    if: ${{ github.event.pull_request.draft != true && (github.event_name == 'push' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust toolchain
        # Reads rust-toolchain.toml (channel + rustfmt/clippy), caches build
        # artifacts, and registers clippy/rustfmt problem matchers so findings
        # surface as inline PR annotations. `cache-shared-key` joins this
        # job's cache namespace with rust-test/nextest, since both compile the
        # same workspace (everything except wildflower-tauri) — without it the
        # two jobs warm separate caches from cold despite identical inputs.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-workspace-excl-tauri
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        # wildflower-tauri and browser-sniffer-tauri-rust are excluded here:
        # both pull in `tauri = "2"` which needs webkit2gtk/gtk system
        # libraries to compile, so they get their own `tauri` job below.
        run: cargo clippy --workspace --exclude wildflower-tauri --exclude browser-sniffer-tauri-rust --all-targets --all-features -- -D warnings
      - name: clippy pedantic (informational)
        # Pedantic findings are surfaced as annotations but do not fail the job
        # yet. Once the codebase is clean against them, promote this by folding
        # `-W clippy::pedantic` into the deny-warnings step above.
        continue-on-error: true
        run: cargo clippy --workspace --exclude wildflower-tauri --exclude browser-sniffer-tauri-rust --all-targets --all-features -- -W clippy::pedantic

  # Compiles + lints the tauri crate, which `lint` excludes because its deps
  # need GTK/webkit system libraries. Without this the crate is only
  # fmt-checked, so a change that breaks its build would otherwise pass CI. Runs
  # only when the tauri app changes, or on push to main, to bound the cost.
  tauri:
    name: Tauri Check
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (github.event_name == 'push' || needs.changes.outputs.tauri == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stub the embedded SPA bundle
        # `spa.rs` `include_str!`s the single-file web bundle
        # (`dist-single-web/index-single-web.html`), which is produced by the
        # `build:single-web` step and gitignored — so it's absent in a fresh
        # checkout and the crate won't compile. CI only lints/compiles the Rust,
        # not the served HTML, so a placeholder file is enough to satisfy the
        # `include_str!`. Real builds run `build:single-web` first.
        run: |
          mkdir -p apps/wildflower-react/dist-single-web
          echo '<!doctype html><title>stub</title>' \
            > apps/wildflower-react/dist-single-web/index-single-web.html
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # `browser-sniffer-tauri-rust` `include_str!`s a JS bundle produced
      # by the `browser-sniffer-tauri` TS package. When that bootstrap
      # source changed in this PR, regenerate via pnpm so the Rust build
      # sees the latest bytes. When only the Rust crate changed, drop a
      # stub IIFE long enough to pass the `bootstrap_is_non_empty` test
      # — pnpm install across the monorepo is ~30s of wasted work to
      # lint Rust against a bootstrap nobody touched.
      - name: Set up Node.js (for the bootstrap regen)
        if: needs.changes.outputs.tauri-bootstrap == 'true' || github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate the sniffer bootstrap
        if: needs.changes.outputs.tauri-bootstrap == 'true' || github.event_name == 'push'
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --filter browser-sniffer-tauri...
          pnpm --filter browser-sniffer-tauri run generate-tauri-bootstrap
      - name: Stub the sniffer bootstrap (rust-only PR)
        if: needs.changes.outputs.tauri-bootstrap != 'true' && github.event_name != 'push'
        run: |
          set -euo pipefail
          BOOTSTRAP_DIST=slices/browser-sniffer/browser-sniffer-tauri/dist/tauri-bootstrap.js
          mkdir -p "$(dirname "$BOOTSTRAP_DIST")"
          {
            echo '// CI stub: this PR does not touch the sniffer bootstrap source.'
            echo '// The real IIFE is regenerated by pnpm install when bootstrap-affecting'
            echo '// changes are present. Long enough to satisfy bootstrap_is_non_empty.'
            for _ in $(seq 1 40); do echo '// xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'; done
          } > "$BOOTSTRAP_DIST"
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: clippy (wildflower-tauri + browser-sniffer-tauri-rust)
        # Both crates pull in `tauri = "2"` and need the GTK/webkit system
        # libraries installed above; they are lint-checked together here so
        # the `lint` job above can stay GTK-free.
        run: cargo clippy -p wildflower-tauri -p browser-sniffer-tauri-rust --all-targets --all-features -- -D warnings

  deny:
    name: Dependency Check
    needs: changes
    # Runs on any Rust- or Tauri-touching change: the tauri crate pulls in its
    # own dependency tree, so its supply chain needs the same cargo-deny gate.
    if: ${{ github.event.pull_request.draft != true && (github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.tauri == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: cargo-deny — advisories + sources
        # Security advisories (RustSec) and source pinning (crates.io only).
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources
      - name: cargo-deny — licenses + bans
        # License allowlist + duplicate/banned-crate policy from deny.toml.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans

  # Always-runs summary job. This is the check to mark required in branch
  # protection — never the heavy jobs above. It stays green when they're
  # skipped (e.g. a TS-only PR), so path filtering can never block a merge, and
  # goes red only on a genuine lint or supply-chain failure. Intentionally left
  # without a `name:` so its required-check context stays the stable `rust-lint`
  # (the existing branch-protection rule), the same convention the TS workflows
  # use for their `check`/`test` summaries.
  rust-lint:
    needs: [changes, lint, tauri, deny]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify lint + deny results
        run: |
          changes='${{ needs.changes.result }}'
          lint='${{ needs.lint.result }}'
          tauri='${{ needs.tauri.result }}'
          deny='${{ needs.deny.result }}'
          echo "changes=$changes lint=$lint tauri=$tauri deny=$deny"
          if [[ "$changes" != 'success' && "$changes" != 'skipped' ]]; then
            echo '::error::changes job did not succeed'; exit 1
          fi
          for result in "$lint" "$tauri" "$deny"; do
            if [[ "$result" == 'failure' || "$result" == 'cancelled' ]]; then
              echo '::error::a rust-lint job failed'; exit 1
            fi
          done
          echo 'rust-lint OK'
