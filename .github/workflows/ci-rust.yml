name: Rust

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # PR runs are gated to Rust-touching changes at the trigger level, so an
    # unrelated PR never starts this workflow (no change-detection job needed).
    # This workflow no longer runs on pushes to main — CI is a pre-merge gate
    # only. The Tauri crate lives under these paths too (its *.rs / Cargo.toml
    # match), so a Tauri-only change also runs the dependency check here, while
    # ci-rust-tauri.yml handles its compile.
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'deny.toml'
      - '.github/workflows/ci-rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job for fmt + clippy + nextest + doctests: a single toolchain setup and
  # a single compiled-artifact cache mean the workspace is compiled ONCE, then
  # clippy and the tests reuse those artifacts — instead of the previous two
  # jobs (lint and nextest) each warming the cache and compiling from it
  # separately. wildflower-tauri, browser-sniffer-tauri-rust,
  # shared-structures-tauri-rust, and tauri-plugin-native-webview are
  # excluded: all pull in `tauri = "2"` and need GTK/webkit system libs, so
  # ci-rust-tauri.yml compiles, lints, and tests them on its own.
  rust:
    name: Lint + Test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust toolchain
        # Reads rust-toolchain.toml (channel + rustfmt/clippy), caches build
        # artifacts, and registers clippy/rustfmt problem matchers for inline
        # annotations. `cache-shared-key` shares the compiled-workspace cache
        # with the api-sync rust-snapshot job, which compiles the same set.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-workspace-excl-tauri
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # fmt / clippy / nextest go through scripts/checks/rust.sh — the single
      # source of truth shared with the git hooks (.vite-hooks + the `staged`
      # block in vite.config.ts), so the exclude lists and the --no-tests=warn
      # flag (nextest 0.9.85+ fails on zero tests by default; switch to
      # --no-tests=fail once Rust tests exist) can't drift between CI and local.
      # cargo + nextest are installed above, so none of the script's local-only
      # skip paths trigger here.
      - name: rustfmt
        run: ./scripts/checks/rust.sh fmt
      - name: clippy (deny warnings)
        run: ./scripts/checks/rust.sh clippy
      - name: Run tests (nextest)
        run: ./scripts/checks/rust.sh test

  # Supply-chain gate. Kept as its own job because cargo-deny doesn't reuse the
  # compiled-workspace artifacts above, so merging it in would only serialize
  # unrelated work. A Tauri-only change matches this workflow's paths, so its
  # dependency tree is covered here too.
  deny:
    name: Dependency Check
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny — advisories + sources
        # Security advisories (RustSec) and source pinning (crates.io only).
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources
      - name: cargo-deny — licenses + bans
        # License allowlist + duplicate/banned-crate policy from deny.toml.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
