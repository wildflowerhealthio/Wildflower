name: Rust

on:
  # Called by ci.yml, which runs this only on pull requests that touch
  # Rust; the paths are its `changes` filter.
  #
  # It compiles, lints, and tests the ENTIRE Cargo workspace in one job,
  # including the crates that pull in `tauri = "2"` (wildflower-tauri,
  # background-server-service-tauri-rust, browser-sniffer-tauri-rust,
  # har-recorder-tauri-rust, servers-tauri-rust, shared-structures-tauri-rust,
  # tauri-plugin-native-webview). Those need GTK/webkit system libs, so the
  # job installs them and stubs the generated web bundles the Tauri crates
  # `include_str!` (and the relay's admin UI, which wildflower-relay embeds).
  # (This used to be a separate ci-rust-tauri.yml; the split saved little
  # because most Rust PRs touch a Tauri crate anyway.)
  #
  # The full-workspace test pass also runs each slice's
  # `openapi_spec_snapshot_is_up_to_date` test — the Rust half of the OpenAPI
  # drift gate. So a snapshot-only regen with no *.rs change is matched via
  # the committed JSON path in ci.yml's `rust` filter; api-sync.yml keeps only
  # the TS drift half.
  workflow_call:

permissions:
  contents: read
  # dorny/paths-filter (the in-job bootstrap detector below) reads the PR's
  # changed-file list from the GitHub API.
  pull-requests: read

jobs:
  # One job for fmt + clippy + nextest + doctests across the WHOLE workspace: a
  # single checkout, toolchain setup, nextest install, GTK/webkit apt install,
  # and one compiled-artifact cache mean the workspace is compiled ONCE, then
  # clippy and the tests reuse those artifacts. Previously the Tauri crates were
  # split into their own workflow to avoid the GTK install on non-Tauri PRs, but
  # that isolation rarely paid off, so it's folded back in here.
  rust:
    name: Lint + Test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Detect whether the sniffer bootstrap source (or a lockfile) actually
      # changed. If so we regenerate the real IIFE below; otherwise we stub it,
      # since a full pnpm install just to compile Rust against an untouched
      # bootstrap is ~30s of wasted work. This is a single step, not a separate
      # billed job.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bootstrap:
              - 'slices/browser-sniffer/browser-sniffer-tauri/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

      # Cached per runner image: docs/Rust/CI Build Cache Explanation.md.
      - name: Install Tauri system dependencies
        uses: ./.github/actions/setup-tauri-linux-deps

      # Regenerate the sniffer bootstrap bundle via pnpm when its source
      # changed; otherwise stub it, same as the SPA bundle above.
      - name: Setup Node
        if: steps.filter.outputs.bootstrap == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Build Sniffer bootstrap
        if: steps.filter.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --filter browser-sniffer-tauri...
          pnpm --filter browser-sniffer-tauri run generate-tauri-bootstrap
      - name: Stub Sniffer bootstrap
        if: steps.filter.outputs.bootstrap != 'true'
        run: ./scripts/ci/stub-embedded-bundles.sh sniffer
      # wildflower-relay embeds the admin UI's build. Its tests serve a build
      # they define themselves, so a placeholder page is all it needs here;
      # the UI is tested by the TypeScript workflow.
      - name: Stub relay admin UI
        run: ./scripts/ci/stub-embedded-bundles.sh relay-admin-web

      - name: Set up Rust toolchain
        # Reads rust-toolchain.toml, caches the cargo registry + `target/`, and
        # registers the clippy/rustfmt problem matchers. `workspace-linux-dev`
        # names this build environment; rust-cache-warm.yml warms that entry on
        # `main`, the only ref a `pull_request` run can restore from. Key scheme:
        # docs/Rust/CI Build Cache Explanation.md.
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-shared-key: workspace-linux-dev
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.21
        with:
          tool: nextest
      # fmt / clippy / nextest go through scripts/checks/rust.sh — the single
      # source of truth shared with the git hooks (.vite-hooks + the `staged`
      # block in vite.config.ts). clippy-all / test-all run the full --workspace
      # (no Tauri exclusions); the GTK/webkit libs installed above let those
      # crates build, so none of the script's local-only skip paths trigger here.
      - name: rustfmt
        run: ./scripts/checks/rust.sh fmt
      - name: clippy (deny warnings)
        run: ./scripts/checks/rust.sh clippy-all
      - name: Run tests (nextest)
        run: ./scripts/checks/rust.sh test-all

  # Supply-chain gate. Kept as its own job because cargo-deny doesn't reuse the
  # compiled-workspace artifacts above, so merging it in would only serialize
  # unrelated work. cargo-deny-action runs in its own container and compiles
  # nothing, so this job configures no Rust cache.
  deny:
    name: Dependency Check
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny — advisories + sources
        # Security advisories (RustSec) and source pinning (crates.io only).
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources
      - name: cargo-deny — licenses + bans
        # License allowlist + duplicate/banned-crate policy from deny.toml.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
