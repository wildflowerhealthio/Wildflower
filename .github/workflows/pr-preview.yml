name: PR Preview

# Publishes a preview of each site a pull request can affect, and tears every
# one down when the PR closes. A hosted app's preview sits in `pr-<n>/` on the
# `gh-pages` branch of its own repository, so it is served at
# `https://<slug>.wildflowerhealth.io/pr-<n>/`, on the app's own origin beside
# its production build (sharing its localStorage, deliberately); the marketing
# site's sits in `pr-<n>/` on `main` of `wildflowerhealthio/staging`, served at
# `https://wildflowerhealthio.github.io/staging/pr-<n>/`. Links between apps
# always go to production, so a preview's links into another app open that
# app's production build.
#
# Two jobs build and publish the affected sites, each its group of them one
# after another, through the deploy-pages-sites action, which
# deploy-github-pages.yml runs for each production app in a job of its own:
# two runners per push, each with one checkout and one install, rather than a
# job per site. The groups come from the plan (scripts/ci/pages-sites.ts,
# `previewGroups`): every site has a fixed group, balanced by its rough build
# time, so a push affecting every site takes about half as long as one job
# would; a push whose sites all fall in one group takes one job. A site whose
# build or publish fails is reported and the rest still publish; each job
# fails at the end, naming its failures. The teardown is split the same way.
#
# Which sites a PR affects follows the TypeScript test shards' rule
# (scripts/ci/pages-sites.ts, `affectedSites`): every site for a root config or
# lockfile change, or any change outside every package; otherwise the sites
# whose package the changes reach through the workspace dependency graph, so a
# change to a shared slice previews every app built on it. The marketing
# site's preview carries the book (apps/wildflower-site/book-web) at `book/`,
# so a change reaching the book previews it too; a chapter, beside the code it
# explains outside every package, previews every site.
#
# Prerequisites (one-time): the Pages repositories deploy-github-pages.yml
# lists, plus `wildflowerhealthio/staging`, which serves Pages from `main` at
# `/`, with the GitHub App behind `STAGING_APP_ID` / `STAGING_APP_PRIVATE_KEY`
# installed on it with `Contents: Read and write`.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One preview run per PR, and one teardown run per PR, in separate groups so
# a reopen never cancels a teardown partway through. Cancelling an in-progress
# preview is safe (unlike the production deploy): the preview is disposable,
# and the newest push is what counts. A teardown and a deploy of the same PR
# still never touch a site at once: each deploy and teardown job holds its
# group's `pages-preview-<pr>-<group>` lock, and a site is in the same group
# in both, so a teardown waits for a deploy of its sites already publishing,
# and the other way round, while the two groups run side by side.
concurrency:
  group: pr-preview-${{ github.event.number }}-${{ github.event.action == 'closed' && 'teardown' || 'deploy' }}
  cancel-in-progress: true

# `pull-requests: write` lets the comment steps post and edit the preview
# comment on this repo's PR. Contents write on the Pages repositories comes
# from an App installation token (minted by the deploy-pages-sites action, and
# by the teardown), not `GITHUB_TOKEN`.
permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan the previews
    runs-on: ubuntu-latest
    # Fork PRs don't have access to repository secrets, so the App-token mint
    # would fail before any push. Skip them entirely rather than surfacing a
    # red check for every one.
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      sites: ${{ steps.plan.outputs.sites }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The preview plan diffs against the merge-base with origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-save: false

      - name: Install dependencies
        run: vp install

      # A closed PR tears down every site's preview, whichever it deployed.
      # `sites` lists them for the comment; `groups` splits them into the
      # deploy's or the teardown's jobs. Assigned first, then written: a
      # failure inside `echo "...$(...)"` would not fail the step.
      - name: Plan the sites
        id: plan
        env:
          PLAN: ${{ github.event.action == 'closed' && 'teardown' || 'preview' }}
        run: |
          sites=$(node scripts/ci/pages-sites.ts plan "$PLAN")
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
          groups=$(node scripts/ci/pages-sites.ts groups "$PLAN")
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  deploy:
    name: Push preview pages (${{ matrix.name }})
    needs: plan
    # A plan with no sites has nothing to deploy (and an empty matrix).
    if: github.event.action != 'closed' && needs.plan.outputs.sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      # One group's failure never cancels the other's publish.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.groups) }}
    # Per group, shared with the teardown (see the workflow's concurrency
    # above).
    concurrency:
      group: pages-preview-${{ github.event.number }}-${{ matrix.group }}
      cancel-in-progress: false
    steps:
      # persist-credentials:false, as in deploy-pages-site.yml: the persisted
      # GITHUB_TOKEN extraheader would override the App token on the push.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-save: false

      - name: Install dependencies
        run: vp install

      - name: Deploy the previews
        uses: ./.github/actions/deploy-pages-sites
        with:
          sites: ${{ toJSON(matrix.sites) }}
          target: ${{ github.event.number }}
          variables: ${{ toJSON(vars) }}
          app-id: ${{ secrets.STAGING_APP_ID }}
          app-private-key: ${{ secrets.STAGING_APP_PRIVATE_KEY }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  comment:
    name: Comment the preview links
    needs: [plan, deploy]
    # After the previews whatever their result, so the comment says which
    # failed (the deploy's result is failure when either group's job
    # failed); a PR whose plan has no sites only updates an earlier comment.
    if: >-
      !cancelled() && github.event.action != 'closed' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SITES: ${{ needs.plan.outputs.sites }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          body=$(mktemp)
          if [[ $SITES == '[]' ]]; then
            echo "This PR changes no published site, so it has no preview as of $HEAD_SHA." > "$body"
            scripts/ci/upsert-preview-comment.sh "$body" --update-only
            exit 0
          fi
          {
            echo '### PR preview'
            echo
            echo "Built from $HEAD_SHA. Each preview sits beside its site's production build; links between apps go to production."
            echo
            jq -r --arg pr "pr-$PR_NUMBER/" '.[] | "- [\(.name)](\(.siteUrl)\($pr))"' <<< "$SITES"
            if [[ $DEPLOY_RESULT != success ]]; then
              echo
              echo "Some previews failed to deploy; see the [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            fi
          } > "$body"
          scripts/ci/upsert-preview-comment.sh "$body"

  teardown:
    name: Remove the previews (${{ matrix.name }})
    needs: plan
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.groups) }}
    # Per group, shared with the deploy (see the workflow's concurrency
    # above).
    concurrency:
      group: pages-preview-${{ github.event.number }}-${{ matrix.group }}
      cancel-in-progress: false
    steps:
      # persist-credentials:false, as in deploy-pages-site.yml: the persisted
      # GITHUB_TOKEN extraheader would override the App token on the push.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Name the Pages repositories
        id: repositories
        env:
          SITES: ${{ toJSON(matrix.sites) }}
        run: |
          repositories=$(jq -r '[.[].pagesRepository] | unique | join(",")' <<< "$SITES")
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

      # One token for every repository of the group's sites, as in the
      # deploy-pages-sites action.
      - name: Mint the Pages repository App token
        id: pages-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.STAGING_APP_ID }}
          private-key: ${{ secrets.STAGING_APP_PRIVATE_KEY }}
          owner: wildflowerhealthio
          repositories: ${{ steps.repositories.outputs.repositories }}
          permission-contents: write

      # Every site has its turn; the step fails at the end, naming the
      # previews it could not remove.
      - name: Remove pr-${{ github.event.number }}/
        env:
          SITES: ${{ toJSON(matrix.sites) }}
          TARGET: ${{ github.event.number }}
          PAGES_TOKEN: ${{ steps.pages-token.outputs.token }}
        run: scripts/ci/deploy-pages-sites.sh teardown

  comment-teardown:
    name: Comment the previews' removal
    needs: teardown
    # Whatever the teardowns' result, so the comment never keeps live-looking
    # links to previews that are gone; it says which failed to go.
    if: ${{ !cancelled() && github.event.action == 'closed' && needs.teardown.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          TEARDOWN_RESULT: ${{ needs.teardown.result }}
        run: |
          body=$(mktemp)
          if [[ $TEARDOWN_RESULT == success ]]; then
            echo "The previews of this PR have been removed." > "$body"
          else
            echo "Some previews of this PR could not be removed; see the [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." > "$body"
          fi
          scripts/ci/upsert-preview-comment.sh "$body" --update-only
