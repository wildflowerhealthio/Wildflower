name: PR Preview

# Builds the same assembled static site as deploy-github-pages.yml
# (apps/github-pages/dist) and publishes it to the `wildflowerhealthio/staging`
# repo under `pr-<n>/` on the `main` branch, which that repo serves via GitHub
# Pages. On PR close the preview is torn down.
#
# Prerequisites (one-time):
#   - The `wildflowerhealthio/staging` repo exists and has GitHub Pages
#     configured to serve from `main` at `/`. Serving from a branch means Pages
#     runs Jekyll over it, which the `.nojekyll` step below turns off — see
#     there for why the published site breaks without it.
#   - A GitHub App exists in the `wildflowerhealthio` org and is installed on
#     `wildflowerhealthio/staging` with `Contents: Read and write`. The App's
#     numeric ID goes in the `STAGING_APP_ID` secret; its private key (the
#     .pem file, contents included) goes in `STAGING_APP_PRIVATE_KEY`. The App
#     token is minted per run and lives for one hour — no long-lived PAT sits
#     in a secret. A fine-grained PAT was tried first and hit a GitHub quirk:
#     JamesIves' underlying action hard-codes the `x-access-token` username in
#     the deploy URL, and GitHub only accepts that username with an App
#     installation token (`ghs_...`), not with a fine-grained PAT.
#
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One preview build per PR. Cancelling in-progress runs is safe here (unlike
# the production deploy): the preview is disposable, and the newest push is
# what a reviewer wants to see.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

# `pull-requests: write` lets the action post/update the preview comment on
# this repo's PR. Contents write on the target repo comes from the App
# installation token minted below, not `GITHUB_TOKEN`.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    # Fork PRs don't have access to repository secrets, so the App-token mint
    # would fail before the deploy step even ran. Skip the job entirely on
    # fork PRs rather than surfacing a red check for every one.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Mint staging-repo App token
        id: staging-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.STAGING_APP_ID }}
          private-key: ${{ secrets.STAGING_APP_PRIVATE_KEY }}
          owner: wildflowerhealthio
          repositories: staging

      # persist-credentials:false is load-bearing. The default persists
      # GITHUB_TOKEN as an extraheader on github.com, threaded into the
      # workspace's .git/config via an includeif.gitdir entry. That
      # extraheader is then sent on every HTTPS request git makes from the
      # workspace, and GitHub honors it over the URL-embedded credentials
      # JamesIves' deploy action builds. GITHUB_TOKEN has no access to
      # `wildflowerhealthio/staging`, so with the extraheader active every
      # `git ls-remote` inside the deploy step comes back as
      # `Repository not found`. This workflow never pushes back to
      # `wildflowerhealthio/Wildflower`, so we can safely drop the persisted
      # credentials.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        if: github.event.action != 'closed'
        uses: voidzero-dev/setup-vp@v1.21.0
        with:
          cache: true

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: vp install

      # Same build as the production deploy: `vp run pack` runs in workspace
      # dependency order so every assembled section is built before
      # github-pages stages them into apps/github-pages/dist.
      - name: Build site
        if: github.event.action != 'closed'
        run: vp run pack

      # Strip the marketing site's CNAME from the preview artifact. It only
      # exists at pr-<n>/CNAME in the target repo (Pages reads CNAME only from
      # the branch root), so it is inert — but removing it keeps the deployed
      # tree from claiming the production custom domain if anyone ever
      # repoints it.
      - name: Strip production CNAME from preview
        if: github.event.action != 'closed'
        run: rm -f apps/github-pages/dist/CNAME

      # The staging repo serves Pages **from a branch**, so GitHub builds it
      # with Jekyll — and Jekyll drops every path whose name starts with an
      # underscore. The assembled site ships one the app actually loads:
      # Vite names its stub for an externalized Node builtin
      # `__vite-browser-external-<hash>.js`, and the importer app's entry chunk
      # imports it, so the preview 404s on it and the app never boots. (The
      # production deploy is immune — `actions/deploy-pages` serves the uploaded
      # artifact as-is and runs no Jekyll.)
      #
      # `.nojekyll` turns the Jekyll build off. Like CNAME above, Pages reads it
      # only from the branch root, so it cannot ride along in the artifact this
      # workflow publishes into `pr-<n>/` — it has to exist in the target repo.
      # Creating it here rather than leaving it a one-time manual step means a
      # rebuilt or restored staging repo cannot silently lose it. JamesIves'
      # deploy action cleans only its target folder, so the file survives every
      # later preview.
      - name: Ensure .nojekyll at the staging site root
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ steps.staging-token.outputs.token }}
        run: |
          if gh api "repos/wildflowerhealthio/staging/contents/.nojekyll?ref=main" --silent 2>/dev/null; then
            echo '.nojekyll already present at the staging site root'
          else
            echo 'Creating .nojekyll at the staging site root'
            gh api "repos/wildflowerhealthio/staging/contents/.nojekyll" \
              --method PUT \
              --field message='Add .nojekyll so Pages serves underscore-prefixed assets' \
              --field content='Cg==' \
              --field branch=main
          fi

      # GitHub Pages serves one 404.html for the whole site, read from the site
      # root — here the staging repo root, not `pr-<n>/`. The assembled
      # artifact's own `404.html` lands at `pr-<n>/404.html`, which Pages never
      # consults, so without this step every deep link into a preview
      # (`pr-<n>/app/gatekeeper/…`) is GitHub's stock 404 instead of the SPA
      # redirect. The redirect page probes ancestors site-absolutely, so the
      # one copy at the root serves every `pr-<n>/` prefix. Synced on every
      # run (not create-once) so a change to the redirect page reaches staging;
      # the most recently deployed PR's copy is the one live.
      - name: Sync 404.html to the staging site root
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ steps.staging-token.outputs.token }}
        run: |
          content=$(base64 -w0 apps/github-pages/404.html)
          # `gh api` prints the error body on stdout for a 404, so the exit
          # status, not the output, says whether the file exists.
          existing=$(gh api "repos/wildflowerhealthio/staging/contents/404.html?ref=main" 2>/dev/null) || existing=''
          if [ -n "$existing" ] && [ "$(echo "$existing" | jq -r '.content' | tr -d '\n')" = "$content" ]; then
            echo '404.html at the staging site root is already current'
          else
            echo 'Writing 404.html at the staging site root'
            sha_args=()
            if [ -n "$existing" ]; then
              sha_args=(--field sha="$(echo "$existing" | jq -r '.sha')")
            fi
            gh api "repos/wildflowerhealthio/staging/contents/404.html" \
              --method PUT \
              --field message='Sync the SPA redirect 404.html from wildflowerhealthio/Wildflower' \
              --field content="$content" \
              --field branch=main \
              "${sha_args[@]}"
          fi

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: apps/github-pages/dist
          preview-branch: main
          # Umbrella at the repo root (not the action default `pr-preview/`)
          # so previews land at `wildflowerhealthio.github.io/staging/pr-<n>/`
          # — the URL shape the staging repo is set up for.
          umbrella-dir: '.'
          deploy-repository: wildflowerhealthio/staging
          token: ${{ steps.staging-token.outputs.token }}
          pages-base-url: wildflowerhealthio.github.io/staging
