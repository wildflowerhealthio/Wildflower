name: PR Preview

# Builds the same assembled static site as deploy-github-pages.yml
# (apps/github-pages/dist) and publishes it to the `wildflowerhealthio/staging`
# repo under `pr-<n>/` on the `main` branch, which that repo serves via GitHub
# Pages. On PR close the preview is torn down.
#
# Prerequisites (one-time):
#   - The `wildflowerhealthio/staging` repo exists and has GitHub Pages
#     configured to serve from `main` at `/`.
#   - A GitHub App exists in the `wildflowerhealthio` org and is installed on
#     `wildflowerhealthio/staging` with `Contents: Read and write`. The App's
#     numeric ID goes in the `STAGING_APP_ID` secret; its private key (the
#     .pem file, contents included) goes in `STAGING_APP_PRIVATE_KEY`. The App
#     token is minted per run and lives for one hour — no long-lived PAT sits
#     in a secret. A fine-grained PAT was tried first and hit a GitHub quirk:
#     JamesIves' underlying action hard-codes the `x-access-token` username in
#     the deploy URL, and GitHub only accepts that username with an App
#     installation token (`ghs_...`), not with a fine-grained PAT.
#
# Known limitation: `branding-core`'s `SITE_ORIGIN` and `sectionRootPath` are
# hardcoded to https://wildflowerhealth.io / absolute `/…` paths, so
# cross-section links in the preview point at production. The marketing site
# itself previews fine (relative `base: './'`). Making cross-section links
# preview-aware is a separate follow-up.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One preview build per PR. Cancelling in-progress runs is safe here (unlike
# the production deploy): the preview is disposable, and the newest push is
# what a reviewer wants to see.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

# `pull-requests: write` lets the action post/update the preview comment on
# this repo's PR. Contents write on the target repo comes from the App
# installation token minted below, not `GITHUB_TOKEN`.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    steps:
      # Shape checks on the App credential secrets before we ask octokit to
      # use them. GitHub masks the exact secret values in logs, but not their
      # lengths or short prefixes — so we can safely surface the signals that
      # distinguish a valid App-ID/PEM pair from a swapped, truncated, or
      # newline-flattened one, without revealing the credential itself.
      #
      # What we expect for a healthy setup:
      #   - STAGING_APP_ID is the numeric App ID (github.com/organizations/
      #     wildflowerhealthio/settings/apps/<slug> → "App ID"), typically 6-8
      #     digits. Not the client ID (`Iv23li…`).
      #   - STAGING_APP_PRIVATE_KEY is the full PEM: begins `-----BEGIN` and
      #     ends `-----END` (line, plus trailing newline). ~1700 chars for a
      #     2048-bit key, higher for 4096-bit. Newlines preserved.
      - name: Diagnose App credential shape
        env:
          STAGING_APP_ID: ${{ secrets.STAGING_APP_ID }}
          STAGING_APP_PRIVATE_KEY: ${{ secrets.STAGING_APP_PRIVATE_KEY }}
        run: |
          echo "STAGING_APP_ID length: ${#STAGING_APP_ID}"
          if [[ "$STAGING_APP_ID" =~ ^[0-9]+$ ]]; then
            echo "STAGING_APP_ID is numeric: yes"
          else
            echo "STAGING_APP_ID is numeric: NO (expected a small integer like 1234567; if it starts with 'Iv' it's the client ID, wrong field)"
          fi

          echo "STAGING_APP_PRIVATE_KEY length: ${#STAGING_APP_PRIVATE_KEY}"
          echo "STAGING_APP_PRIVATE_KEY starts with: ${STAGING_APP_PRIVATE_KEY:0:11}"
          echo "STAGING_APP_PRIVATE_KEY ends with:   ${STAGING_APP_PRIVATE_KEY: -25}"

          if [[ "$STAGING_APP_PRIVATE_KEY" == -----BEGIN* ]]; then
            echo "STAGING_APP_PRIVATE_KEY has BEGIN header: yes"
          else
            echo "STAGING_APP_PRIVATE_KEY has BEGIN header: NO (should start with '-----BEGIN')"
          fi

          if [[ "$STAGING_APP_PRIVATE_KEY" == *"-----END"* ]]; then
            echo "STAGING_APP_PRIVATE_KEY has END footer: yes"
          else
            echo "STAGING_APP_PRIVATE_KEY has END footer: NO (should contain '-----END')"
          fi

          # A real PEM has real newlines separating the base64 body into
          # 64-char lines. If it got pasted as one line, newline count is 0
          # or 1 and octokit's key parser will error or fall back in odd ways.
          nl=$(printf '%s' "$STAGING_APP_PRIVATE_KEY" | tr -cd '\n' | wc -c)
          echo "STAGING_APP_PRIVATE_KEY newline count: $nl (expected ~25+ for a 2048-bit key)"

      - name: Mint staging-repo App token
        id: staging-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.STAGING_APP_ID }}
          private-key: ${{ secrets.STAGING_APP_PRIVATE_KEY }}
          owner: wildflowerhealthio
          repositories: staging

      # After minting, confirm the token's shape and that it can reach the
      # target repo. Prefix (first 4 chars) tells us which token type octokit
      # actually returned:
      #   - `ghs_` = installation access token (what we want)
      #   - `eyJ`  = App bearer JWT (mis-configured — will not work for git
      #             ops beyond the very first API-style probe)
      #   - `ghp_` / `github_pat_` = a PAT snuck in via the wrong secret
      - name: Verify Access To Staging
        env:
          STAGING_DEPLOY_TOKEN: ${{ steps.staging-token.outputs.token }}
        run: |
          echo "STAGING_DEPLOY_TOKEN length: ${#STAGING_DEPLOY_TOKEN}"
          echo "STAGING_DEPLOY_TOKEN prefix: ${STAGING_DEPLOY_TOKEN:0:4}"
          git ls-remote --exit-code -h "https://x-access-token:${STAGING_DEPLOY_TOKEN}@github.com/wildflowerhealthio/staging.git" > /dev/null 2>&1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Vite+
        if: github.event.action != 'closed'
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          cache: true

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: vp install

      # Same build as the production deploy: `vp run pack` runs in workspace
      # dependency order so every assembled section is built before
      # github-pages stages them into apps/github-pages/dist.
      - name: Build site
        if: github.event.action != 'closed'
        run: vp run pack

      # Strip the marketing site's CNAME from the preview artifact. It only
      # exists at pr-<n>/CNAME in the target repo (Pages reads CNAME only from
      # the branch root), so it is inert — but removing it keeps the deployed
      # tree from claiming the production custom domain if anyone ever
      # repoints it.
      - name: Strip production CNAME from preview
        if: github.event.action != 'closed'
        run: rm -f apps/github-pages/dist/CNAME

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: apps/github-pages/dist
          preview-branch: main
          umbrella-dir: '.'
          deploy-repository: wildflowerhealthio/staging
          token: ${{ steps.staging-token.outputs.token }}
          pages-base-url: wildflowerhealthio.github.io/staging
