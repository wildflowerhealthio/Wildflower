name: Tauri Release

# Manually-dispatched Tauri release build. Enter a semver version (no leading
# `v`); the workflow bumps `apps/wildflower-tauri/src-tauri/tauri.conf.json`
# and its `Cargo.toml`, commits the bump directly to the dispatched branch,
# pushes a `v<version>` tag, then fans out to macOS (universal), Windows and
# Linux runners. `tauri-apps/tauri-action` uploads platform bundles to a
# GitHub Release created as a draft prerelease — publish it manually once the
# assets look right.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to release, no leading v (e.g. 1.2.3, 1.2.3-beta.1)'
        required: true
        type: string

# One release at a time. Never cancel a build midway: partial artifacts on a
# draft release are worse than waiting for the previous run to finish.
concurrency:
  group: tauri-release
  cancel-in-progress: false

permissions:
  # Needed to commit the version bump, push the tag, and let tauri-action
  # create / upload assets to the GitHub Release.
  contents: write

jobs:
  prepare:
    name: Bump version + tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Validate version input
        id: vars
        run: |
          set -euo pipefail
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$version' is not a valid semver (X.Y.Z or X.Y.Z-prerelease)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          # Keep the GITHUB_TOKEN attached so the commit + tag push below use it.
          persist-credentials: true

      - name: Fail if tag already exists
        run: |
          set -euo pipefail
          tag='${{ steps.vars.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists on origin. Pick a new version."
            exit 1
          fi

      - name: Bump tauri.conf.json version
        run: |
          set -euo pipefail
          version='${{ steps.vars.outputs.version }}'
          conf='apps/wildflower-tauri/src-tauri/tauri.conf.json'
          tmp="$(mktemp)"
          jq --arg v "$version" '.version = $v' "$conf" > "$tmp"
          mv "$tmp" "$conf"

      - name: Install cargo-edit (cargo set-version)
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-edit

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Tiny job; no compiled artifacts to reuse. Own cache key so we
          # don't churn the build jobs' shared cache.
          cache-shared-key: tauri-release-prepare

      - name: Bump Cargo.toml + Cargo.lock version
        run: |
          set -euo pipefail
          version='${{ steps.vars.outputs.version }}'
          # `--package` scopes the bump to wildflower-tauri; Cargo.lock is
          # updated in place so the tagged commit stays lockfile-consistent.
          cargo set-version --package wildflower-tauri "$version"

      - name: Write marketing versions.json
        # Marketing site's `public/` is served at the site root, so this lands
        # at `/versions.json`. Direct-download URLs follow Tauri 2's default
        # bundle-naming (productName + version + target); they resolve as soon
        # as tauri-action attaches assets to the release, but the release stays
        # a draft until a human publishes it. `releaseUrl` is the human-visible
        # release page for that tag.
        run: |
          set -euo pipefail
          version='${{ steps.vars.outputs.version }}'
          tag='${{ steps.vars.outputs.tag }}'
          repo='${{ github.repository }}'
          download="https://github.com/$repo/releases/download/$tag"
          jq -n \
            --arg version "$version" \
            --arg tag "$tag" \
            --arg releaseUrl "https://github.com/$repo/releases/tag/$tag" \
            --arg macos "$download/Wildflower_${version}_universal.dmg" \
            --arg windows "$download/Wildflower_${version}_x64_en-US.msi" \
            --arg linux "$download/wildflower-tauri_${version}_amd64.AppImage" \
            '{
              version: $version,
              tag: $tag,
              releaseUrl: $releaseUrl,
              platforms: {
                "darwin-universal": { url: $macos },
                "windows-x86_64":   { url: $windows },
                "linux-x86_64":     { url: $linux }
              }
            }' > apps/marketing-website/public/versions.json

      - name: Commit, tag and push
        run: |
          set -euo pipefail
          version='${{ steps.vars.outputs.version }}'
          tag='${{ steps.vars.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/wildflower-tauri/src-tauri/tauri.conf.json \
            apps/wildflower-tauri/src-tauri/Cargo.toml \
            Cargo.lock \
            apps/marketing-website/public/versions.json
          # No-op if the files were already at this version; still tag.
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $tag"
            git push origin HEAD:'${{ github.ref_name }}'
          fi
          git tag -a "$tag" -m "Wildflower $tag"
          git push origin "refs/tags/$tag"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      # One platform failing shouldn't kill the others' draft-release uploads.
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'x86_64-apple-darwin,aarch64-apple-darwin'
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the exact commit the prepare job tagged, not the branch
          # tip (which could have moved on if someone pushed after dispatch).
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        # Same list ci-rust.yml uses; required for the webkit2gtk crate to link.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Extra macOS targets for the universal binary; empty on other OSes.
          target: ${{ matrix.rust-targets }}
          cache-shared-key: tauri-release-${{ matrix.os }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install workspace dependencies
        # `pnpm install` runs the browser-sniffer-tauri `prepare` hook, which
        # regenerates the tauri-bootstrap JS bundle that
        # browser-sniffer-tauri-rust `include_str!`s at compile time.
        run: pnpm install --frozen-lockfile

      - name: Build workspace (vp run pack)
        # `wildflower-tauri` bundles the workspace-built webviews:
        #   - `apps/wildflower-react/dist-single-web/index-single-web.html` is
        #     `include_str!`ed by `spa.rs` (produced by `build:single-web`).
        #   - `apps/wildflower-tauri/dist` is the Tauri `frontendDist`.
        # `vp run pack` builds every package in dependency order and is the
        # single command the project's own release checklist uses.
        run: pnpm exec vp run pack

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing (skipped silently if the secret is unset).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarization + signing (macOS runner only; empty elsewhere
          # is harmless, tauri-action just skips notarization).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/wildflower-tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Wildflower ${{ needs.prepare.outputs.tag }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
