name: TypeScript

on:
  # Called by ci.yml, which runs this only on pull requests that touch
  # TS/JS; the paths are its `changes` filter. That job also plans the test
  # shards and the fast-check run scale (rules: scripts/ci/test-shards.ts),
  # and passes them in.
  workflow_call:
    inputs:
      matrix:
        description: 'The test matrix, `{"include":[...]}` in JSON, one entry per shard.'
        type: string
        required: true
      shard-count:
        description: 'How many shards `matrix` holds; `0` skips the test job.'
        type: string
        required: true
      run-scale:
        description: 'The fast-check run scale every shard runs at, FC_RUN_SCALE: `1` for full runs.'
        type: string
        required: true

permissions:
  contents: read
  # The ESLint/TSDoc problem matcher surfaces findings as inline PR annotations.
  checks: write
  pull-requests: write

# Two jobs, starting together: `check` (format, lint, typecheck, knip, TSDoc)
# and `test`, one runner per shard of the plan ci.yml passes in. The test pass
# is CPU-bound, so spreading it over many runners is what shortens the run;
# each pays its own install + `vp run pack` for that.
jobs:
  check:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The one job that saves the pnpm store; `test` restores only.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      # Restores the newest `vp run pack` outputs this ref can see — main's,
      # written by ts-cache-warm.yml, until this PR saves its own. This job is
      # the one that saves this commit's entry; the test runners restore only.
      # Key, paths and why: docs/TypeScript/CI Build Cache Explanation.md.
      - name: Cache vp pack outputs
        uses: ./.github/actions/vp-pack-cache

      - name: Install dependencies
        run: vp install

      - name: Build internal projects
        run: vp run pack

      - name: Run vp check (format, lint, typecheck)
        run: vp check

      # Every import resolves to a dependency its package declares; the
      # package graph check (scripts/package-graph.test.ts) trusts the
      # manifests, which hoisted node_modules would otherwise let drift.
      - name: Check imports are declared (knip)
        run: vp run lint:deps

      # TSDoc lint is informational only (continue-on-error), so it runs last
      # and never fails the job. It shares this job's install rather than
      # paying for its own checkout + `vp install`.
      - name: Enable ESLint problem matcher
        run: echo "::add-matcher::.github/eslint-problem-matcher.json"

      - name: Run ESLint with eslint-plugin-tsdoc (informational)
        run: vp run lint:comments
        continue-on-error: true

  test:
    name: Test (${{ matrix.name }})
    # GitHub fails a job whose matrix is empty, so a plan with no shards skips
    # the job instead; a skipped job counts as passing for `Required`.
    if: inputs.shard-count != '0'
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one failing area doesn't hide another's.
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Restores the pnpm store without saving it: `check` saves this run's,
      # so the parallel jobs don't race for the same key.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-save: false

      # Restore only: `check` saves this commit's entry, and the key is
      # write-once.
      - name: Cache vp pack outputs
        uses: ./.github/actions/vp-pack-cache
        with:
          save: 'false'

      - name: Install dependencies
        run: vp install

      - name: Build internal projects
        run: vp run pack

      # Each run is one `vp test run`. `--project` matches a Vitest project's
      # name exactly, unlike a path filter, which is a substring match on file
      # paths. A split group's part adds `--shard`, which divides the selected
      # projects' test files, so it never shares a run with another area.
      # Every run goes ahead after a failure, so one area's failure doesn't
      # hide another's. `numRunsFor` scales every property by FC_RUN_SCALE.
      - name: Run tests
        env:
          FC_RUN_SCALE: ${{ inputs.run-scale }}
          RUNS: ${{ toJSON(matrix.runs) }}
        run: |
          mapfile -t test_runs < <(jq -c '.[]' <<< "$RUNS")
          status=0
          for run in "${test_runs[@]}"; do
            args=()
            while IFS= read -r project; do
              args+=(--project "$project")
            done < <(jq -r '.projects[]' <<< "$run")
            vitest_shard=$(jq -r '.vitestShard // empty' <<< "$run")
            if [[ -n $vitest_shard ]]; then
              args+=(--shard "$vitest_shard")
            fi
            vp test run "${args[@]}" || status=1
          done
          exit "$status"
