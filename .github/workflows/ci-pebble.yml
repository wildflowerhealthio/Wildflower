name: Pebble

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # PR runs are gated to the Pebble apps at the trigger level, so an unrelated
    # PR never starts this workflow (no change-detection job needed). CI is a
    # pre-merge gate only; this workflow doesn't run on pushes to main. The C
    # and the wscripts live only under the two apps, so a C-only change starts
    # nothing else: ci-typescript.yml runs the same host-side tests, but only
    # when TS/JS changes.
    paths:
      - 'apps/watch-lifts/**'
      - 'apps/fhir-sync-pebble/**'
      # fhir-sync-pebble's PebbleKit JS bundles this core into the .pbw, and
      # the host-side tests decode the watch's bytes with it.
      - 'slices/fhir-sync-pebble/**'
      # The host-side tests build the C through `buildHostCDriver`.
      - 'global/kitchen-sink/src/test/**'
      - '.github/workflows/ci-pebble.yml'
      - '.github/actions/setup-pebble-sdk/**'

permissions:
  contents: read

# Cancel superseded PR runs to save the actions budget.
concurrency:
  group: pebble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job for C formatting + the host-side tests of both watch apps: they
  # share one install and one pinned clang-format, and need no Pebble SDK, so
  # they report without waiting on the SDK install and `pebble build` below.
  # Draft PRs are skipped.
  pebble:
    name: Lint + Test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      # Pinned because clang-format's output moves between releases; install
      # the same version locally (see the apps' READMEs). The runner image has
      # its own clang-format in /usr/bin, so check that the pinned one is found.
      - name: Install clang-format
        env:
          CLANG_FORMAT_VERSION: 23.1.1
        run: |
          set -euo pipefail
          pipx install "clang-format==$CLANG_FORMAT_VERSION"
          version="$(clang-format --version)"
          echo "$version"
          if [[ "$version" != *"clang-format version $CLANG_FORMAT_VERSION" ]]; then
            echo "::error::Expected clang-format $CLANG_FORMAT_VERSION first on the PATH"
            exit 1
          fi

      - name: Check C formatting
        run: vp run -F watch-lifts -F fhir-sync-pebble fmt:c:check

      # The C builds with the host `cc` under ASan and UBSan; no SDK needed.
      # watch-lifts-test covers watch-lifts; fhir-sync-pebble-test and
      # fhir-sync-pebble-pkjs cover fhir-sync-pebble's C and PebbleKit JS.
      - name: Run host-side tests
        run: vp run -F watch-lifts-test -F fhir-sync-pebble-test -F fhir-sync-pebble-pkjs test

  # One job for `pebble build` of both watch apps: the SDK is installed (or
  # restored) ONCE and both .pbw files come from it, each uploaded as an
  # artifact named after its app, ready to sideload. Runs in parallel with Lint
  # + Test. Draft PRs are skipped.
  build:
    name: Build
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true

      # fhir-sync-pebble's wscript runs `vp pack` in pkjs/ first, through the
      # node_modules/.bin/vp that `vp install` puts there.
      - name: Install dependencies
        run: vp install

      # Key, paths and why: docs/Pebble/CI Build Cache Explanation.md.
      - name: Setup Pebble SDK
        id: sdk
        uses: ./.github/actions/setup-pebble-sdk

      # One step per app, so a failure names its app. The fhir-sync-pebble
      # steps run even when watch-lifts' build fails (`!cancelled()`), so one
      # app's failure doesn't hide the other's, but not without an SDK.
      - name: Build watch-lifts
        id: build-watch-lifts
        working-directory: apps/watch-lifts
        run: pebble build

      - name: Upload watch-lifts .pbw
        if: ${{ !cancelled() && steps.build-watch-lifts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: watch-lifts
          path: apps/watch-lifts/build/watch-lifts.pbw
          if-no-files-found: error

      - name: Build fhir-sync-pebble
        id: build-fhir-sync-pebble
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        working-directory: apps/fhir-sync-pebble
        run: pebble build

      - name: Upload fhir-sync-pebble .pbw
        if: ${{ !cancelled() && steps.build-fhir-sync-pebble.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: fhir-sync-pebble
          path: apps/fhir-sync-pebble/build/fhir-sync-pebble.pbw
          if-no-files-found: error
