name: CI

# The single pre-merge gate. Every pull request starts this workflow; a
# `changes` job decides which areas the PR touches, only those areas' reusable
# workflows run, and the `Required` job at the end sums them up. `Required` is
# the one status check the `main` ruleset requires, so a PR merges (by hand or
# by auto-merge) only once every check that applies to it has passed, and a PR
# that touches no area still gets a green `Required` instead of waiting on
# checks that never start. Why it is shaped this way:
# docs/CI/Required Check Explanation.md.
#
# CI is a pre-merge gate only: nothing here runs on pushes to main.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Cancel superseded PR runs to save the actions budget. The called workflows
# run inside this one, so this group cancels them too.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas this PR touches. Each filter is the list of paths that area's
  # checks depend on; a new check area adds a filter here, a job below, and an
  # entry in `Required`'s `needs` (unless, like `rust-deny`, it only reports).
  #
  # Also plans the TypeScript and Rust test matrices, which the called
  # workflows take as inputs, so their test runners start straight after this
  # job instead of waiting on a planning job of their own. A plan runs only
  # when its area changed; an area left unplanned reports no shards.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter reads the PR's changed-file list from the GitHub API.
      pull-requests: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      typescript-matrix: ${{ steps.typescript-plan.outputs.matrix || '{"include":[]}' }}
      typescript-shard-count: ${{ steps.typescript-plan.outputs.shard-count || '0' }}
      typescript-run-scale: ${{ steps.typescript-plan.outputs.run-scale || '1' }}
      rust: ${{ steps.filter.outputs.rust }}
      rust-matrix: ${{ steps.rust-plan.outputs.matrix || '{"include":[]}' }}
      rust-shard-count: ${{ steps.rust-plan.outputs.shard-count || '0' }}
      pebble: ${{ steps.filter.outputs.pebble }}
      markdown: ${{ steps.filter.outputs.markdown }}
      api-sync: ${{ steps.filter.outputs.api-sync }}
      actions: ${{ steps.filter.outputs.actions }}
      shell: ${{ steps.filter.outputs.shell }}
      android: ${{ steps.filter.outputs.android }}
      android-bundle: ${{ steps.filter.outputs.android-bundle }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Keep aligned with where TS/JS source actually lives.
            typescript:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.cts'
              - '**/*.mts'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.cjs'
              - '**/*.mjs'
              - '**/package.json'
              - '**/tsconfig*.json'
              # Files TypeScript tests read rather than import: the Pages
              # 404 page and the shell scripts under scripts/ci/.
              - 'slices/branding/branding-core/github-pages/**'
              - 'scripts/ci/*.sh'
              # scripts/package-graph.test.ts checks the crates' dependencies
              # too, so a manifest-only Rust change must still run it.
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-typescript.yml'
              - '.github/actions/vp-pack-cache/**'
            rust:
              - '**/*.rs'
              # `**/` is not guaranteed to match a root-level file, and the
              # root manifest's lints/feature lists change what compiles on
              # their own.
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              # Committed OpenAPI snapshots. `openapi_spec_snapshot_is_up_to_date`
              # (run as part of the workspace test suite) verifies each still
              # matches what utoipa emits from the live axum routes; a
              # snapshot-only regen (no *.rs change) must still trigger that
              # check, so match the generated JSON. Snapshots sit in `slices/`
              # and in `apps/host/wildflower-server/`.
              - '**/*-rust/openapi/*.openapi.json'
              # Wire golden files the Rust tests `include_str!` alongside the
              # TS tests, so a golden-only change still runs the Rust side.
              - 'apps/host/**/*-wire-golden.json'
              # Tauri bootstrap inputs (not *.rs): browser-sniffer-tauri
              # `include_str!`s a JS bundle generated from this TS package, and
              # the lockfiles affect that bootstrap build — a change to either
              # can break the Tauri crates' compile/tests.
              - 'slices/browser-sniffer/browser-sniffer-tauri-js/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              # wildflowerhealthio-relay-server's signature test verifies the request the
              # admin UI's TypeScript signer committed here. (The UI itself
              # is stubbed for the Rust job, so its sources don't count.)
              - 'apps/relay/relay-core-js/src/signing/fixtures/*.json'
              # wildflowerhealthio-authorization-server holds the App Catalog's
              # preassigned clients to the rows its migrations seed.
              - 'apps/app-catalog/app-catalog-web/public/apps.json'
              # What the jobs run, how the test shards are planned, and the
              # stub placeholders they compile against.
              - 'scripts/checks/rust.sh'
              - 'scripts/ci/rust-shards.ts'
              - 'scripts/entrypoint.ts'
              - 'scripts/ci/stub-embedded-bundles.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-rust.yml'
              - '.github/actions/setup-tauri-linux-deps/**'
            # The C and the wscripts live only under the two apps, so a C-only
            # change runs nothing else: ci-typescript.yml runs the same
            # host-side tests, but only when TS/JS changes.
            pebble:
              # Each app's folder holds its watchapp and the core its
              # PebbleKit JS bundles into the .pbw, which the host-side tests
              # check the watch's bytes against.
              - 'apps/watch-lifts/**'
              - 'apps/fhir-sync-pebble/**'
              # The PebbleKit JS build tooling and the App Configuration
              # hand-off both apps' PebbleKit JS and settings pages build on.
              - 'global/pebble/**'
              # The host-side tests build the C through `buildHostCDriver`.
              - 'global/kitchen-sink/src/test/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-pebble.yml'
              - '.github/actions/setup-pebble-sdk/**'
            markdown:
              - '**/*.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/lint-markdown.yml'
            api-sync:
              # Any Effect HttpApi definition + its TS drift test, in a slice
              # or folded into an app (`apps/launcher/`).
              - '**/http-api-definition/**'
              # The committed snapshots the drift test diffs against. A Rust
              # route change instead lands as *.rs and is gated by
              # ci-rust.yml's Rust snapshot half.
              - '**/*-rust/openapi/*.openapi.json'
              # The FHIR R4 snapshot, which `fhir-r4`'s drift test writes from
              # the TS `HttpApi` (HFS serves the routes; no Rust test emits it).
              - 'slices/fhir/fhir-r4/openapi/*.openapi.json'
              # The shared wire-shape engine + the spec-drift test factory.
              - 'slices/shared-structures/shared-structures-core/src/openapi-drift/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/api-sync.yml'
            # actionlint reads local composite actions' inputs to check their
            # callers, so a change under actions/ can break a workflow.
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/actionlint.yaml'
            shell:
              - '**/*.sh'
              - '**/*.bash'
              - '.vite-hooks/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/lint-shell.yml'
            # ci-android.yml's `check`: the host crate's Android `cargo check`
            # and the Gradle Kotlin compile. Its paths are the host crate's
            # workspace path dependencies, transitively (`cargo metadata
            # --no-deps`), which also hold every plugin's Kotlin; the files
            # those crates read from outside their folders at compile time;
            # the root manifest and lockfile (a dependency bump runs this,
            # not the bundle); and the CI that runs it. Only the root
            # `Cargo.toml` is listed, bare: the closure's own manifests sit
            # in the folders above, and no other crate's reaches the host's
            # build.
            android:
              - 'apps/host/host-app/src-tauri/**'
              - 'apps/host/host-app/tauri-shared-config.json'
              - 'apps/host/browser-sniffer-tauri/**'
              - 'apps/host/recorder/recorder-rust/**'
              - 'apps/host/recorder/recorder-tauri/**'
              - 'apps/host/servers/servers-rust/**'
              - 'apps/host/servers/servers-tauri/**'
              - 'apps/host/tauri-plugin-native-page-browser/**'
              - 'apps/host/tauri-plugin-native-webview/**'
              - 'apps/host/unit-runner/**'
              - 'apps/host/wildflower-server/*-rust/**'
              - 'global/kitchen-sink-rust/**'
              - 'slices/ohif-server-rust/**'
              - 'slices/persistence-rust/**'
              - 'slices/rathole-settings-rust/**'
              - 'slices/scopes/scope-capabilities-rust/**'
              - 'slices/scopes/scopes-rust/**'
              - 'slices/shared-structures/shared-structures-rust/**'
              - 'dev-app-ports.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'scripts/ci/stub-embedded-bundles.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-android.yml'
              - '.github/actions/setup-android-ndk/**'
            # ci-android.yml's `bundle`, the release's own build: what shapes
            # how the bundle is packaged rather than what compiles. The
            # Gradle projects' build files and R8 rules, the Tauri config the
            # CLI builds from, the CLI's version, the toolchain, and the
            # actions and workflows that run the build.
            android-bundle:
              - 'apps/host/**/android/**/*.gradle'
              - 'apps/host/**/android/**/*.gradle.kts'
              - 'apps/host/**/android/**/gradle.properties'
              - 'apps/host/**/android/**/*.pro'
              - 'apps/host/host-app/src-tauri/gen/android/buildSrc/**'
              - 'apps/host/host-app/src-tauri/gen/android/gradle/**'
              - 'apps/host/host-app/src-tauri/tauri*.conf.json'
              - 'apps/host/host-app/src-tauri/Cargo.toml'
              - 'apps/host/host-app/package.json'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci-android.yml'
              - '.github/workflows/tauri-release-publish.yml'
              - '.github/actions/build-android-bundle/**'
              - '.github/actions/setup-android-ndk/**'

      # The planners diff against their merge-base with origin/main, so they
      # need the full history.
      - name: Checkout code
        if: steps.filter.outputs.typescript == 'true' || steps.filter.outputs.rust == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Vitest projects the root vite.config.ts defines, so a new package
      # is covered with no edit here. Only the projects of packages the PR
      # changes or reaches through the workspace dependency graph run, plus
      # `scripts`; a root config or lockfile change, or any change outside
      # every package (CI plumbing, the shard script, docs, Rust) runs them
      # all, at a fifth of the fast-check runs when no package changed. The
      # selected projects are grouped by top-level area and packed by rough
      # test time onto at most a few shards, one runner each. Rules:
      # scripts/ci/test-shards.ts. The planner loads the Vitest configs, so
      # it needs `vp install` but no `vp run pack`.
      #
      # Restores the pnpm store without saving it: ci-typescript.yml's
      # `check` saves this run's.
      - name: Setup Vite+
        if: steps.filter.outputs.typescript == 'true'
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-save: false

      - name: Install dependencies
        if: steps.filter.outputs.typescript == 'true'
        run: vp install

      # Assigned first, then written: a failure inside `echo "...$(...)"` would
      # not fail the step.
      - name: Plan TypeScript test shards
        id: typescript-plan
        if: steps.filter.outputs.typescript == 'true'
        run: |
          plan=$(node scripts/ci/test-shards.ts)
          matrix=$(jq -c '.matrix' <<< "$plan")
          shard_count=$(jq '.matrix.include | length' <<< "$plan")
          run_scale=$(jq '.runScale' <<< "$plan")
          {
            echo "matrix=$matrix"
            echo "shard-count=$shard_count"
            echo "run-scale=$run_scale"
          } >> "$GITHUB_OUTPUT"

      # A fixed set of crate groups, and only those holding a crate the PR
      # changes or reaches through the workspace path deps. A change to the
      # toolchain, the lockfile, the root manifest or the CI plumbing runs
      # them all. Rules: scripts/ci/rust-shards.ts. The planner imports only
      # Node builtins, so it needs no `vp install`.
      - name: Setup Node
        if: steps.filter.outputs.rust == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # `cargo metadata --no-deps` only reads the manifests, so the runner
      # image's own stable toolchain serves; RUSTUP_TOOLCHAIN stops rustup
      # from first installing the version rust-toolchain.toml pins.
      - name: Plan Rust test shards
        id: rust-plan
        if: steps.filter.outputs.rust == 'true'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          matrix=$(node scripts/ci/rust-shards.ts)
          shard_count=$(jq '.include | length' <<< "$matrix")
          {
            echo "matrix=$matrix"
            echo "shard-count=$shard_count"
          } >> "$GITHUB_OUTPUT"

  # A called workflow gets at most the permissions its calling job grants, so
  # each job below grants what its workflow's own `permissions` block asks for.
  typescript:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci-typescript.yml
    with:
      matrix: ${{ needs.changes.outputs.typescript-matrix }}
      shard-count: ${{ needs.changes.outputs.typescript-shard-count }}
      run-scale: ${{ needs.changes.outputs.typescript-run-scale }}

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-rust.yml
    with:
      matrix: ${{ needs.changes.outputs.rust-matrix }}
      shard-count: ${{ needs.changes.outputs.rust-shard-count }}

  # Supply-chain report for Rust PRs. Deliberately left out of `Required`'s
  # `needs`: an advisory or yanked release filed against an unchanged
  # dependency would otherwise block every Rust PR until someone triages it.
  # It still shows as a failed check on the PR. cargo-deny-action runs in its
  # own container and compiles nothing, so this job configures no Rust cache.
  rust-deny:
    name: Rust Dependency Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny — advisories + sources
        # Security advisories (RustSec) and source pinning (crates.io only).
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories sources
      - name: cargo-deny — licenses + bans
        # License allowlist + duplicate/banned-crate policy from deny.toml.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans

  pebble:
    name: Pebble
    needs: changes
    if: needs.changes.outputs.pebble == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-pebble.yml

  markdown:
    name: Markdown Lint
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/lint-markdown.yml

  api-sync:
    name: API Sync
    needs: changes
    if: needs.changes.outputs.api-sync == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/api-sync.yml

  actions:
    name: Actions Lint
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint-actions.yml

  shell:
    name: Shell Lint
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint-shell.yml

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.android-bundle == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-android.yml
    with:
      bundle: ${{ needs.changes.outputs.android-bundle == 'true' }}

  # The status check the `main` ruleset requires. A skipped area (the PR doesn't
  # touch it) counts as passing; a failed or cancelled job anywhere fails it.
  # `always()`, not `!cancelled()`: a cancelled run must still report a
  # failure here, because a skipped `Required` would count as passing.
  required:
    name: Required
    needs: [changes, typescript, rust, pebble, markdown, api-sync, actions, shell, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every CI job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::A CI job failed or was cancelled"
            exit 1
          fi
