name: Rust Tauri

# Compiles, lints, and tests the crates that pull in `tauri = "2"`
# (wildflower-tauri + browser-sniffer-tauri-rust + shared-structures-tauri-rust
# + tauri-plugin-native-webview), which the main Rust workflow (ci-rust.yml)
# excludes because their deps need GTK/webkit system libraries.
# Without this they'd only be fmt-checked, so a change breaking their build or
# tests would slip through. Runs only when a Tauri crate, the sniffer bootstrap,
# or the lockfile changes (PRs), to bound the cost. CI is a pre-merge gate only;
# this workflow no longer runs on pushes to main.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Union of every change that should run the GTK-enabled job: either Tauri
    # crate, the TS bootstrap package whose generated IIFE
    # browser-sniffer-tauri-rust `include_str!`s, and the lockfiles that affect
    # that bootstrap build.
    paths:
      - 'apps/wildflower-tauri/**'
      # Non-Tauri, but wildflower-tauri merges its router, so a change here can
      # break the Tauri build/tests — run the GTK-enabled job too.
      - 'slices/apps/vendor-apps-rust/**'
      - 'plugins/**'
      - 'slices/browser-sniffer/browser-sniffer-tauri-rust/**'
      - 'slices/browser-sniffer/browser-sniffer-tauri/**'
      - 'slices/shared-structures/shared-structures-tauri-rust/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-rust-tauri.yml'

permissions:
  contents: read
  # dorny/paths-filter (the in-job bootstrap detector below) reads the PR's
  # changed-file list from the GitHub API.
  pull-requests: read

concurrency:
  group: rust-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job for clippy + nextest + doctests across all the tauri crates: a single
  # GTK/webkit apt install, one bootstrap setup, and one compile are shared by
  # all three steps — instead of #208's separate lint and test jobs each
  # repeating the apt install + bootstrap dance + compile.
  tauri:
    name: Tauri Check
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Detect whether the sniffer bootstrap source (or a lockfile) actually
      # changed. If so we regenerate the real IIFE below; otherwise we stub it,
      # since a full pnpm install just to lint Rust against an untouched
      # bootstrap is ~30s of wasted work. This is a single step, not a separate
      # billed job.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bootstrap:
              - 'slices/browser-sniffer/browser-sniffer-tauri/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

      - name: Stub the embedded SPA bundle
        # `spa.rs` `include_str!`s the single-file web bundle
        # (`dist-single-web/index-single-web.html`), produced by the
        # `build:single-web` step and gitignored — so it's absent in a fresh
        # checkout and wildflower-tauri won't compile. CI only builds the Rust,
        # not the served HTML, so a placeholder satisfies the `include_str!`.
        run: |
          mkdir -p apps/wildflower-react/dist-single-web
          echo '<!doctype html><title>stub</title>' \
            > apps/wildflower-react/dist-single-web/index-single-web.html

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      # browser-sniffer-tauri-rust `include_str!`s a JS bundle generated from
      # the browser-sniffer-tauri TS package. Regenerate it via pnpm when the
      # bootstrap source changed; otherwise drop a non-empty stub long enough to
      # satisfy the crate's `bootstrap_is_non_empty` test.
      - name: Setup Node
        if: steps.filter.outputs.bootstrap == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Sniffer bootstrap
        if: steps.filter.outputs.bootstrap == 'true'
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --filter browser-sniffer-tauri...
          pnpm --filter browser-sniffer-tauri run generate-tauri-bootstrap
      - name: Stub Sniffer bootstrap
        if: steps.filter.outputs.bootstrap != 'true'
        run: |
          set -euo pipefail
          BOOTSTRAP_DIST=slices/browser-sniffer/browser-sniffer-tauri/dist/tauri-bootstrap.js
          mkdir -p "$(dirname "$BOOTSTRAP_DIST")"
          {
            echo '// CI stub: this PR does not touch the sniffer bootstrap source.'
            echo '// The real IIFE is regenerated by pnpm install when bootstrap-affecting'
            echo '// changes are present. Long enough to satisfy bootstrap_is_non_empty.'
            for _ in $(seq 1 40); do echo '// xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'; done
          } > "$BOOTSTRAP_DIST"

      - name: Set up Rust toolchain
        # Dedicated cache key: this job compiles the tauri crates and their deps,
        # which the `rust-workspace-excl-tauri` cache deliberately omits — so
        # sharing that key would only ever warm from cold. Its own key persists
        # the Tauri dep tree across runs.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-tauri
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The Tauri clippy + nextest invocations go through scripts/checks/rust.sh —
      # the single source of truth shared with the git hooks — so the crate `-p`
      # list and nextest flags match local checks. The GTK/webkit libs are
      # installed above, so the script's `tauri_capable` guard passes and the
      # steps run for real (locally it self-skips when those libs are absent).
      - name: clippy (tauri crates)
        run: ./scripts/checks/rust.sh tauri-clippy
      - name: Run tests (nextest)
        run: ./scripts/checks/rust.sh tauri-test
