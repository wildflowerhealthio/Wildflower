name: Rust Lib Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed-file list from the GitHub API.
  pull-requests: read

concurrency:
  group: rust-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      tauri: ${{ steps.filter.outputs.tauri }}
      tauri-bootstrap: ${{ steps.filter.outputs.tauri-bootstrap }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/path-filters.yml

  # The heavy test job. Its result is rolled up by the always-runs `rust-test`
  # summary below, which is the required check in branch protection. The job id
  # stays `nextest` (not `test`) so it never collides with the `test` summary
  # gate in test-typescript.yml.
  nextest:
    name: Check
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (github.event_name == 'push' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust toolchain
        # `cache-shared-key` joins this job's cache namespace with the `lint`
        # job in lint-rust.yml, since both compile the same workspace
        # (everything except wildflower-tauri) — without it the two jobs warm
        # separate caches from cold despite identical inputs. See lint-rust.yml
        # for the matching entry.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-workspace-excl-tauri
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run tests (nextest)
        # --no-tests=warn keeps the run green while these crates have no tests
        # yet (nextest 0.9.85+ fails on zero tests by default). Switch to
        # --no-tests=fail once Rust tests exist to guard against an empty run.
        # wildflower-tauri and browser-sniffer-tauri-rust are excluded — both
        # pull in `tauri = "2"` and need GTK/webkit system libraries. See
        # lint-rust.yml's `tauri` job and `tauri-nextest` below for the
        # GTK-enabled coverage.
        run: cargo nextest run --workspace --exclude wildflower-tauri --exclude browser-sniffer-tauri-rust --all-features --no-tests=warn
      - name: Run doctests
        # nextest does not execute doctests, so cover them with cargo test.
        run: cargo test --doc --workspace --exclude wildflower-tauri --exclude browser-sniffer-tauri-rust --all-features

  # Companion to `nextest` for the crates that pull in `tauri = "2"`. They
  # need GTK/webkit system libraries to compile, which `nextest` doesn't
  # install — without this job those crates would be lint-checked (by
  # lint-rust.yml's `tauri` job) but never tested.
  tauri-nextest:
    name: Tauri Check
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (github.event_name == 'push' || needs.changes.outputs.tauri == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stub the embedded SPA bundle
        # `spa.rs` `include_str!`s the single-file web bundle
        # (`dist-single-web/index-single-web.html`), which is produced by the
        # `build:single-web` step and gitignored — so it's absent in a fresh
        # checkout and the crate won't compile. CI only tests the Rust, not
        # the served HTML, so a placeholder file is enough to satisfy the
        # `include_str!`. Real builds run `build:single-web` first.
        run: |
          mkdir -p apps/wildflower-react/dist-single-web
          echo '<!doctype html><title>stub</title>' \
            > apps/wildflower-react/dist-single-web/index-single-web.html
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # Same regen-or-stub dance as lint-rust.yml's tauri job — see there
      # for the rationale.
      - name: Setup Node
        if: needs.changes.outputs.tauri-bootstrap == 'true' || github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Sniffer
        if: needs.changes.outputs.tauri-bootstrap == 'true' || github.event_name == 'push'
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --filter browser-sniffer-tauri...
          pnpm --filter browser-sniffer-tauri run generate-tauri-bootstrap
      - name: Stub Sniffer
        if: needs.changes.outputs.tauri-bootstrap != 'true' && github.event_name != 'push'
        run: |
          set -euo pipefail
          BOOTSTRAP_DIST=slices/browser-sniffer/browser-sniffer-tauri/dist/tauri-bootstrap.js
          mkdir -p "$(dirname "$BOOTSTRAP_DIST")"
          {
            echo '// CI stub: this PR does not touch the sniffer bootstrap source.'
            echo '// The real IIFE is regenerated by pnpm install when bootstrap-affecting'
            echo '// changes are present. Long enough to satisfy bootstrap_is_non_empty.'
            for _ in $(seq 1 40); do echo '// xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'; done
          } > "$BOOTSTRAP_DIST"
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run tests (nextest)
        run: cargo nextest run -p wildflower-tauri -p browser-sniffer-tauri-rust --all-features --no-tests=warn
      - name: Run doctests
        run: cargo test --doc -p wildflower-tauri -p browser-sniffer-tauri-rust --all-features

  # Always-runs summary job — the check to require in branch protection.
  # Left without a `name:` so its required-check context stays the stable
  # `rust-test` (the existing branch-protection rule), matching the convention
  # the TS workflows use for their `check`/`test` summaries.
  rust-test:
    needs: [changes, nextest, tauri-nextest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify test results
        run: |
          changes='${{ needs.changes.result }}'
          nextest='${{ needs.nextest.result }}'
          tauri='${{ needs.tauri-nextest.result }}'
          echo "changes=$changes nextest=$nextest tauri=$tauri"
          if [[ "$changes" != 'success' && "$changes" != 'skipped' ]]; then
            echo '::error::changes job did not succeed'; exit 1
          fi
          for result in "$nextest" "$tauri"; do
            if [[ "$result" == 'failure' || "$result" == 'cancelled' ]]; then
              echo '::error::a rust-test job failed'; exit 1
            fi
          done
          echo 'rust-test OK'
