name: Rust Lib Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed-file list from the GitHub API.
  pull-requests: read

concurrency:
  group: rust-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/path-filters.yml

  # The heavy test job. Its result is rolled up by the always-runs `rust-test`
  # summary below, which is the required check in branch protection. The job id
  # stays `nextest` (not `test`) so it never collides with the `test` summary
  # gate in test-typescript.yml.
  nextest:
    name: Check
    needs: changes
    if: ${{ github.event.pull_request.draft != true && (github.event_name == 'push' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust toolchain
        # `cache-shared-key` joins this job's cache namespace with the `lint`
        # job in lint-rust.yml, since both compile the same workspace
        # (everything except wildflower-tauri) — without it the two jobs warm
        # separate caches from cold despite identical inputs. See lint-rust.yml
        # for the matching entry.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rust-workspace-excl-tauri
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run tests (nextest)
        # --no-tests=warn keeps the run green while these crates have no tests
        # yet (nextest 0.9.85+ fails on zero tests by default). Switch to
        # --no-tests=fail once Rust tests exist to guard against an empty run.
        # wildflower-tauri and browser-sniffer-tauri-rust are excluded — both
        # pull in `tauri = "2"` and need GTK/webkit system libraries. See
        # lint-rust.yml for the GTK-enabled `tauri` job that covers them.
        run: cargo nextest run --workspace --exclude wildflower-tauri --exclude browser-sniffer-tauri-rust --all-features --no-tests=warn
      - name: Run doctests
        # nextest does not execute doctests, so cover them with cargo test.
        run: cargo test --doc --workspace --exclude wildflower-tauri --exclude browser-sniffer-tauri-rust --all-features

  # Always-runs summary job — the check to require in branch protection.
  # Left without a `name:` so its required-check context stays the stable
  # `rust-test` (the existing branch-protection rule), matching the convention
  # the TS workflows use for their `check`/`test` summaries.
  rust-test:
    needs: [changes, nextest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify test results
        run: |
          changes='${{ needs.changes.result }}'
          nextest='${{ needs.nextest.result }}'
          echo "changes=$changes nextest=$nextest"
          if [[ "$changes" != 'success' && "$changes" != 'skipped' ]]; then
            echo '::error::changes job did not succeed'; exit 1
          fi
          if [[ "$nextest" == 'failure' || "$nextest" == 'cancelled' ]]; then
            echo '::error::rust test job failed'; exit 1
          fi
          echo 'rust-test OK'
