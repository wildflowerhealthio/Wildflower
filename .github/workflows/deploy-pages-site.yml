name: Deploy Pages site

# Builds one site and publishes it to its GitHub Pages branch, through the
# deploy-pages-sites action. deploy-github-pages.yml calls it once per hosted
# app, as a matrix over `scripts/ci/pages-sites.ts plan production`, to
# publish each at the root of `gh-pages` of `wildflowerhealthio/<slug>-web`;
# each app's deploy is a job of its own, so the apps build side by side.
# pr-preview.yml runs the same action for the sites a PR affects in two jobs
# instead, each a group of them.
#
# The branch carries production and every open PR's preview side by side, so
# scripts/ci/publish-pages-branch.sh rewrites only its own part of it: a
# production publish keeps every `pr-<n>/`, and a preview touches only its own
# directory. Its push holds a lease on the tip it read and retries when
# another deploy moved the branch first.
on:
  workflow_call:
    inputs:
      site:
        description: The site, as one JSON `scripts/ci/pages-sites.ts plan …` site.
        type: string
        required: true
      target:
        description: '`production`, or the PR number whose preview this is.'
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ fromJSON(inputs.site).name }}
    runs-on: ubuntu-latest
    # One publish at a time per Pages branch and target: the newest
    # production deploy is the one to keep. A group per repository alone
    # would let a queued production deploy and a queued preview replace each
    # other (GitHub keeps one pending run per group), so deploys to different
    # parts of the branch run side by side and rely on the publish script's
    # lease instead.
    concurrency:
      group: pages-${{ fromJSON(inputs.site).pagesRepository }}-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      # persist-credentials:false is load-bearing. The default persists
      # GITHUB_TOKEN as an extraheader on github.com, which git then sends on
      # every HTTPS request from the workspace — including the push to the
      # Pages repository — and GitHub honors it over the App token in the
      # push URL. GITHUB_TOKEN has no access to the Pages repositories, so the
      # push would come back `Repository not found`. Nothing here pushes to
      # this repository.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-save: false

      # Restore only: the shared packages the sites build replay main's
      # last pack, which ts-cache-warm.yml saves, because each site's Sentry
      # variables are set only for the site's own build. See
      # docs/TypeScript/CI Build Cache Explanation.md.
      - name: Cache vp pack outputs
        uses: ./.github/actions/vp-pack-cache
        with:
          save: 'false'

      - name: Install dependencies
        run: vp install

      - name: Deploy ${{ fromJSON(inputs.site).name }}
        uses: ./.github/actions/deploy-pages-sites
        with:
          sites: ${{ format('[{0}]', inputs.site) }}
          target: ${{ inputs.target }}
          variables: ${{ toJSON(vars) }}
          app-id: ${{ secrets.STAGING_APP_ID }}
          app-private-key: ${{ secrets.STAGING_APP_PRIVATE_KEY }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
