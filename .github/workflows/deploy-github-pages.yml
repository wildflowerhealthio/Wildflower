name: Deploy GitHub Pages

# Publishes the production sites. Every hosted app is published on an origin
# of its own (`https://<slug>.wildflowerhealth.io/`, `APP_SLUGS` in
# slices/branding/branding-core/src/site.ts), so no app can read another's
# localStorage: deploy-pages-site.yml builds each app on its own and pushes it
# to the root of the `gh-pages` branch of its repository,
# `wildflowerhealthio/<slug>-web`, keeping the PR previews beside it. Then the
# marketing site is deployed to the apex, `https://wildflowerhealth.io`,
# through this repository's Pages; its build carries a redirect page at each
# app's old apex path, so those only ever redirect to an app that is already
# live.
#
# The code index (/code-index/ on the apex) is built here too, on main
# only: indexing needs the whole Rust toolchain, so PR previews leave it out.
# So is the book (/book/), which the marketing site's PR previews carry too.
#
# Runs on every push to main and on manual dispatch, and deploys every app
# each time: the apps depend on much of the workspace, so a path filter would
# only ever be wrong about which changes can alter a published site.
#
# Prerequisites (one-time):
#   - This repository's Settings → Pages: source "GitHub Actions", custom
#     domain wildflowerhealth.io. The CNAME file in
#     apps/wildflower-site/marketing-site-web/public carries that domain into
#     the marketing build, whose root is the root of the apex site — the only
#     place GitHub Pages reads it from — so the setting survives each deploy.
#   - Each app's repository, `wildflowerhealthio/<slug>-web`, publishes Pages
#     from its `gh-pages` branch at `/`, with the custom domain
#     `<slug>.wildflowerhealth.io` and HTTPS enforced. Its `main` holds only a
#     README; the deploy writes the `CNAME`, `.nojekyll` and `404.html` Pages
#     reads from the branch root.
#   - The GitHub App behind the `STAGING_APP_ID` / `STAGING_APP_PRIVATE_KEY`
#     secrets is installed on every app repository with
#     `Contents: Read and write`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time: let an in-flight deploy finish instead of
# cancelling it, so a half-published set of sites never stays live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the sites
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.plan.outputs.sites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-save: false

      - name: Install dependencies
        run: vp install

      # Assigned first, then written: a failure inside `echo "...$(...)"` would
      # not fail the step.
      - name: Plan every app
        id: plan
        run: |
          sites=$(node scripts/ci/pages-sites.ts plan production)
          echo "sites=$sites" >> "$GITHUB_OUTPUT"

  apps:
    name: App
    needs: plan
    strategy:
      # Every app publishes, so one failing build doesn't hold the others back
      # (or the apex, which deploys after them regardless).
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    uses: ./.github/workflows/deploy-pages-site.yml
    with:
      slug: ${{ matrix.site.name }}
      package: ${{ matrix.site.packageName }}
      build-dir: ${{ matrix.site.buildDir }}
      sentry-dsn-variable: ${{ matrix.site.sentryDsnVariable }}
      pages-repository: ${{ matrix.site.pagesRepository }}
      pages-branch: ${{ matrix.site.pagesBranch }}
      site-url: ${{ matrix.site.siteUrl }}
      target: production
    secrets: inherit

  # The code index, published under the apex at /code-index/
  # (apps/wildflower-site/code-index-web/README.md): rust-analyzer indexes the
  # Rust workspace, the TypeScript checker the TS packages, and the pages are
  # built from that. It runs beside the apps and hands its pages to the
  # marketing job as an artifact; when it fails, the apex still deploys,
  # without a fresh index.
  code-index:
    name: Build the code index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rust-analyzer builds the workspace's build scripts and proc macros,
      # so the Tauri crates need their system libraries and the embedded
      # bundles their placeholders, as in ci-rust.yml.
      - name: Install Tauri system dependencies
        uses: ./.github/actions/setup-tauri-linux-deps

      - name: Stub the embedded web bundles
        run: ./scripts/ci/stub-embedded-bundles.sh all

      # Restores the warm `main` build cache, never saves: rust-cache-warm.yml
      # owns that entry.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rust-analyzer
          cache-shared-key: workspace-linux-dev
          cache-save-if: 'false'

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-save: false

      - name: Install dependencies
        run: vp install

      - name: Index the Rust workspace
        run: rust-analyzer scip . --output "$RUNNER_TEMP/rust.scip"

      - name: Extract every package
        working-directory: apps/wildflower-site/code-index-web
        run: >-
          vp run extract --all
          --repo-root "$GITHUB_WORKSPACE"
          --rust-scip "$RUNNER_TEMP/rust.scip"
          --out "$RUNNER_TEMP/code-index-data"

      - name: Build the pages
        working-directory: apps/wildflower-site/code-index-web
        run: vp run build-pages --data "$RUNNER_TEMP/code-index-data" --out "$RUNNER_TEMP/code-index"

      - name: Upload the pages
        uses: actions/upload-artifact@v7
        with:
          name: code-index
          path: ${{ runner.temp }}/code-index
          retention-days: 1

  # The book, published under the apex at /book/
  # (apps/wildflower-site/book-web/README.md): mdbook, with the chapters'
  # `{{#code}}` excerpts read from this checkout. Like the code index, it hands
  # its pages to the marketing job as an artifact; when it fails, the apex
  # still deploys, without the book.
  book:
    name: Build the book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-save: false

      - name: Install dependencies
        run: vp install

      - name: Install mdbook
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: mdbook@0.5.4

      - name: Build the book
        working-directory: apps/wildflower-site/book-web
        run: vp run build-book --out "$RUNNER_TEMP/book"

      - name: Upload the book
        uses: actions/upload-artifact@v7
        with:
          name: book
          path: ${{ runner.temp }}/book
          retention-days: 1

  # After every app, whether or not each one published: the apex deploys
  # even when an app's build fails, so a broken app never holds back the
  # homepage or the policy pages.
  marketing:
    name: Build the marketing site
    needs: [apps, code-index, book]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # configure-pages reads this repository's Pages settings.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-save: false

      - name: Install dependencies
        run: vp install

      # The homepage, the policy pages and the apps' old-path redirect pages,
      # with its workspace dependencies built first.
      - name: Build the marketing site
        run: vp run --filter '@wildflowerhealthio/marketing-site-web...' build

      - name: Check the build holds its required files
        run: node scripts/ci/pages-sites.ts check marketing

      - name: Add the code index
        if: ${{ needs.code-index.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: code-index
          path: apps/wildflower-site/marketing-site-web/dist/code-index

      - name: Add the book
        if: ${{ needs.book.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: book
          path: apps/wildflower-site/marketing-site-web/dist/book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/wildflower-site/marketing-site-web/dist

  deploy:
    name: Deploy the apex
    needs: marketing
    if: ${{ !cancelled() && needs.marketing.result == 'success' }}
    runs-on: ubuntu-latest
    # Only the job that publishes needs pages + id-token, to deploy through
    # the GitHub Pages deployment API.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
