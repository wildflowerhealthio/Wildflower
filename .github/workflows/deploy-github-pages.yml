name: Deploy GitHub Pages

# Builds the published static site (apps/github-pages, which assembles the
# marketing site at /, the medications app at /medications-app, the server-docs
# API console at /wildflower-server-docs, the Web Trace app at /web-trace-app, the
# Importer at /importer-app, FHIR Sync for Pebble at /fhir-sync-pebble, the
# WatchLifts settings page at /watch-lifts, the prebuilt OHIF viewer at
# /ohif-viewer and the owner UI at /app)
# and publishes it to GitHub Pages.
# Runs on every push to main and on manual dispatch: the assembled apps
# depend on much of the workspace, so a path filter would only ever be wrong
# about which changes can alter the published site.
#
# Prerequisites (one-time, in repo Settings → Pages):
#   - Source: "GitHub Actions".
#   - Custom domain: wildflowerhealth.io. The CNAME file in
#     apps/marketing-website/public carries that domain into the marketing build,
#     which the assembly step copies to the root of the uploaded artifact — the
#     only place GitHub Pages reads it from — so the setting survives each deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the build; the deploy job needs pages + id-token to
# publish via the GitHub Pages deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

# One live site: let an in-flight deploy finish instead of cancelling it, so a
# half-published artifact never goes live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      # The workspace build: `vp run pack` is `vp run --cache -r build`, which
      # runs in workspace dependency order, so each assembled section (marketing
      # site, medications app, server-docs console) builds before github-pages
      # (it depends on them) runs its own build — the assemble step that stages
      # the sections, including the CNAME, into apps/github-pages/dist.
      #
      # Each app reads only its own `VITE_SENTRY_DSN_<APP>` (a public
      # identifier, so a repository variable rather than a secret) and
      # reports nothing without one. The shared `VITE_SENTRY_DSN` is left
      # unset: it is what the Tauri entry's unconsented init reads.
      - name: Build site
        run: vp run pack
        env:
          VITE_SENTRY_DSN_MEDICATIONS_APP: ${{ vars.VITE_SENTRY_DSN_MEDICATIONS_APP }}
          VITE_SENTRY_DSN_IMPORTER_WEB: ${{ vars.VITE_SENTRY_DSN_IMPORTER_WEB }}
          VITE_SENTRY_DSN_WEB_TRACE: ${{ vars.VITE_SENTRY_DSN_WEB_TRACE }}
          VITE_SENTRY_DSN_HEALTH_VIEWER: ${{ vars.VITE_SENTRY_DSN_HEALTH_VIEWER }}
          VITE_SENTRY_DSN_FHIR_SYNC_PEBBLE_WEB: ${{ vars.VITE_SENTRY_DSN_FHIR_SYNC_PEBBLE_WEB }}
          VITE_SENTRY_DSN_WILDFLOWER_REACT: ${{ vars.VITE_SENTRY_DSN_WILDFLOWER_REACT }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/github-pages/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
