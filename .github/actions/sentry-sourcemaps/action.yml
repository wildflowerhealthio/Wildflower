name: Upload Sentry source maps
description: >-
  Creates the Sentry release an app's build reports under and uploads the
  build's source maps to the app's Sentry project. The maps stay in the build
  and are published with it. Runs in deploy-pages-site.yml between the app's
  build and the push that publishes it.

inputs:
  environment:
    description: The `VITE_SENTRY_ENVIRONMENT` the site was built with.
    required: true
  release:
    description: The `VITE_SENTRY_RELEASE` the site was built with.
    required: true
  auth-token:
    description: >-
      A Sentry organization auth token (its fixed `org:ci` scope covers
      releases and source maps). Empty skips the upload, so a repository
      without Sentry configured still deploys; the maps are deleted either way.
    required: false
    default: ''
  org:
    description: The Sentry organization slug.
    required: false
    default: ''
  dsn:
    description: >-
      The app's `VITE_SENTRY_DSN_<APP>` value. It ends in its Sentry project's
      ID, which names the project to upload to; empty skips the upload.
    required: false
    default: ''
  site-dir:
    description: The app's build output, repo-root-relative.
    required: true

runs:
  using: composite
  steps:
    # A DSN's path is its project's numeric ID, which sentry-cli takes in place
    # of a slug, so the project comes from the same variable the build reads
    # and an app whose project does not exist yet simply has no DSN.
    - name: Collect the Sentry project ID from the DSN
      id: project
      shell: bash
      env:
        DSN: ${{ inputs.dsn }}
      run: |
        id=${DSN##*/}
        echo "Sentry project: ${id:-none}"
        echo "id=$id" >> "$GITHUB_OUTPUT"

    # Uploads from the build that is about to be published: injecting debug
    # IDs rewrites the JavaScript, so the files that get published must be the
    # ones that carry them. Debug IDs also make the files' URLs irrelevant, so
    # no `url_prefix` is needed, and one upload serves the app's production
    # origin and its previews alike.
    - name: Create Sentry release and upload source maps
      if: inputs.auth-token != '' && steps.project.outputs.id != ''
      uses: getsentry/action-release@v3.7.1
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.auth-token }}
        SENTRY_ORG: ${{ inputs.org }}
      with:
        environment: ${{ inputs.environment }}
        release: ${{ inputs.release }}
        sourcemaps: ${{ inputs.site-dir }}
        projects: ${{ steps.project.outputs.id }}
        # Sentry's GitHub integration is not installed and the checkout is
        # shallow, so there are no commits to associate.
        set_commits: skip
        disable_telemetry: true
