name: Build the host app's Android App Bundle
description: >-
  Builds the host app's release .aab for aarch64 and armv7 and fails unless it
  carries the native symbol table Play symbolicates crashes with. Shared by the
  release, which signs and ships the bundle, and ci-android.yml, which builds it
  unsigned on main and on pull requests that change how the bundle is
  packaged. Expects a checkout and JDK 17;
  the bundle is signed when the caller has written
  src-tauri/gen/android/keystore.properties first. Linux runners only.

inputs:
  cache-save-if:
    description: >-
      Whether this run saves the `release-android` Rust cache. See
      docs/Rust/CI Build Cache Explanation.md for which runs should.
    default: 'false'

outputs:
  bundle:
    description: The built .aab.
    value: ${{ steps.bundle.outputs.path }}
  mapping:
    description: R8's mapping.txt for the bundle, or empty when R8 left none.
    value: ${{ steps.bundle.outputs.mapping }}

runs:
  using: composite
  steps:
    # The pinned NDK, NDK_HOME and the per-target llvm-ranlib; why each:
    # the action's own comments.
    - name: Install Android NDK
      uses: ./.github/actions/setup-android-ndk

    - name: Set up Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        # The two ABIs every phone Play serves runs; the x86 ones are for
        # emulators.
        target: aarch64-linux-android,armv7-linux-androideabi
        rustflags: '-D warnings'
        # Its own key: release profile and Android targets, disjoint from
        # every other job's — see docs/Rust/CI Build Cache Explanation.md.
        cache-shared-key: release-android
        cache-on-failure: true
        cache-save-if: ${{ inputs.cache-save-if }}

    # Its managed `pnpm` is also what the Gradle project's Rust build task
    # calls back into the Tauri CLI with.
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.22.0
      with:
        cache: true

    - name: Install workspace dependencies
      shell: bash
      run: vp install

    - name: Build workspace (vp run pack)
      shell: bash
      run: vp run pack

    # Gradle drops the bundle's native symbol table without failing or
    # saying why, so report the tasks it comes from: whether each was
    # scheduled, how it ended (skipped and why, no source, ran) and the
    # files it read and wrote. Gradle applies every init script under
    # init.d to every build; this one prints nothing for other tasks.
    - name: Report Gradle's native library tasks
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.gradle/init.d
        cat > ~/.gradle/init.d/native-symbols-report.gradle <<'GROOVY'
        def isNativeTask = { task -> task.name =~ /(?i)native|symbol|jnilib/ }
        def report = { line -> println "[native-symbols] $line" }
        // The NDK the plugin resolved for the app, whose llvm-strip and
        // llvm-objcopy the strip and symbol table tasks run.
        gradle.projectsEvaluated {
          def android = gradle.rootProject.findProject(':app')?.extensions?.findByName('android')
          if (android == null) return
          report "app ndkPath=${android.ndkPath} ndkVersion=${android.ndkVersion}"
          try {
            report "app ndkDirectory=${android.ndkDirectory}"
          } catch (e) {
            report "app ndkDirectory unresolved: ${e.message}"
          }
        }
        gradle.taskGraph.whenReady { graph ->
          graph.allTasks.findAll(isNativeTask).each { report "scheduled ${it.path}" }
        }
        gradle.taskGraph.afterTask { task, state ->
          if (!isNativeTask(task)) return
          def outcome = state.failure ? "FAILED: ${state.failure.message}"
            : state.skipped ? "SKIPPED: ${state.skipMessage}"
            : state.noSource ? "NO-SOURCE"
            : state.upToDate ? "UP-TO-DATE"
            : "EXECUTED"
          report "${task.path} $outcome"
          task.inputs.files.files.take(20).each { report "  in  $it" }
          task.outputs.files.files.take(20).each { report "  out $it" }
        }
        GROOVY

    - name: Build Android App Bundle
      shell: bash
      working-directory: apps/host/host-app
      # One bundle for both ABIs, not one per ABI: Play splits it per device.
      run: vp run tauri android build --aab --target aarch64 armv7

    - name: Locate bundle
      id: bundle
      # Gradle names the bundle and R8's mapping file after the build
      # variant, so find them rather than spelling it.
      shell: bash
      run: |
        set -euo pipefail
        OUTPUTS=apps/host/host-app/src-tauri/gen/android/app/build/outputs
        shopt -s nullglob
        bundles=("$OUTPUTS"/bundle/*Release/*.aab)
        if [[ ${#bundles[@]} -ne 1 ]]; then
          echo "::error::Expected exactly one .aab under $OUTPUTS/bundle, found ${#bundles[@]}. Contents:"
          ls -laR "$OUTPUTS/bundle" 2>&1 || echo "  (directory does not exist)"
          exit 1
        fi
        # The native symbol table the release build type asks for, which
        # Play symbolicates native crashes and ANRs with. Gradle leaves it
        # out without failing, as when it cannot find the NDK. grep reads to
        # the end, unlike -q, so unzip takes no SIGPIPE under pipefail.
        if ! unzip -l "${bundles[0]}" | grep 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/' > /dev/null; then
          echo "::error::${bundles[0]} has no BUNDLE-METADATA/com.android.tools.build.debugsymbols/ entry, so it carries no native symbol table. The [native-symbols] lines in the build step's log show the Gradle tasks it comes from."
          # What went in: the bundle's metadata and libraries, then the
          # libraries Gradle packed and the symbol tables each still has.
          echo "Bundle metadata and native libraries:"
          unzip -l "${bundles[0]}" | grep -E 'BUNDLE-METADATA/|\.so$' || echo "  (none)"
          JNILIBS=apps/host/host-app/src-tauri/gen/android/app/src/main/jniLibs
          INTERMEDIATES=apps/host/host-app/src-tauri/gen/android/app/build/intermediates
          for lib in "$JNILIBS"/*/*.so; do
            echo "$lib:"
            ls -lL "$lib" || true
            readelf -S -W "$lib" | grep -E '\.symtab|\.debug_' || echo "  (no .symtab or .debug_* sections)"
          done
          echo "The NDK's strip and objcopy tools, under NDK_HOME=$NDK_HOME:"
          ls -l "$NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-{strip,objcopy} || true
          echo "Gradle's native intermediates:"
          find -L "$INTERMEDIATES" -maxdepth 1 -iname '*native*' -exec find -L {} -type f \; || echo "  (none)"
          exit 1
        fi
        echo "path=${bundles[0]}" >> "$GITHUB_OUTPUT"
        # Present when R8 minified the release, which build.gradle.kts asks
        # for; Play uses it to deobfuscate crash reports.
        mappings=("$OUTPUTS"/mapping/*Release/mapping.txt)
        echo "mapping=${mappings[0]:-}" >> "$GITHUB_OUTPUT"
