name: Install the Tauri Linux system libraries
description: >-
  Installs the GTK/webkit development packages the Tauri crates link against.
  The .deb files the install downloads are cached under a key that names the
  runner image, so a hit installs them with no mirror traffic at all. Linux
  runners only. Key, paths and why: docs/Rust/CI Build Cache Explanation.md.

outputs:
  cache-hit:
    description: Whether the packages came from the cache rather than the Ubuntu mirror.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The package list lives only here, so every workflow that builds a Tauri
    # crate installs the same set, and the key changes whenever the list does.
    # The runner image is in the key because a cached .deb fits only the
    # package versions that image already has installed.
    - name: Resolve the package list and cache key
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" != Linux ]]; then
          echo "::error::setup-tauri-linux-deps supports Linux runners only, not $RUNNER_OS"
          exit 1
        fi
        packages='libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev'
        packages_hash="$(printf '%s' "$packages" | sha256sum | cut -c1-16)"
        {
          echo "packages=$packages"
          echo "archives=$HOME/.tauri-apt/archives"
          echo "key=tauri-apt-${ImageOS:-unknown}-${ImageVersion:-unknown}-$RUNNER_ARCH-$packages_hash"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the Tauri system packages
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.paths.outputs.archives }}
        key: ${{ steps.paths.outputs.key }}

    # A hit holds every .deb the cold install downloaded, so installing those
    # files is the whole install; --no-download fails loudly rather than
    # falling back to the mirror if one is somehow missing. An empty entry
    # means the image already had every package. apt fetches a local .deb
    # whose version the image's package index also names from that index
    # instead, looking for it in the archives directory, so that directory
    # is pointed at the cache too.
    - name: Install from the cache
      if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      env:
        ARCHIVES: ${{ steps.paths.outputs.archives }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        debs=("$ARCHIVES"/*.deb)
        if (( ${#debs[@]} )); then
          mkdir -p "$ARCHIVES/partial"
          sudo apt-get install -y --no-download \
            -o Dir::Cache::Archives="$ARCHIVES" \
            "${debs[@]}"
        fi

    # Downloads into the cached directory instead of /var/cache/apt/archives,
    # which keeps exactly the packages this image lacks. The short timeout and
    # retries cut a stalled mirror download off instead of waiting on it.
    - name: Install from the Ubuntu mirror
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        ARCHIVES: ${{ steps.paths.outputs.archives }}
        PACKAGES: ${{ steps.paths.outputs.packages }}
      run: |
        set -euo pipefail
        mkdir -p "$ARCHIVES/partial"
        apt_opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30)
        sudo apt-get "${apt_opts[@]}" update
        # shellcheck disable=SC2086 # PACKAGES is a space-separated list
        sudo apt-get "${apt_opts[@]}" install -y \
          -o Dir::Cache::Archives="$ARCHIVES" \
          -o APT::Keep-Downloaded-Packages=true \
          $PACKAGES
        # apt leaves a root-only lock file the cache can't read.
        sudo rm -rf "$ARCHIVES/lock" "$ARCHIVES/partial"

    # Saved here rather than at job end, so a later failing step (such as the
    # compile) doesn't throw the download away.
    - name: Save the Tauri system packages
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.paths.outputs.archives }}
        key: ${{ steps.paths.outputs.key }}
