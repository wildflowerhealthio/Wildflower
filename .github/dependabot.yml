# Dependabot keeps dependencies and pinned action versions current, so security
# patches land promptly and the tag pins in our workflows don't drift stale.
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Rust crates across the Cargo workspace.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bundle routine version bumps into one PR to cut review noise.
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # JS/TS dependencies across the pnpm workspace, including the catalog in
  # pnpm-workspace.yaml. Dependabot's `npm` ecosystem handles pnpm + catalogs
  # (GA Feb 2025); a single root entry covers every workspace package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Bare `typescript` stays on 5.x: the `typescript` 7 npm package is the Go
      # port with no JS compiler API, which typescript-eslint, the editor's
      # tsserver and the ES5 lowering in fhir-sync-pebble-watchapp/pkjs need. The
      # catalog's `typescript-7` alias takes minor and patch updates. See
      # docs/TypeScript/Versions Reference.md.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      js-minor-patch:
        update-types:
          - minor
          - patch

  # The versions of the GitHub Actions used by every workflow in .github/, and
  # by the local composite actions under .github/actions/ — `directory: /` alone
  # scans only .github/workflows.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
