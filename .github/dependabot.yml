# Dependabot keeps dependencies and pinned action versions current, so security
# patches land promptly and the tag pins in our workflows don't drift stale.
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Rust crates across the Cargo workspace.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bundle routine version bumps into one PR to cut review noise.
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # JS/TS dependencies across the pnpm workspace, including the catalog in
  # pnpm-workspace.yaml. Dependabot's `npm` ecosystem handles pnpm + catalogs
  # (GA Feb 2025); a single root entry covers every workspace package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Bare `typescript` stays on 5.x: the `typescript` 7 npm package is the Go
      # port with no JS compiler API, which typescript-eslint, the editor's
      # tsserver and the ES5 lowering in fhir-sync-pebble-watchapp/pkjs need. The
      # catalog's `typescript-7` alias takes minor and patch updates. See
      # docs/TypeScript/Versions Reference.md.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Effect 4 is a rewrite: `@effect/platform` folds into `effect`, and
      # `@effect/opentelemetry` jumps from 0.x to 4.x alongside it. Every package
      # is built on Effect 3, so the move is a migration, not a bump.
      - dependency-name: effect
        update-types:
          - version-update:semver-major
      - dependency-name: '@effect/*'
        update-types:
          - version-update:semver-major
      # Sentry 11 removed `SentrySampler`, `SentrySpanProcessor` and
      # `setupEventContextTrace`, which telemetry-core/-node/-web are built on.
      - dependency-name: '@sentry/*'
        update-types:
          - version-update:semver-major
      # Tauri requires each npm package and its crate to share major.minor. The
      # 2.12 crates reach `cargo_toml` 1.0, which needs `serde` >= 1.0.228, and
      # helios (apps/host/wildflower-server/fhir-r4-rust) pins `=1.0.224`. The
      # npm side stays on the crates' minors until helios moves.
      - dependency-name: '@tauri-apps/*'
        update-types:
          - version-update:semver-minor
    groups:
      js-minor-patch:
        update-types:
          - minor
          - patch

  # The versions of the GitHub Actions used by every workflow in .github/, and
  # by the local composite actions under .github/actions/ — `directory: /` alone
  # scans only .github/workflows.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
