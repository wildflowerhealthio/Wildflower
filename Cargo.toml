[workspace]
resolver = "2"
members = [
  "apps/relay/server",
  "apps/wildflower-tauri/src-tauri",
  "global/tauri-unit-runner",
  "plugins/tauri-plugin-native-webview",
  "slices/apps/apps-rust",
  "slices/background-server-service/background-server-service-rust",
  "slices/background-server-service/background-server-service-tauri-rust",
  "slices/browser-sniffer/browser-sniffer-tauri-rust",
  "slices/collector/collector-rust",
  "slices/databases/databases-rust",
  "slices/dicom/ohif-server-rust",
  "slices/emr/emr-rust",
  "slices/gatekeeper/gatekeeper-rust",
  "slices/gatekeeper/token-revocation-rust",
  "slices/har-recorder/har-recorder-rust",
  "slices/har-recorder/har-recorder-tauri-rust",
  "slices/persistence/persistence-rust",
  "slices/request-log/request-log-rust",
  "slices/scopes/scope-capabilities-rust",
  "slices/scopes/scopes-rust",
  "slices/servers/servers-rust",
  "slices/servers/servers-tauri-rust",
  "slices/shared-structures/shared-structures-rust",
  "slices/shared-structures/shared-structures-tauri-rust",
  "slices/tunnel/rathole-settings-rust",
  "slices/tunnel/tunnel-rust",
  "slices/wildflower-server/wildflower-server-rust",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1.0.102"
axum = { version = "0.8", features = ["json", "query", "matched-path", "ws"] }
base64 = "0.23"
# SQLite ORM/query-builder for the collector slice's own connection onto the
# shared database. Its `sqlite` feature pulls `libsqlite3-sys`; diesel accepts
# `libsqlite3-sys 0.31`, so Cargo unifies it with rusqlite's
# already-`bundled` `libsqlite3-sys 0.31` — exactly one bundled SQLite in the
# build, driven by both connections. The 2.3 line adds three wasm32-gated crates
# (`sqlite-wasm-rs`, `rsqlite-vfs`, `downcast-rs`) that never compile for our
# native targets; that cost is accepted to clear the RUSTSEC advisories filed
# against 2.2.x (RUSTSEC-2026-0111/-0134/-0135/-0136/-0137/-0172).
# `returning_clauses_for_sqlite_3_35` unlocks `RETURNING` on SQLite statements
# (atomic write-and-read-back, no explicit transaction); the bundled SQLite
# from `libsqlite3-sys 0.31` is 3.47.x, well past the 3.35 floor.
# `r2d2` enables diesel's `ConnectionManager`/`Pool`, reusing the `r2d2 0.8`
# already in the tree via `helios-persistence` (its `r2d2_sqlite` pools rusqlite
# the same way for the FHIR store) — no new external crate for cargo-deny.
diesel = { version = "~2.3.11", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2"] }
# Compile-time-embedded diesel migrations for that connection (records applied
# versions in diesel's own `__diesel_schema_migrations`, disjoint from
# persistence-rust's namespaced `schema_migrations`).
diesel_migrations = "~2.3"
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
# Timestamp stamping (`Utc::now()`); `default-features = false` keeps it lean,
# consumers add the features they need (e.g. collector's `clock`).
chrono = { version = "0.4", default-features = false }
tower-http = { version = "0.7", features = ["cors"] }
# `tower`/`http-body-util` back the `-rust` slices' oneshot handler tests.
tower = { version = "0.5" }
http-body-util = "0.1"
# Code-first OpenAPI generation. `preserve_order` keeps schema properties in
# declaration order so the committed spec snapshot is stable across runs.
utoipa = { version = "6", features = ["preserve_order"] }
# axum integration: collects the OpenAPI spec from the real router so the spec
# can't drift from the routes (axum 0.8-compatible).
utoipa-axum = "0.3"

# Lints shared by every crate that opts in with `[lints] workspace = true`.
# Forbidding unsafe makes any `unsafe` block a compile error (not just a lint),
# across local builds and CI alike. The default clippy groups are enforced
# separately as hard errors by the rust-lint workflow's deny-warnings run.
[workspace.lints.rust]
unsafe_code = "forbid"

# Our fork of `tauri-plugin-background-service` 1.0.1 with two fixes: Android
# starts the foreground service with no native core (#886), and iOS stops a
# running service gracefully, with `PlatformExpiration`, before suspending the
# app in the background. Tracks the fixes' branch (fork PR #2, stacked on #1);
# `deny.toml` allows this git source.
[patch.crates-io]
tauri-plugin-background-service = { git = "https://github.com/wildflowerhealthio/tauri-background-service", branch = "fix/ios-background-grace-window" }
# Our fork of `rathole` (wildflower/handoff), pinned to a commit while its
# changes are reviewed upstream in wildflowerhealthio/rathole#1.
rathole = { git = "https://github.com/wildflowerhealthio/rathole", rev = "2c678fb0cdd8cae0276d53b3a860f925b2590bc0" }
