[workspace]
resolver = "2"
members = [
  "apps/wildflower-relay",
  "apps/wildflower-tauri/src-tauri",
  "plugins/tauri-plugin-native-webview",
  "slices/apps/apps-rust",
  "slices/apps/self-hosted-apps-rust",
  "slices/browser-sniffer/browser-sniffer-tauri-rust",
  "slices/collector/collector-rust",
  "slices/databases/databases-rust",
  "slices/emr/emr-rust",
  "slices/gatekeeper/gatekeeper-rust",
  "slices/gatekeeper/token-revocation-rust",
  "slices/persistence/persistence-rust",
  "slices/scopes/scopes-rust",
  "slices/shared-structures/shared-structures-rust",
  "slices/shared-structures/shared-structures-server-rust",
  "slices/shared-structures/shared-structures-tauri-rust",
  "slices/tunnel/tunnel-rust",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1.0.102"
axum = { version = "0.8", features = ["json", "query", "matched-path", "multipart", "ws"] }
# Request-time rendering of the committed self-hosted-app templates
# (`templates/<app-id>/…​.hbs` in self-hosted-apps-rust).
handlebars = "6"
# Compile-time embedding of that templates tree.
include_dir = "0.7"
# SQLite ORM/query-builder for the collector slice's own connection onto the
# shared database. Its `sqlite` feature pulls `libsqlite3-sys`; the resolved
# diesel (2.3.x) accepts `libsqlite3-sys 0.31`, so Cargo unifies it with
# rusqlite's already-`bundled` `libsqlite3-sys 0.31` — exactly one bundled
# SQLite in the build, driven by both connections.
diesel = { version = "2.2", features = ["sqlite"] }
# Compile-time-embedded diesel migrations for that connection (records applied
# versions in diesel's own `__diesel_schema_migrations`, disjoint from
# persistence-rust's namespaced `schema_migrations`).
diesel_migrations = "2.2"
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
tower-http = { version = "0.7", features = ["cors"] }
# Code-first OpenAPI generation. `preserve_order` keeps schema properties in
# declaration order so the committed spec snapshot is stable across runs.
utoipa = { version = "5", features = ["preserve_order"] }
# axum integration: collects the OpenAPI spec from the real router so the spec
# can't drift from the routes (axum 0.8-compatible).
utoipa-axum = "0.2"
# Interactive Scalar API reference. The host merges each documented slice's
# `openapi_spec()` into one document and serves it here at `/docs`. The `axum`
# feature (0.8-compatible) mounts it as a plain `Router`.
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Lints shared by every crate that opts in with `[lints] workspace = true`.
# Forbidding unsafe makes any `unsafe` block a compile error (not just a lint),
# across local builds and CI alike. The default clippy groups are enforced
# separately as hard errors by the rust-lint workflow's deny-warnings run.
[workspace.lints.rust]
unsafe_code = "forbid"
