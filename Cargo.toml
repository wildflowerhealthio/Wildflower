[workspace]
resolver = "2"
members = [
  "apps/wildflower-relay",
  "apps/wildflower-tauri/src-tauri",
  "slices/browser-sniffer/browser-sniffer-tauri-rust",
  "slices/emr/emr-rust",
  "slices/gatekeeper/gatekeeper-rust",
  "slices/persistence/persistence-rust",
  "slices/shared-structures/shared-structures-rust",
  "slices/shared-structures/shared-structures-tauri-rust",
  "slices/tunnel/tunnel-rust",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1.0.102"
axum = { version = "0.8", features = ["json", "query", "matched-path", "ws"] }
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
tower-http = { version = "0.6", features = ["cors"] }
# Code-first OpenAPI generation. `preserve_order` keeps schema properties in
# declaration order so the committed spec snapshot is stable across runs.
utoipa = { version = "5", features = ["preserve_order"] }
# axum integration: collects the OpenAPI spec from the real router so the spec
# can't drift from the routes (axum 0.8-compatible).
utoipa-axum = "0.2"

# Lints shared by every crate that opts in with `[lints] workspace = true`.
# Forbidding unsafe makes any `unsafe` block a compile error (not just a lint),
# across local builds and CI alike. The default clippy groups are enforced
# separately as hard errors by the rust-lint workflow's deny-warnings run.
[workspace.lints.rust]
unsafe_code = "forbid"
