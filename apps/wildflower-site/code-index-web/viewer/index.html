<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wildflower Code Index</title>
    <link rel="stylesheet" href="fonts/next/wght.css" />
    <link rel="stylesheet" href="fonts/mono/wght.css" />
    <style>
      /* The site pins the dark scheme; the index follows it. */
      :root {
        color-scheme: dark;
        --canvas: #161616;
        --surface: #1e1e1e;
        --raised: #262626;
        --line: #353535;
        --line-strong: #4a4a4a;
        --text: #ededed;
        --text-dim: #a8a8a8;
        --text-faint: #7a7a7a;
        --accent: #59a0f9;
        --rust: #f2994a;
        --ts: #59a0f9;
        --font-ui: 'Atkinson Hyperlegible Next Variable', ui-sans-serif, system-ui, sans-serif;
        --font-code:
          'Atkinson Hyperlegible Mono Variable', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font-family: var(--font-ui);
        font-size: 15px;
        line-height: 1.55;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      input,
      button {
        font: inherit;
        color: inherit;
      }
      .page {
        max-width: 1040px;
        margin: 0 auto;
        padding: 48px 24px 80px;
      }
      .eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-faint);
        margin: 0 0 8px;
      }
      h1 {
        font-size: 34px;
        line-height: 1.15;
        margin: 0 0 14px;
        text-wrap: balance;
      }
      .lede {
        color: var(--text-dim);
        max-width: 65ch;
        margin: 0 0 8px;
      }
      .stamp {
        font-size: 13px;
        color: var(--text-faint);
        margin: 0 0 32px;
      }
      .stamp code {
        font-family: var(--font-code);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        margin-bottom: 28px;
        position: sticky;
        top: 0;
        background: var(--canvas);
        padding-block: 10px;
        z-index: 1;
      }
      .controls input {
        flex: 1 1 260px;
        background: var(--raised);
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        padding: 8px 12px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        background: none;
        border: 0;
        padding: 7px 12px;
        cursor: pointer;
        color: var(--text-dim);
      }
      .seg button + button {
        border-left: 1px solid var(--line-strong);
      }
      .seg button[aria-pressed='true'] {
        background: var(--raised);
        color: var(--text);
      }
      .count {
        color: var(--text-faint);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      section + section {
        margin-top: 36px;
      }
      h2 {
        font-family: var(--font-code);
        font-size: 15px;
        font-weight: 600;
        color: var(--text-dim);
        margin: 0 0 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .pkg {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 20px;
        padding: 12px 8px;
        margin: 0 -8px;
        border-radius: 6px;
      }
      .pkg:hover {
        background: var(--surface);
      }
      .pkg__name {
        font-family: var(--font-code);
        font-weight: 600;
        word-break: break-word;
      }
      .pkg__lang {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-left: 8px;
        font-family: var(--font-ui);
        font-weight: 400;
      }
      .pkg__lang--rust {
        color: var(--rust);
      }
      .pkg__lang--typescript {
        color: var(--ts);
      }
      .pkg__stats {
        font-size: 13px;
        color: var(--text-faint);
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
      }
      .pkg__path {
        grid-column: 1 / -1;
        font-family: var(--font-code);
        font-size: 12px;
        color: var(--text-faint);
        word-break: break-all;
      }
      .pkg__desc {
        grid-column: 1 / -1;
        color: var(--text-dim);
        font-size: 14px;
        max-width: 75ch;
      }
      .pkg__desc code {
        font-family: var(--font-code);
        font-size: 0.92em;
        background: var(--raised);
        border-radius: 3px;
        padding: 0 3px;
      }
      .empty {
        color: var(--text-faint);
      }
      @media (max-width: 560px) {
        .page {
          padding: 32px 16px 64px;
        }
        h1 {
          font-size: 28px;
        }
        .pkg {
          grid-template-columns: 1fr;
        }
        .pkg__stats {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">wildflowerhealth.io</p>
      <h1>Wildflower code index</h1>
      <p class="lede">
        Every Rust crate and TypeScript package in the Wildflower workspace: its files and items
        with their doc comments, which item uses which, and the places those uses suggest could be
        simpler.
      </p>
      <p class="stamp" id="stamp"></p>
      <div class="controls">
        <input
          id="filter"
          placeholder="Filter by name, folder or description"
          autocomplete="off"
          aria-label="Filter packages"
        />
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-lang="" aria-pressed="true">All</button>
          <button type="button" data-lang="rust" aria-pressed="false">Rust</button>
          <button type="button" data-lang="typescript" aria-pressed="false">TypeScript</button>
        </div>
        <span class="count" id="count"></span>
      </div>
      <div id="groups"></div>
    </main>
    <script id="data" type="application/json">
      /*DATA*/
    </script>
    <script>
      ;(() => {
        const DATA = JSON.parse(document.getElementById('data').textContent)
        const $ = (id) => document.getElementById(id)
        const esc = (s) =>
          String(s).replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
          )
        const code = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>')
        const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`
        const firstSentence = (t) => (t || '').replace(/\s+/g, ' ').split(/(?<=[.!?])\s/)[0]
        const groupOf = (path) =>
          path
            .split('/')
            .slice(0, path.startsWith('apps/') || path.startsWith('slices/') ? 2 : 1)
            .join('/')
        let lang = ''

        $('stamp').innerHTML =
          `${DATA.packages.length} packages, indexed at <code>${esc(DATA.commit.slice(0, 9))}</code> on <code>main</code>.`

        const render = () => {
          const q = $('filter').value.trim().toLowerCase()
          const shown = DATA.packages.filter(
            (p) =>
              (!lang || p.language === lang) &&
              (!q || `${p.name} ${p.path} ${p.description}`.toLowerCase().includes(q))
          )
          $('count').textContent = `${shown.length} of ${DATA.packages.length}`
          const groups = new Map()
          for (const p of shown) {
            const g = groupOf(p.path)
            if (!groups.has(g)) groups.set(g, [])
            groups.get(g).push(p)
          }
          $('groups').innerHTML = shown.length
            ? [...groups]
                .sort(([a], [b]) => a.localeCompare(b))
                .map(
                  ([g, ps]) =>
                    `<section><h2>${esc(g)}/ <span class="count">${ps.length}</span></h2><ul class="list">${ps
                      .map(
                        (p) => `<li class="pkg">
                    <span><a class="pkg__name" href="${esc(p.slug)}/">${esc(p.name)}</a><span class="pkg__lang pkg__lang--${esc(p.language)}">${p.language === 'rust' ? 'Rust' : 'TypeScript'}</span></span>
                    <span class="pkg__stats">${plural(p.files, 'file')} · ${plural(p.items, 'item')}</span>
                    <span class="pkg__path">${esc(p.path)}</span>
                    ${p.description ? `<span class="pkg__desc">${code(firstSentence(p.description))}</span>` : ''}
                  </li>`
                      )
                      .join('')}</ul></section>`
                )
                .join('')
            : '<p class="empty">No package matches that filter.</p>'
        }
        $('filter').addEventListener('input', render)
        document.querySelectorAll('.seg button').forEach((b) =>
          b.addEventListener('click', () => {
            lang = b.dataset.lang
            document
              .querySelectorAll('.seg button')
              .forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
            render()
          })
        )
        render()
      })()
    </script>
  </body>
</html>
