[package]
name = "wildflower-relay"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# Two parts in one process: the `rathole` library in server mode, which owns
# the noise-encrypted tunnels to devices, and a small TCP front on :443/:80
# that routes visitors to those tunnels by the TLS ClientHello's server name.
# The relay never terminates TLS for the public `https://<tunnel name>.<domain>`
# surface: it holds no certificates or keys for it and forwards ciphertext.
# It terminates TLS only for its own hostname, with a certificate from
# rustls-acme, and serves a small axum site there.
# The `noise` transport is selected (and TLS/websocket default features
# dropped) so the tunnel side needs no system OpenSSL either.
[dependencies]
anyhow.workspace = true
# The router of the relay's own site.
axum.workspace = true
# Decodes the noise private key and encodes its public key for `GET /rathole`.
base64.workspace = true
# Derives the noise public key from the private key (X25519). Already in the
# tree through snow, rathole's noise implementation.
curve25519-dalek = "4.1"
# Polls the `AcmeState` stream (`StreamExt::next`).
futures-util = { version = "0.3", default-features = false }
# `hmac-sha256` HTTP message signatures (RFC 9421), with a constant-time
# MAC check. Already in the tree.
hmac = "0.12"
# Serves the site's router over each TLS connection; `axum::serve` only takes
# listeners, and the front hands over connections one at a time. Both are
# already in the tree through axum.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# PROXY protocol v2 header ahead of each replayed ClientHello, so the device
# sees the visitor's address instead of the relay's.
ppp = "2.3"
# `hot-reload`: rathole picks up a rewritten TOML (e.g. from enrolment)
# without a restart.
rathole = { version = "0.5", default-features = false, features = [
  "server",
  "noise",
  "hot-reload",
] }
# The wire shape of `GET /rathole`, shared with the device's rathole client.
rathole-settings-rust = { path = "../../slices/tunnel/rathole-settings-rust" }
# `rustls::server::Acceptor` reads the ClientHello's server name for routing.
# `ring` is the provider for the site's TLS, the same one rustls-acme uses;
# aws-lc-rs would need cmake to build.
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "ring",
] }
# The site's certificate for the relay's own hostname, ordered from Let's
# Encrypt over TLS-ALPN-01 and cached on disk. `ring` instead of the default
# aws-lc-rs (see `rustls`); `webpki-roots` so the ACME client trusts Let's
# Encrypt's API.
rustls-acme = { version = "0.15", default-features = false, features = [
  "ring",
  "webpki-roots",
] }
# The `GET /me` response body.
serde.workspace = true
# SHA-256 for `hmac-sha256` and for `sha-256` content digests (RFC 9530).
# Already in the tree.
sha2 = "0.10"
# Parses `Signature-Input`, `Signature` and `Content-Digest`, which are
# structured fields (RFC 9651), and serializes `@signature-params`.
sfv = "0.15"
# `GET /health` on the site.
shared-structures-rust = { path = "../../slices/shared-structures/shared-structures-rust", features = [
  "health-check",
] }
# TCP keepalive on piped sockets (tokio has no setter); already in the tree
# through tokio.
socket2 = "0.6"
# Renders the rathole TOML from the environment at startup.
toml = "0.9"
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "signal",
  "sync",
] }
# TLS for the site over tokio sockets. No default features: the provider is
# `rustls`'s `ring`.
tokio-rustls = { version = "0.26", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Opt into the workspace lints (notably `unsafe_code = "forbid"`). This crate
# carries no `unsafe`; rathole's transitive deps are unaffected by our lints.
[lints]
workspace = true

[dev-dependencies]
# A real rustls client produces the ClientHellos the tests feed the front.
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "ring",
  "tls12",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tempfile = "3"
# Drive the site's router in unit tests.
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
serde_json.workspace = true
# A self-signed certificate stands in for the ACME one in the site's tests.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
