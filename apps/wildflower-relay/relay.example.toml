# Example of the rathole TOML that wildflower-relay runs from.
#
# You do not write this file by hand. At startup the relay writes the
# `[server]` keys below from its environment and creates the file if it is
# missing (see `src/settings.rs` for every variable):
#
#   bind_addr          <- WILDFLOWER_RELAY_CONTROL_ADDR (default 0.0.0.0:2333)
#   local_private_key  <- WILDFLOWER_RELAY_NOISE_PRIVATE_KEY (`rathole --genkey`;
#                         the matching public key goes into each device's
#                         rathole client config as `remote_public_key`)
#
# There is no `default_token`; the relay removes one if present. The
# `[server.services.*]` tables are kept across restarts: enrolment adds one per
# device, with its own `token`, and both rathole and the relay's TLS front
# reload them on change. rathole rejects the whole file if any service lacks a
# token, so the relay refuses to start and a reload is ignored until it is
# fixed.
# The relay rewrites the file as a whole, so comments are not kept.

[server]
# Control-channel port the devices' rathole clients dial. Only the noise
# handshake and each service's token gate it.
bind_addr = "0.0.0.0:2333"

[server.transport]
type = "noise"

[server.transport.noise]
# The all-zero placeholder is valid base64 (32 bytes) so this example parses;
# it is not secret.
local_private_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

# One service per device. The table name is the device's label: visitors to
# `https://<label>.<WILDFLOWER_RELAY_DOMAIN>` are routed here by the TLS server
# name, still encrypted. `bind_addr` must be loopback and `type` tcp; rathole
# listens on it only while the device's tunnel is connected, and nothing but
# the relay's front connects to it.
[server.services.wildflower-device-1]
type = "tcp"
bind_addr = "127.0.0.1:5201"
# Per-device secret, written by enrolment; the device's rathole client presents
# it for this service.
token = "CHANGE_ME_per_device_secret"
