[package]
name = "servers-tauri"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# Tauri host glue for the servers: the install's servers on
# `TauriUnitRunner`, the notifications about them, and the base's commands over
# `servers-rust`, which holds every decision and its tests.
[dependencies]
# A server config builder's error, which fails the run it was building.
anyhow.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
# Posting the stop and request notifications.
tauri-plugin-notification = "2"
# Opening a server's launcher in a native web view of its own.
tauri-plugin-native-webview = { path = "../../tauri-plugin-native-webview" }
# The app's `TauriUnitRunner`, which the servers are pushed to as units.
tauri-unit-runner-rust = { path = "../../unit-runner/tauri-unit-runner-rust" }
# The registry, enrolment and the relay client adapter the commands drive;
# `ServerUnit`; and the notification decisions.
servers-rust = { path = "../servers-rust" }
# The config and host ports each server's run reads, and a stopped server's
# certificate state, read from its cache.
wildflower-server-rust = { path = "../../wildflower-server/wildflower-server-rust" }
# The gatekeeper's failure a consent or launch command that couldn't run
# answers with.
gatekeeper-rust = { path = "../../wildflower-server/gatekeeper-rust" }
# `ForwardedRequest`, which the servers report and the request notifications
# count.
shared-structures-rust = { path = "../../../../slices/shared-structures/shared-structures-rust" }
# `TunnelName`, which the commands parse the entered tunnel name into.
rathole-settings-rust = { path = "../../../../slices/rathole-settings-rust" }
# The relay base URL enrolment builds a relay client for.
url = "2"
# `join_all`, to read several servers' certificate caches at once. Already in
# the tree.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# The instant enrolment chooses a new server's run policy at.
chrono = { workspace = true, features = ["clock"] }
# `sync` for the lock ordering registry writes with their pushes, the
# forwarded-request channel and `TauriUnitRunner`'s statuses; `time` for the
# request-notification timer; `macros` for `select!`; `rt` for the commands'
# registry reads and writes on a blocking thread.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# Opt this crate into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1"
# A gatekeeper over a temporary database, whose consents the consent commands'
# tests decide.
persistence-rust = { path = "../../../../slices/persistence-rust" }
token-revocation-rust = { path = "../../wildflower-server/token-revocation-rust" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# The shutdown token the tests' units keep, to see whether a command stopped
# their run.
tokio-util = "0.7"
