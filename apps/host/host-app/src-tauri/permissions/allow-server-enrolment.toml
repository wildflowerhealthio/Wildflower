"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "allow-server-enrolment"
description = """
Grants the webview the right to invoke the app-defined `server_add` and
`server_set_credentials` commands (`servers-tauri`): enrolling a tunnel
at a relay into the install's `servers.json`, and replacing a registered
server's token. Both take the tunnel's token and never answer with it.

SECURITY: granted to the `main` webview only (capabilities/default.json),
which runs the base. A webview holding this grant can add servers to the
install and change their tokens, so it must never reach a capability that
matches a webview loading remote content.
"""
commands.allow = ["server_add", "server_set_credentials"]
