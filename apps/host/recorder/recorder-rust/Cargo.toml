[package]
name = "wildflowerhealthio-recorder"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# A bookmark's `lastRecordedAt`. No `clock`: the host's command passes the
# instant, so the store stays clock-free.
chrono = { workspace = true, features = ["serde"] }
# Held across each read-modify-write of `recorder-bookmarks.json`.
parking_lot = "0.12"
serde.workspace = true
serde_json.workspace = true
# `SaveError`'s and `BookmarkError`'s `Display`/`source` wiring — the message
# the host forwards on `HarSaveFailed`, or answers a bookmark command with, is
# that `Display`.
thiserror = "2"

# Opt this crate into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true

[dev-dependencies]
proptest = "1"
# The atomic-rename and refuse-to-clobber behaviour only exists against a real
# filesystem, so the `save_har` and `JsonBookmarks` tests drive one.
tempfile = "3"
