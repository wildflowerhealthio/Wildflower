[package]
name = "wildflowerhealthio-fhir-r4"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
# `$everything` re-drives HFS's own router in-process (a `read` + a compartment
# search) via `tower::ServiceExt::oneshot`, so scope enforcement stays in the
# path. Already in the tree transitively through axum; pinned here as a direct
# dep for the `util` feature (`oneshot`).
tower = { version = "0.5", features = ["util"] }
# The loopback origin flows in as a typed `Url` (from `ServerRuntimeConfig`); the
# discovery handler derives its bare origin string from it.
url = { version = "2" }
# `$everything` logs (and swallows) a related-resource search that fails so a
# partial-scope token still gets the resources it can read. Already in the tree
# via helios/tower; pinned here as a direct dep for the `warn!` macro.
tracing = "0.1"
# HFS (HeliosSoftware/hfs) crates, exact-pinned to one release. Move them all
# together — they depend on each other at `^` of the same version, and a
# Dependabot group can bump only some of them. wildflowerhealthio-fhir-r4 embeds:
#   helios-rest        — Axum router + handlers serving the FHIR REST surface
helios-rest = { version = "=0.2.4", default-features = false, features = ["R4", "sqlite"] }
#   helios-persistence — sqlite-backed storage backend
helios-persistence = { version = "=0.2.4", default-features = false, features = ["R4", "sqlite"] }
#   helios-auth        — JWT/JWKS bearer auth + SMART v2 scope policy, and the
#                        web UI's login sessions
helios-auth = "=0.2.4"
#   helios-fhir        — the FHIR version the web UI is mounted for
helios-fhir = "=0.2.4"
#   helios-ui          — the web UI, at `/ui`
helios-ui = "=0.2.4"
#   helios-audit       — audit sink trait (we use the null sink today)
helios-audit = { version = "=0.2.4", default-features = false, features = ["R4"] }
wildflowerhealthio-shared-structures = { path = "../../../../slices/shared-structures/shared-structures-rust" }
# Typed SMART scopes: the web UI's sign-in asks for `user/*.cruds`.
wildflowerhealthio-scopes = { path = "../../../../slices/scopes/scopes-rust" }
# `helios_auth::AuthProvider` is an `#[async_trait]`; implementing it needs the same
# attribute macro. Already resolved in the lockfile (via wildflowerhealthio-tunnel), so this
# direct dep pins no new version.
async-trait = "0.1"
# A verified token's expiry, as HFS's `Principal` carries it, is a
# `chrono::DateTime<Utc>`; already in the tree via helios, pinned here as a
# direct dep for the type reference.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Runs bulk `$export`'s worker and cleanup until the server shuts down.
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util = "0.7"

[dev-dependencies]
base64.workspace = true
http-body-util.workspace = true
wildflowerhealthio-ohif-server = { path = "../../../../slices/ohif-server-rust" }
wildflowerhealthio-scope-capabilities = { path = "../../../../slices/scopes/scope-capabilities-rust" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
# The export folder the bulk-export worker's tests write to.
tempfile = "3"

[lints]
workspace = true
