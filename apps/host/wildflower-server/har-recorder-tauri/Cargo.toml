[package]
name = "wildflowerhealthio-har-recorder-tauri"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde_json.workspace = true
wildflowerhealthio-shared-structures = { path = "../../../../slices/shared-structures/shared-structures-rust" }
# The wire mirror and the validated, atomic write — everything that can be
# wrong, under tests that run without a webview toolkit.
wildflowerhealthio-har-recorder = { path = "../har-recorder-rust" }

# Opt this crate into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true
