# Hand-authored permission (NOT autogenerated): a richly-described grant for the
# `show` command. Granted by `default.toml` in place of the stock `allow-show`.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "show"
description = """
Allow presenting the native webview — bringing a freshly-created or
previously-hidden instance to the foreground. Visibility only; navigation is the
separate `open_url` grant. Idempotent — succeeds as a no-op when nothing exists
to show.
"""
commands.allow = ["show"]
