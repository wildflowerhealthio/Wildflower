[package]
name = "tauri-plugin-native-webview"
version = "0.0.0"
description = "Present an external URL in a native, JS-injectable web view (iOS, Android, desktop)."
edition.workspace = true
publish.workspace = true
# Required for Tauri plugins that ship native (Swift/Kotlin) code: the value is a
# unique key Tauri's build tooling uses to associate the mobile sources with this
# crate. Must be unique across the dependency graph.
links = "tauri-plugin-native-webview"

[dependencies]
# - `unstable`: unlocks the multi-webview-per-window API (`Window::add_child`)
#   the desktop backend uses to lay a chrome bar above the content webview.
#   API may change between Tauri minor releases; revisit on each upgrade.
# - `webview-data-url`: lifts Tauri's default rejection of `data:` URLs in
#   `WebviewBuilder::new(label, WebviewUrl::External(url))`. The desktop
#   chrome webview's source is an inline `data:text/html;base64,…` document
#   (the bar's UI is too small to justify a bundled asset and `about:blank +
#   init_script` had document-state race issues). Without this flag the
#   chrome's `add_child` fails with `InvalidWebviewUrl` and the chrome bar
#   never appears — content shows on its own.
tauri = { version = "2", features = ["unstable", "webview-data-url"] }
serde = { workspace = true }
# Desktop backend decodes the chrome-action event payload (`{action:string}`)
# and assembles the chrome-state initial-push JSON. Tauri's event API takes
# a `Serialize` payload, so this is also pulled in by the `emit_to` path.
serde_json = { workspace = true }
# Desktop backend parses/navigates external URLs for the native webview, and
# also builds a `data:text/html;base64,…` URL for the chrome webview's source.
url = "2"
# Base64-encode the inline chrome HTML for a `data:text/html;base64,…` URL.
# A plain `data:text/html,…` URL would fail `Url::parse` on the HTML's
# special characters (spaces, quotes, `<`, `>`, `#`), and percent-encoding
# the whole document is ~6× the original size; base64 is ~1.35× and
# Url::parse handles it without escaping.
base64 = "0.23"
# Facade only — the host installs `tauri-plugin-log`, which is what actually
# routes these records. Used for the cookie-seed diagnostics: the seed is
# asynchronous, so its outcome can no longer be returned to the caller and has to
# be observable in the launch log instead.
log = "0.4"

# The macOS cookie seeding (`desktop/cookies/wkwebview.rs`) talks to WebKit directly
# instead of going through wry's `Webview::set_cookie`, which pumps a nested run
# loop inside tao's event handler and self-deadlocks the app. Every version here
# is one wry already pulls in, so these add no new crates to the lockfile and
# nothing new for cargo-deny to clear. `default-features = false` keeps the
# generated-binding surface to the classes actually used — the objc2 framework
# crates default to *every* class in the framework.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSHTTPCookie",
  "NSObject",
  "NSString",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "WKHTTPCookieStore",
  "WKWebsiteDataStore",
] }

[build-dependencies]
# Generates the per-command permissions + ACL schema from `COMMANDS` and wires
# the `ios/` Swift package into the host app at `tauri ios` codegen time.
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
# Drift-guard tests round-trip the wire models through JSON.
serde_json = { workspace = true }
# `download_name`'s collision tests probe a real directory with `Path::exists`.
tempfile = "3"

# `deny`, not the workspace's `forbid`, so exactly one module can opt out:
# `desktop/cookies/wkwebview.rs` (macOS) has to message WebKit's
# `WKHTTPCookieStore` directly — the wry cookie API deadlocks the app (see that
# module's doc), and `forbid` cannot be lifted by an `#[allow]` anywhere in the
# crate. `deny` keeps every *other* `unsafe` in the crate a hard error.
#
# The opt-out inside that file is per BLOCK, not module-wide — there is no inner
# `#![allow(unsafe_code)]`. Each `unsafe` block carries its own
# `#[allow(unsafe_code)]` on top of the `SAFETY` note justifying it, so the
# crate's whole unsafe surface is the set of those attribute lines and a new
# `unsafe` block cannot appear without a line that says so.
#
# The rest of the workspace still opts into `[workspace.lints]`, which defines
# only `unsafe_code = "forbid"`; nothing else is lost by not inheriting it here.
[lints.rust]
unsafe_code = "deny"
