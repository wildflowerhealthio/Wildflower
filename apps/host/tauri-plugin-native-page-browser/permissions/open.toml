# Hand-authored permission (NOT autogenerated): a richly-described grant for the
# `open` command. The stock `allow-open` in `autogenerated/commands/open.toml`
# carries only boilerplate; `default.toml` grants this one instead so the ACL
# documents what the command actually does.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "open"
description = """
Allow opening an external `http(s)` URL in the system's in-app browser, presented
as a native page: `SFSafariViewController` (iOS), a Custom Tab (Android), or the
default browser (desktop). A `Channel<BrowserEvent>` carries exactly one `closed`
event back per successful `open` once the view is gone (iOS and Android only;
desktop never sends one). On iOS a newer `open` replaces a showing view and
reports its close; on Android one arriving while a view is still opening joins
it, and one arriving while the app is in the background is rejected. The caller
cannot script or navigate the open page. Non-`http(s)` URLs are rejected.
"""
commands.allow = ["open"]
