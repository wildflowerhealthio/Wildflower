# Hand-authored permission (NOT autogenerated): a richly-described grant for the
# `close` command. The stock `allow-close` in `autogenerated/commands/close.toml`
# carries only boilerplate; `default.toml` grants this one instead so the ACL
# documents what the command actually does.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "close"
description = """
Allow closing a view `open` opened, by the `view` name it was opened under. On iOS
it dismisses that `SFSafariViewController` and any view presented over it, each
sending its `closed` event; a view already gone closes nothing. A Custom Tab
(Android) and a default-browser tab (desktop) can't be closed by the app, so
there it is rejected.
"""
commands.allow = ["close"]
