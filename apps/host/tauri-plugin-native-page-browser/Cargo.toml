[package]
name = "tauri-plugin-native-page-browser"
version = "0.0.0"
description = "Open a URL in the system's in-app browser as a native page, and report to Rust when it closes (iOS, Android, desktop)."
edition.workspace = true
publish.workspace = true
# Required for Tauri plugins that ship native (Swift/Kotlin) code: the value is a
# unique key Tauri's build tooling uses to associate the mobile sources with this
# crate. Must be unique across the dependency graph.
links = "tauri-plugin-native-page-browser"

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
# Parses the caller's URL so only `http(s)` reaches a browser.
url = "2"

# Desktop opens the default browser through the opener plugin's Rust API; the
# mobile backends present the in-app browser themselves.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"

[build-dependencies]
# Generates the per-command permissions + ACL schema from `COMMANDS` and wires
# the `ios/` Swift package and the `android/` Kotlin library into the host app at
# `tauri ios` / `tauri android` codegen time.
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
# Drift-guard tests read the wire models back as JSON.
serde_json = { workspace = true }

# Opt into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true
