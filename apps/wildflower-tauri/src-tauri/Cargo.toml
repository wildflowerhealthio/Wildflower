[package]
name = "wildflower-tauri"
version = "0.3.0"
description = "A Tauri App"
authors = ["Ruth Marks"]
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wildflower_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Parses the shared `tauri-shared-config.json` (single source of truth for
# the loopback hostname/port) in `build.rs`, re-emitting it as compile-time env
# vars for `src/lib.rs`.
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15.7"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
openssl = {version = "0.10.36", features = ["vendored"] } 
serde.workspace = true
serde_json.workspace = true
apps-rust = { path = "../../../slices/apps/apps-rust" }
# The server run the background service drives (`ServerHostContext`), built in
# `.setup()`.
background-server-service-rust = { path = "../../../slices/background-server-service/background-server-service-rust" }
# The background service that runs the server, and its status, restart and
# notification glue.
background-server-service-tauri-rust = { path = "../../../slices/background-server-service/background-server-service-tauri-rust" }
browser-sniffer-tauri-rust = { path = "../../../slices/browser-sniffer/browser-sniffer-tauri-rust" }
# Host glue for the HAR Recorder: the `BRIDGE_EVENT` listener that writes a
# recorded archive into `<app data dir>/saved_data`.
har-recorder-tauri-rust = { path = "../../../slices/har-recorder/har-recorder-tauri-rust" }
# The base's commands for adding a server and re-entering its token, over the
# install's `servers.json`. Registered in `run()`.
servers-tauri-rust = { path = "../../../slices/servers/servers-tauri-rust" }
# Native, JS-injectable web view (iOS, Android, desktop); runs in parallel
# with the browser-sniffer WebviewWindow path. Registered in `run()`.
tauri-plugin-native-webview = { path = "../../../plugins/tauri-plugin-native-webview" }
gatekeeper-rust = { path = "../../../slices/gatekeeper/gatekeeper-rust" }
# `ServerRuntimeConfig` and `OwnerUiBase` for the server config, and the bridge
# envelope the host's listeners decode.
shared-structures-rust = { path = "../../../slices/shared-structures/shared-structures-rust" }
# Provides `resolve_http_url`, the http(s)-only validator the apps launch flow
# gates its `RequestSandboxedWebView { url }` on before handing the URL to the
# native-webview plugin.
shared-structures-tauri-rust = { path = "../../../slices/shared-structures/shared-structures-tauri-rust" }
# The build-time tunnel `SettingsSeed` the host hands the server.
tunnel-rust = { path = "../../../slices/tunnel/tunnel-rust" }
# The Wildflower server's config and ports, which the host builds.
wildflower-server-rust = { path = "../../../slices/wildflower-server/wildflower-server-rust" }
anyhow.workspace = true
# Typed loopback base URL for the server's `ServerRuntimeConfig`.
url = "2"
tokio = { workspace = true, features = ["full"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# Local notifications about the server; registered before the background
# service, which posts through it.
tauri-plugin-notification = "2"
# Runs the server as a background service (in-process on desktop). Pinned
# exactly, as in `background-server-service-tauri-rust`.
tauri-plugin-background-service = "=1.0.1"
dotenvy = "0.15.7"

# Opt the host into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true

[dev-dependencies]
# Builds the `LoopbackConsentRequest` (its `expires_at`) the dialog tests render.
chrono = { version = "0.4", default-features = false }
# Parses the Android manifest the merge-override tests read.
roxmltree = "0.21"
