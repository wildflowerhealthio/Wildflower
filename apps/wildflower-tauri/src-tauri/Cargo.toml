[package]
name = "wildflower-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["Ruth Marks"]
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wildflower_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Parses the shared `tauri-shared-config.json` (single source of truth for
# the loopback hostname/port) in `build.rs`, re-emitting it as compile-time env
# vars for `src/lib.rs`.
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
emr-rust = { path = "../../../slices/emr/emr-rust" }
gatekeeper-rust = { path = "../../../slices/gatekeeper/gatekeeper-rust" }
shared-structures-rust = { path = "../../../slices/shared-structures/shared-structures-rust" }
anyhow.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tower-http.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
