[package]
name = "wildflower-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["Ruth Marks"]
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wildflower_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Parses the shared `tauri-shared-config.json` (single source of truth for
# the loopback hostname/port) in `build.rs`, re-emitting it as compile-time env
# vars for `src/lib.rs`.
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15.7"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
openssl = {version = "0.10.36", features = ["vendored"] } 
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
# The tunnel `/health` reachability probe. `rustls-tls` (no openssl) matches the
# project's openssl avoidance; `json` decodes the health body. reqwest is already
# a transitive dependency (via helios), so this adds no new build cost.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
apps-rust = { path = "../../../slices/apps/apps-rust" }
browser-sniffer-tauri-rust = { path = "../../../slices/browser-sniffer/browser-sniffer-tauri-rust" }
# Native, JS-injectable web view (iOS, Android, desktop); runs in parallel
# with the browser-sniffer WebviewWindow path. Registered in `run()`.
tauri-plugin-native-webview = { path = "../../../plugins/tauri-plugin-native-webview" }
databases-rust = { path = "../../../slices/databases/databases-rust" }
emr-rust = { path = "../../../slices/emr/emr-rust" }
gatekeeper-rust = { path = "../../../slices/gatekeeper/gatekeeper-rust" }
persistence-rust = { path = "../../../slices/persistence/persistence-rust" }
shared-structures-rust = { path = "../../../slices/shared-structures/shared-structures-rust", features = [
  "health-check",
] }
tunnel-rust = { path = "../../../slices/tunnel/tunnel-rust" }
anyhow.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["full"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tower-http.workspace = true
dotenvy = "0.15.7"

# Opt the host into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
