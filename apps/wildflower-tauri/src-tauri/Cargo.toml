[package]
name = "wildflower-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["Ruth Marks"]
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wildflower_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Parses the shared `tauri-shared-config.json` (single source of truth for
# the loopback hostname/port) in `build.rs`, re-emitting it as compile-time env
# vars for `src/lib.rs`.
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15.7"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
openssl = {version = "0.10.36", features = ["vendored"] } 
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
# The tunnel `/health` reachability probe. `rustls-tls` (no openssl) matches the
# project's openssl avoidance; `json` decodes the health body. reqwest is already
# a transitive dependency (via helios), so this adds no new build cost.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
apps-rust = { path = "../../../slices/apps/apps-rust" }
browser-sniffer-tauri-rust = { path = "../../../slices/browser-sniffer/browser-sniffer-tauri-rust" }
# Native, JS-injectable web view (iOS, Android, desktop); runs in parallel
# with the browser-sniffer WebviewWindow path. Registered in `run()`.
tauri-plugin-native-webview = { path = "../../../plugins/tauri-plugin-native-webview" }
collector-rust = { path = "../../../slices/collector/collector-rust" }
databases-rust = { path = "../../../slices/databases/databases-rust" }
emr-rust = { path = "../../../slices/emr/emr-rust" }
gatekeeper-rust = { path = "../../../slices/gatekeeper/gatekeeper-rust" }
# Built once on the shared db and threaded into both gatekeeper and the FHIR
# server so the auth gate and HFS read one revocation denylist/epoch store (#269).
token-revocation-rust = { path = "../../../slices/gatekeeper/token-revocation-rust" }
persistence-rust = { path = "../../../slices/persistence/persistence-rust" }
shared-structures-rust = { path = "../../../slices/shared-structures/shared-structures-rust", features = [
  "health-check",
  # The unified `/docs` Scalar surface — merge each slice's `openapi_spec()`
  # into one document and serve it (see `api_router` in `src/lib.rs`).
  "openapi-docs",
] }
# Provides `resolve_http_url`, the http(s)-only validator the apps launch flow
# gates its `RequestSandboxedWebView { url }` on before handing the URL to the
# native-webview plugin.
shared-structures-tauri-rust = { path = "../../../slices/shared-structures/shared-structures-tauri-rust" }
tunnel-rust = { path = "../../../slices/tunnel/tunnel-rust" }
# Server-side shared infra: the reverse proxy that dispatches inbound
# `<id>.<public-host>` forwarded requests to each self-hosted app's loopback
# port, plus the static-hosts runner the apps slice drives. Replaces the former
# in-app `subdomain_dispatch` module.
shared-structures-server-rust = { path = "../../../slices/shared-structures/shared-structures-server-rust" }
anyhow.workspace = true
axum.workspace = true
# Typed loopback base URL handed to `apps_rust::AppsConfig` (the apps slice
# derives the launch origin + self-hosted hostname from it).
url = "2"
tokio = { workspace = true, features = ["full"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tower-http.workspace = true
dotenvy = "0.15.7"

# Opt the host into the workspace lints (notably `unsafe_code = "forbid"`).
[lints]
workspace = true
