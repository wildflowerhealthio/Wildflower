[package]
name = "wildflower-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["Ruth Marks"]
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wildflower_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
emr-rust = { path = "../../../slices/emr/emr-rust" }
gatekeeper-rust = { path = "../../../slices/gatekeeper/gatekeeper-rust" }
shared-structures-rust = { path = "../../../slices/shared-structures/shared-structures-rust" }
anyhow.workspace = true
axum.workspace = true
tokio = { version = "1", features = ["full"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
