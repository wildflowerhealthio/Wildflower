"$schema" = "../gen/schemas/desktop-schema.json"

[[permission]]
identifier = "allow-server-management"
description = """
Grants the webview the right to invoke the app-defined `servers_list`,
`server_set_run_policy`, `server_update` and `server_remove` commands
(`servers-tauri-rust`): listing the install's servers with their status,
setting when each runs, setting its launcher and certificate source, and
deleting a server with its folder, databases and certificates.

SECURITY: granted to the `main` webview only (capabilities/default.json),
which runs the base. A webview holding this grant can start and stop the
install's servers and delete them, so it must never reach a capability that
matches a webview loading remote content.
"""
commands.allow = ["servers_list", "server_set_run_policy", "server_update", "server_remove"]
