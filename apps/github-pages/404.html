<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting&hellip;</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      /* Paint the design system's page canvas (`--color-canvas` in
       * react-tundraish's colors-custom.css) for the moment this page is on
       * screen, so the redirect doesn't flash white at dark-mode users. */
      html {
        background-color: #dedede;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #161616;
        }
      }
      /* Blank while the probe runs; shown only when no ancestor answers (a
       * closed PR preview, or a staging URL outside any preview), so the page
       * never sits on an empty "Redirecting…" tab. Text colour comes from
       * `color-scheme` above. */
      main {
        display: none;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding-top: 20vh;
      }
      html[data-not-found] main {
        display: block;
      }
    </style>
    <script>
      // GitHub Pages SPA redirect.  Probes for the deepest ancestor path
      // that serves an index.html and redirects there, passing the full
      // requested path as ?redirect= so the SPA can complete the navigation
      // client-side.  Works for both a standalone single-SPA Pages site and
      // a multi-SPA host where each app lives in its own sub-directory.
      // The path goes over site-absolute: an app-relative route named like
      // the app's own directory (`/app` below `/app/`) would read as the app
      // root.
      //
      // When nothing answers — no ancestor serves an index.html, or the
      // deepest one is the requested directory itself — the page turns into a
      // plain not-found page instead of staying blank.
      ;(async function () {
        var loc = window.location
        var segments = loc.pathname.split('/').filter(Boolean)

        function showNotFound() {
          document.title = 'Page not found'
          document.documentElement.dataset.notFound = ''
        }

        if (!segments.length) return showNotFound()

        function probe(depth) {
          var base = depth ? '/' + segments.slice(0, depth).join('/') + '/' : '/'
          return fetch(base + 'index.html', { method: 'HEAD' })
            .then(function (r) {
              return r.ok ? { base: base, depth: depth } : null
            })
            .catch(function () {
              return null
            })
        }

        // Probe every candidate ancestor in parallel; pick the deepest match.
        var probes = []
        for (var i = segments.length - 1; i >= 0; i--) probes.push(probe(i))
        var results = await Promise.all(probes)

        for (var j = 0; j < results.length; j++) {
          if (!results[j]) continue
          var spaPath = '/' + segments.slice(results[j].depth).join('/')
          if (spaPath === '/') break
          var params = new URLSearchParams(loc.search)
          params.set('redirect', loc.pathname)
          loc.replace(results[j].base + '?' + params.toString() + loc.hash)
          return
        }
        showNotFound()
      })()
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>Nothing is published at this address.</p>
    </main>
  </body>
</html>
